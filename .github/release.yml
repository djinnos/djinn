# Configures GitHub's auto-generated release notes (used by the release-notes
# job in .github/workflows/release.yml via `generate_release_notes: true`).
# PRs are grouped into the first category whose label matches; unlabeled PRs
# fall through to "Other Changes". Label your PRs to get richer sections.
changelog:
  exclude:
    authors:
      - dependabot
      - github-actions
      - 'github-actions[bot]'
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
        - feat
    - title: 🐛 Fixes
      labels:
        - fix
        - bug
    - title: 🏗️ Infra & Deploy
      labels:
        - infra
        - deploy
        - ci
        - k8s
    - title: 🧹 Chores & Refactoring
      labels:
        - chore
        - refactor
        - docs
    - title: Other Changes
      labels:
        - '*'
