# The live half of the in-place task-run resize proof (proposal 3i92, task pcod).
#
# `workflow_dispatch` ONLY. This lane creates a disposable kind cluster, builds
# a probe image and runs privileged cgroup assertions against it; it is not a
# required check, it does not run on `pull_request`, and it can never block the
# merge queue. The hermetic guards in `server/tests/task_run_resize_kind.rs`
# — the disjointness guard, both Kubernetes floors, the source gate, the
# render-derived pod-slice arithmetic, the strategic-patch guard and this
# workflow's own wiring — run on every PR in the ordinary server test lane with
# no cluster at all.
name: Resize Kind Proof

on:
  workflow_dispatch:
    inputs:
      k8s_version:
        description: Kubernetes version for the disposable kind node
        required: false
        default: "1.35.0"
      keep_on_failure:
        description: Leave the cluster running when the suite fails
        required: false
        default: "false"

concurrency:
  group: resize-kind-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resize-kind:
    name: Disposable resize-proof cluster
    # Belt and braces: if a later edit adds `pull_request` to the triggers
    # above, this keeps the lane from silently becoming a PR check that creates
    # a kind cluster on every push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_BUILD_DIR: target
      RUSTC_WRAPPER: ""
      RUSTFLAGS: "-D warnings"
      SQLX_OFFLINE: "true"
      DJINN_RESIZE_HARNESS_K8S_VERSION: ${{ github.event.inputs.k8s_version || '1.35.0' }}
      # The number of `#[ignore]`d live proofs the suite carries. Asserted by
      # `guard_the_live_lane_is_wired`, so deleting a proof fails the ordinary
      # PR lane rather than silently shrinking this one.
      RESIZE_KIND_EXPECTED_PROOFS: "3"
    steps:
      - uses: actions/checkout@v4

      - name: Install kind, helm and crictl-capable tooling
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          kind version
          kubectl version --client
          helm version

      - uses: dtolnay/rust-toolchain@stable

      # `save-if: false` is mandatory: every cache family in this repository has
      # exactly one writer, declared in quality-gate.yml and enforced by
      # scripts/ci-cache-policy.test.mjs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          save-if: false
          shared-key: server-test
          cache-on-failure: true
          cache-all-crates: true

      # The hermetic half first. If the guards are red there is no point paying
      # for a cluster, and a guard failure here is the same failure a PR sees.
      - name: Hermetic guards
        working-directory: server
        run: cargo test -p djinn-server --test task_run_resize_kind

      - name: Free space before the cluster
        run: df -h /

      - name: Bring up the disposable cluster
        run: |
          scripts/kind/setup-resize-kind-cluster.sh up \
            --k8s-version "${DJINN_RESIZE_HARNESS_K8S_VERSION}" \
            ${{ github.event.inputs.keep_on_failure == 'true' && '--keep-on-failure' || '' }}

      - name: Live proof
        working-directory: server
        env:
          DJINN_TEST_RESIZE_KIND: "1"
        run: |
          cargo test -p djinn-server --test task_run_resize_kind -- \
            --ignored --test-threads=1 --nocapture

      # Pass or fail. The script's own EXIT trap covers a failure inside `up`;
      # this covers a failure inside the suite, which the script never sees.
      - name: Tear the cluster down
        if: always() && github.event.inputs.keep_on_failure != 'true'
        run: scripts/kind/setup-resize-kind-cluster.sh down
