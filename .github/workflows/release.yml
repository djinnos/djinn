name: Release

# Builds + publishes every OCI image djinn ships to ghcr.io/djinnos.
# Replaces the split release-server / release-desktop / image-builder-
# publish workflows. Four images land in the registry per run:
#
#   djinn-server              — control plane, API + embedded UI on :3000
#   djinn-image-builder       — BuildKit wrapper used by image-controller
#   djinn-agent-runtime-base  — heavy base: rustup, sccache, mold, LSPs
#   djinn-agent-runtime       — thin top: runtime-base + djinn-agent-worker
#
# Triggers:
#   * tag push `v*`             — publishes SemVer tags (`:1.2.3`, `:1.2`, `:1`)
#                                 plus `:latest` and `:sha-<short>`. This is the
#                                 only image-building trigger: releases are cut by
#                                 tagging, so main pushes no longer rebuild (they
#                                 just double-built the tagged commit).
#   * workflow_dispatch         — manual rebuild with optional explicit tag.
#
# Binaries (djinn-server, djinn-agent-worker) build in dedicated jobs so
# they can share Swatinem/rust-cache; the image jobs COPY the pre-built
# artifact. runtime FROMs runtime-base at the current commit's sha tag
# so the two stay coherent.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. v1.2.3). `latest` and `sha-<short>` are always pushed."
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  # actions: read lets the binaries job poll for and download the ui-dist
  # artifact produced concurrently in this same run.
  actions: read

env:
  REGISTRY: ghcr.io
  OWNER: djinnos
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: ""
  # Explicit cargo default, present so the cargo-relevant env here is
  # byte-identical to quality-gate.yml's — Swatinem/rust-cache hashes
  # CARGO_*/RUST* env vars into its key, and the release-bins cache is
  # warmed by quality-gate's cache-warm-x86_64-release job on main.
  CARGO_BUILD_BUILD_DIR: target

jobs:
  # ── Image-only jobs (no rust compile) ─────────────────────────────────
  image-builder:
    name: djinn-image-builder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/djinn-image-builder
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          flavor: latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/djinn-image-builder.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=djinn-image-builder
          cache-to: type=gha,scope=djinn-image-builder,mode=max

  buildkitd:
    name: djinn-buildkitd
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # QEMU for the linux/arm64 half of the multi-arch build below.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/djinn-buildkitd
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          flavor: latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/djinn-buildkitd.Dockerfile
          # arm64 keeps the image pullable on kind-on-Apple-Silicon and
          # Graviton nodes; the Dockerfile resolves helper URLs via TARGETARCH.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=djinn-buildkitd
          cache-to: type=gha,scope=djinn-buildkitd,mode=max

  runtime-base:
    name: djinn-agent-runtime-base
    runs-on: ubuntu-24.04
    outputs:
      sha_tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "tag=sha-$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/djinn-agent-runtime-base
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          flavor: latest=auto
      - name: Build runtime-base locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/djinn-agent-runtime-base.Dockerfile
          platforms: linux/amd64
          load: true
          tags: djinn-agent-runtime-base:validation
          cache-from: type=gha,scope=djinn-agent-runtime-base
          cache-to: type=gha,scope=djinn-agent-runtime-base,mode=max
      - name: Build representative generated Rust image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/image-ci/generated-rust.Dockerfile
          platforms: linux/amd64
          load: true
          tags: djinn-generated-rust:validation
      - name: Validate mold compatibility for both installation paths
        run: |
          set -euo pipefail
          mkdir -p evidence/runtime-base evidence/generated-rust
          docker run --rm -v "$PWD:/validation" --entrypoint bash djinn-agent-runtime-base:validation /validation/scripts/image-ci/probe-mold-compatibility.sh --evidence-dir /validation/evidence/runtime-base
          docker run --rm -v "$PWD:/validation" --entrypoint bash djinn-generated-rust:validation /validation/scripts/image-ci/probe-mold-compatibility.sh --evidence-dir /validation/evidence/generated-rust
      # RUSTUP_HOME must point at the BAKED toolchain. The image ships
      # RUSTUP_HOME=/cache/rustup (an empty dir) and relies on the top image's
      # entrypoint to seed it from RUSTUP_SEED_DIR=/usr/local/rustup on first
      # start. `--entrypoint bash` bypasses that seeding, so rustup finds no
      # default toolchain and cargo dies with "could not choose a version of
      # cargo to run" before mold is ever invoked.
      - name: Run runtime-base mold thread-cap smoke
        run: docker run --rm -e RUSTUP_HOME=/usr/local/rustup -v "$PWD:/validation" --entrypoint bash djinn-agent-runtime-base:validation /validation/scripts/image-ci/run-mold-thread-smoke.sh --threads 4 --evidence-dir /validation/evidence/runtime-base
      - name: Upload mold image validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mold-image-validation-evidence
          path: evidence
          if-no-files-found: warn
      - name: Publish validated runtime-base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/djinn-agent-runtime-base.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=djinn-agent-runtime-base
          cache-to: type=gha,scope=djinn-agent-runtime-base,mode=max

  # ── UI build (parallel with the worker cargo build) ───────────────────
  ui-dist:
    name: UI dist for server embed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1
          if-no-files-found: error

  # ── Rust binary job (produces artifacts the image jobs COPY in) ───────
  # Both release binaries build in ONE job sharing a single `server/target`
  # dir + one Swatinem cache, so the common dependency graph (tokio, sqlx,
  # axum, …) compiles ONCE instead of twice. Two SEQUENTIAL cargo builds —
  # NOT a unified `-p A -p B` — keep each binary's exact feature resolution
  # (a unified build would feature-unify qdrant onto worker deps). Worker
  # first (default features, no qdrant), then server (adds qdrant on top),
  # reusing the on-disk artifacts of the shared non-qdrant deps.
  #
  # The UI builds in the parallel ui-dist job above; rust-embed reads
  # `ui/dist/` at compile time during the SERVER build only, so the worker
  # build starts immediately and the dist artifact is fetched between the
  # two cargo builds (deliberately no `needs:` edge — that would serialize
  # the ~3-minute pnpm build ahead of the worker compile).
  binaries:
    name: djinn-server + djinn-agent-worker binaries (+ UI embed)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: "true"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - name: Install mold
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: release-bins
          cache-on-failure: true
          cache-all-crates: true
          # Restore-only: this workflow runs on v* tag refs, and a cache
          # saved on one tag ref is invisible to every other ref — a
          # `save-if: true` here writes a cache no future release can
          # restore (verified: three consecutive releases each logged
          # "No cache found" then "Saving cache"). The release-bins family
          # is owned and saved by quality-gate.yml's
          # cache-warm-x86_64-release job on main pushes; default-branch
          # caches are readable from all refs, including tag runs.
          save-if: false
      # Worker FIRST so its deps resolve WITHOUT qdrant (default features);
      # the server build then layers only the qdrant-extra deps on top,
      # reusing every shared non-qdrant artifact already on disk.
      - name: Cargo build worker
        run: cargo build --release --locked -p djinn-agent-worker
      - name: Wait for and fetch UI dist for the server embed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The ui-dist job (~3 min) runs concurrently with the worker
          # build above (longer even when warm), so this normally exits on
          # the first probe. Fail-closed: the server binary must never
          # ship the build.rs placeholder UI.
          for attempt in $(seq 1 60); do
            artifact_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=ui-dist" \
              --jq '.artifacts[0].id // empty')
            if [ -n "$artifact_id" ]; then
              mkdir -p ../ui/dist
              gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > /tmp/ui-dist.zip
              unzip -q -o /tmp/ui-dist.zip -d ../ui/dist
              rm /tmp/ui-dist.zip
              test -s ../ui/dist/index.html || { echo "::error::ui-dist artifact lacks index.html"; exit 1; }
              exit 0
            fi
            ui_state=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "UI dist for server embed")][0].conclusion // empty')
            case "$ui_state" in
              failure|cancelled|timed_out)
                echo "::error::UI dist job concluded '$ui_state' without publishing an artifact."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for the ui-dist artifact."
          exit 1
      - name: Cargo build server
        run: cargo build --release --locked --features qdrant -p djinn-server
      - name: Stage + strip binaries
        run: |
          mkdir -p ../stage
          cp target/release/djinn-server ../stage/djinn-server
          strip ../stage/djinn-server
          cp target/release/djinn-agent-worker ../stage/djinn-agent-worker
          strip ../stage/djinn-agent-worker
      - uses: actions/upload-artifact@v4
        with:
          name: djinn-server-bin
          path: stage/djinn-server
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: djinn-agent-worker-bin
          path: stage/djinn-agent-worker
          retention-days: 1
          if-no-files-found: error

  # ── Image jobs that consume a binary ──────────────────────────────────
  server:
    name: djinn-server
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: djinn-server-bin
          path: .
      - run: chmod +x djinn-server
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/djinn-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          flavor: latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/djinn-server.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  runtime:
    name: djinn-agent-runtime
    # Needs the pre-built worker binary and the base image at the same
    # commit's sha tag (FROM arg below) — without both, the runtime image
    # would either be missing the binary or built on a stale base.
    needs: [runtime-base, binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: djinn-agent-worker-bin
          path: .
      - run: chmod +x djinn-agent-worker
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/djinn-agent-runtime
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          flavor: latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/djinn-agent-runtime.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/djinn-agent-runtime-base:${{ needs.runtime-base.outputs.sha_tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── Changelog / GitHub Release (tag pushes only) ──────────────────────
  # Publishes a GitHub Release for the tag with notes auto-generated from the
  # PRs merged since the previous tag. Gated on the server + runtime image
  # jobs so a published Release always corresponds to images that shipped.
  # Categories + exclusions come from `.github/release.yml`.
  release-notes:
    name: GitHub Release + changelog
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish GitHub Release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
