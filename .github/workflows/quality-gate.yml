name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Shared environment for all jobs.
# RUSTC_WRAPPER is cleared to disable local sccache in CI; the
# Swatinem/rust-cache action handles caching instead.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_BUILD_DIR: target
  RUSTC_WRAPPER: ""

jobs:
  # ── Change detection ────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/Cargo.toml'
              - 'server/Cargo.lock'
              - 'server/rust-toolchain.toml'
              - 'server/.cargo/**'
              - 'server/.config/**'
              - 'server/crates/**/Cargo.toml'
              - 'server/crates/**/*.rs'
              - 'server/src/**/*.rs'
              - '.github/workflows/quality-gate.yml'
            ui:
              - 'ui/**'

  # ╔══════════════════════════════════════════════════════════════════╗
  # ║  Cache Warming (main push only)                                 ║
  # ║                                                                  ║
  # ║  These jobs build the workspace to pre-populate GitHub Actions   ║
  # ║  cache after every merge to main.  PR jobs set save-if: false    ║
  # ║  so they never write cache — guaranteeing consistent warm hits   ║
  # ║  from the last main commit.                                      ║
  # ╚══════════════════════════════════════════════════════════════════╝

  warm-cache-quality:
    name: Warm Cache (Quality)
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # No MySQL service in this job. Force sqlx to read from the
      # committed `.sqlx/` offline cache instead of trying to connect to
      # the DATABASE_URL baked into `.cargo/config.toml`.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install
        working-directory: server

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server-quality
          cache-on-failure: true
          cache-all-crates: true

      - name: Build workspace (populate cache)
        run: cargo check --workspace --all-targets --all-features

      - name: Prune old caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo ${{ github.repository }} --key server-quality- \
            --sort created_at --order asc --json id | \
            jq -r '.[:-1].[].id' | \
            xargs -r -I{} gh cache delete {} --repo ${{ github.repository }} 2>/dev/null || true

  warm-cache-test:
    name: Warm Cache (Test)
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # No MySQL service in this job (it only compiles, --no-run).
      # Force sqlx to read from the committed `.sqlx/` offline cache.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install
        working-directory: server

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server-test
          cache-on-failure: true
          cache-all-crates: true

      - uses: taiki-e/install-action@nextest

      - name: Build test binaries (populate cache)
        run: cargo nextest run --workspace --all-targets --all-features --no-run

      - name: Prune old caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo ${{ github.repository }} --key server-test- \
            --sort created_at --order asc --json id | \
            jq -r '.[:-1].[].id' | \
            xargs -r -I{} gh cache delete {} --repo ${{ github.repository }} 2>/dev/null || true

  # ╔══════════════════════════════════════════════════════════════════╗
  # ║  Server Quality & Tests                                          ║
  # ║                                                                  ║
  # ║  These jobs read warm cache (save-if: false) and run the actual  ║
  # ║  quality gates.  On main pushes the warm-cache jobs above write  ║
  # ║  the cache; on PRs these jobs consume it.                        ║
  # ╚══════════════════════════════════════════════════════════════════╝

  server-clippy:
    name: Server Clippy
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=mold"
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install
        working-directory: server

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server-quality
          cache-on-failure: true
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify workspace-hack (hakari)
        run: |
          cargo install cargo-hakari --locked 2>/dev/null || true
          cargo hakari verify || {
            echo "::error::workspace-hack is out of date. Run 'cargo hakari generate && cargo hakari manage-deps' locally."
            exit 1
          }

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  server-test:
    name: Server Test
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=mold"
      DJINN_TEST_MYSQL_URL: "mysql://root@127.0.0.1:3308"
    # Ephemeral MySQL for djinn-db integration tests. The workspace
    # `.cargo/config.toml` points DATABASE_URL and DJINN_TEST_MYSQL_URL
    # at :3308, matching the `mysql-test` service in docker-compose.yml —
    # CI inherits those values automatically, so we just need the port
    # forwarded here.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: djinn
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install
        working-directory: server

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server-test
          cache-on-failure: true
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@nextest

      # Prebuilt binary — avoids a multi-minute Rust build of sqlx-cli.
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Apply djinn-db migrations
        working-directory: server/crates/djinn-db
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3308/djinn
        run: sqlx migrate run --source migrations_mysql

      - name: Build MySQL test template
        run: |
          until mysql -h 127.0.0.1 -P 3308 -uroot -e "SELECT 1" >/dev/null 2>&1; do sleep 1; done
          mysql -h 127.0.0.1 -P 3308 -uroot -e "DROP DATABASE IF EXISTS djinn_test_template; CREATE DATABASE djinn_test_template"
          cd server/crates/djinn-db && DATABASE_URL=mysql://root@127.0.0.1:3308/djinn_test_template sqlx migrate run --source migrations_mysql

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@test.local"
          git config --global user.name "CI Test"

      - name: Tests
        run: cargo nextest run --workspace --all-targets --all-features --profile ci

  # ╔══════════════════════════════════════════════════════════════════╗
  # ║  sqlx offline-cache freshness gate                               ║
  # ║                                                                  ║
  # ║  The compile-checked `sqlx::query!` macros validate SQL against  ║
  # ║  a live schema. Their results are committed to `server/.sqlx/`   ║
  # ║  so the rest of CI (and prod builds) can compile with            ║
  # ║  SQLX_OFFLINE=true. If a query changes but the cache isn't       ║
  # ║  regenerated (`make sqlx-prepare`), the offline build silently   ║
  # ║  uses stale type info. This job stands up a Postgres matching    ║
  # ║  the schema and fails if the committed cache is out of date.     ║
  # ╚══════════════════════════════════════════════════════════════════╝

  server-sqlx-cache:
    name: Server sqlx Cache
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # `cargo sqlx prepare --check` connects to DATABASE_URL to re-derive
      # each query's type info, then diffs it against the committed
      # `.sqlx/`. Point it at the ephemeral Postgres service below.
      DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5433/djinn"
    # Ephemeral Postgres mirroring the prod backend (the MySQL cut-over
    # shipped in v0.2.x). Port :5433 matches the workspace
    # `.cargo/config.toml` so the sqlx macros resolve the same DB.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: djinn
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install
        working-directory: server

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server-quality
          cache-on-failure: true
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Prebuilt binary — avoids a multi-minute Rust build of sqlx-cli.
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Apply djinn-db migrations
        working-directory: server/crates/djinn-db
        run: sqlx migrate run --source migrations_postgres

      - name: Verify .sqlx offline cache is up to date
        run: cargo sqlx prepare --check --workspace

  # ╔══════════════════════════════════════════════════════════════════╗
  # ║  UI                                                              ║
  # ╚══════════════════════════════════════════════════════════════════╝

  ui-frontend:
    name: UI Frontend
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Tests
        run: pnpm test

  # ── Quality gate ────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - warm-cache-quality
      - warm-cache-test
      - server-clippy
      - server-test
      - server-sqlx-cache
      - ui-frontend
    steps:
      - name: Check results
        run: |
          results=(
            "${{ needs.warm-cache-quality.result }}"
            "${{ needs.warm-cache-test.result }}"
            "${{ needs.server-clippy.result }}"
            "${{ needs.server-test.result }}"
            "${{ needs.server-sqlx-cache.result }}"
            "${{ needs.ui-frontend.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "Quality gate failed: found result '$r'"
              exit 1
            fi
          done
          echo "All checks passed (or were skipped)"
