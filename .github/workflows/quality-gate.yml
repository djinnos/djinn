name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group: null
  workflow_dispatch: null
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'ci-main' || github.event_name == 'merge_group' && format('ci-merge-group-{0}', github.event.merge_group.head_sha || github.ref) || format('ci-dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
# actions: write lets the in-shard fail-fast watcher cancel the run when
# another lane concludes failure (and covers the planner's artifact reads
# and the shards' plan polling). NOTE: an external workflow_job-triggered
# cancel workflow is NOT possible — workflow_job is a webhook event, not
# a workflow trigger; a file declaring it is invalid and produces a red
# zero-job run on every push.
permissions:
  contents: read
  actions: write
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_BUILD_DIR: target
  RUSTC_WRAPPER: ""
  RUSTFLAGS: -D warnings
jobs:
  preflight:
    name: Preflight routing
    runs-on: ubuntu-latest
    outputs:
      cargoDeny: ${{ steps.router.outputs.cargoDeny }}
      clippy: ${{ steps.router.outputs.clippy }}
      aarch64: ${{ steps.router.outputs.aarch64 }}
      size: ${{ steps.router.outputs.size }}
      migrations: ${{ steps.router.outputs.migrations }}
      rawSql: ${{ steps.router.outputs.rawSql }}
      capability: ${{ steps.router.outputs.capability }}
      boundaries: ${{ steps.router.outputs.boundaries }}
      serverTest: ${{ steps.router.outputs.serverTest }}
      sqlxFreshness: ${{ steps.router.outputs.sqlxFreshness }}
      memoryEval: ${{ steps.router.outputs.memoryEval }}
      tiltContracts: ${{ steps.router.outputs.tiltContracts }}
      ui: ${{ steps.router.outputs.ui }}
      qaSmoke: ${{ steps.router.outputs.qaSmoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify routed-scope contract
        run: node --test scripts/ci-changed-scope.test.mjs
      - name: Verify cache ownership policy
        run: node --test scripts/ci-cache-policy.test.mjs
      - name: Verify qa-smoke workflow contract
        run: node --test scripts/ci-qa-smoke-workflow.test.mjs
      - name: Verify retirement manifest generator contract
        run: node --test scripts/test-djinn-retirement-manifest.mjs
      - name: Run retirement manifest strict reconciliation guard
        run: ./scripts/check-djinn-retirement-manifest.sh
      - name: Compute safe event diff and route it
        id: router
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          full_validation=false
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            merge_group) base="$MERGE_BASE"; head="$MERGE_HEAD" ;;
            push)
              base="$PUSH_BEFORE"; head="$PUSH_AFTER"
              if [ -z "$head" ] || [ "$head" = "$zero" ]; then head="$GITHUB_SHA"; fi
              if [ -z "$base" ] || [ "$base" = "$zero" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="$head"; full_validation=true; fi
              ;;
            workflow_dispatch) base="$GITHUB_SHA"; head="$GITHUB_SHA"; full_validation=true ;;
            *) echo "::error::unsupported event $EVENT_NAME"; exit 1 ;;
          esac
          [ -n "$base" ] && [ -n "$head" ] || { echo '::error::missing explicit revisions'; exit 1; }
          git cat-file -e "$base^{commit}"
          git cat-file -e "$head^{commit}"
          if [ "$full_validation" = true ]; then
            git ls-tree -rz --name-only "$head" > changed-files.z
          elif [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ]; then
            git diff -z --name-only "$base...$head" > changed-files.z
          else
            git diff -z --name-only "$base..$head" > changed-files.z
          fi
          args=(--event "$EVENT_NAME" --base "$base" --head "$head" --files0-file changed-files.z --github-output "$GITHUB_OUTPUT")
          if [ "$full_validation" = true ]; then args+=(--full-validation); fi
          mkdir -p preflight
          node scripts/ci-changed-scope.mjs "${args[@]}" > preflight/manifest.json
      - name: Upload routing manifest
        uses: actions/upload-artifact@v4
        with:
          name: preflight-manifest
          path: preflight/manifest.json
          if-no-files-found: error
          retention-days: 30
  local-dev-contracts:
    name: Local Dev Contracts
    needs: preflight
    if: needs.preflight.outputs.tiltContracts == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.12.3
      - name: Install checksum-verified Tilt
        env:
          TILT_VERSION: 0.35.1
          TILT_SHA256: 065fd7ced548e30e2959f4b46273e987b9a46c5b78cf94da6946b84e7e3b3396
        run: |
          set -euo pipefail
          archive="tilt.${TILT_VERSION}.linux.x86_64.tar.gz"
          install_dir="$RUNNER_TEMP/tilt-bin"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 10 --max-time 120 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/tilt-dev/tilt/releases/download/v${TILT_VERSION}/$archive"
          printf '%s  %s\n' "$TILT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$install_dir" tilt
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Check local-dev shell syntax
        run: |
          bash -n \
            scripts/kind/setup-kind.sh \
            scripts/tilt/build-binaries.sh \
            scripts/tilt/build-ui.sh \
            scripts/tilt/input-fingerprint.sh \
            scripts/tilt/wrap-agent-runtime-image.sh \
            scripts/test-tilt-warm-restart.sh \
            scripts/test-tiltfile-config.sh \
            scripts/test-wrap-agent-runtime-image.sh \
            scripts/test-helm-github-app-render.sh
      - name: Test content-addressed warm builds
        run: bash scripts/test-tilt-warm-restart.sh
      - name: Test isolated Tilt configuration
        run: KUBECONFIG=/dev/null sh scripts/test-tiltfile-config.sh
      - name: Test runtime-base self-healing wrapper
        run: bash scripts/test-wrap-agent-runtime-image.sh
      - name: Lint local and default Helm values
        run: |
          helm lint deploy/helm/djinn
          helm lint deploy/helm/djinn --values deploy/helm/djinn/values.local.yaml
      - name: Test Helm rendering contracts
        run: bash scripts/test-helm-github-app-render.sh
  main-admission:
    name: Main admission delay
    needs: preflight
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: sleep 90
  cache-warm-x86_64-quality:
    name: Cache Warm x86_64 (Quality)
    needs:
      - preflight
      - main-admission
    if: github.event_name == 'push' && needs.preflight.outputs.clippy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
        working-directory: server
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server-quality
          cache-on-failure: true
          save-if: true
          cache-all-crates: true
        id: rust-cache
      - name: Log cache family and restore status
        run: |-
          echo "cache-family=server-quality"
          echo "shared-key=server-quality"
          echo "runner-os=${{ runner.os }}"
          echo "rustc=$(rustc --version || echo 'unknown')"
          echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          echo "::notice::cache-family=server-quality shared-key=server-quality cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
      - name: Build workspace (populate cache)
        run: cargo clippy --all-targets --features qdrant -- -D warnings
  # workflow_dispatch is a supported warm route so the test cache can be
  # (re)seeded on demand — e.g. from a branch before a cache-family
  # migration lands — not just on main pushes. The push-only admission
  # delay lives inline as a step because a `needs: main-admission` edge
  # would auto-skip this job on dispatch (skipped dependency).
  # NOTE: a full arm64 trial (2026-07-18, PR #2275 branch) measured
  # GitHub's free ubuntu-24.04-arm runners slower than x64 for this
  # workspace with a genuinely warm cache: shard builds 316-385s vs
  # 272-289s (~15-35% slower) and test execution 285-310s vs 230-239s
  # (~25% slower), roughly +1.5-2.5 min per run. Keep the lane on x64
  # unless those runners improve. (Cache-scoping gotcha from the trial:
  # PR merge-ref runs cannot restore head-branch-scoped caches — only
  # base/default branch scopes — so branch-seeded warm caches look
  # cold from the PR run.)
  cache-warm-x86_64-test:
    name: Cache Warm x86_64 (Test)
    needs:
      - preflight
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.preflight.outputs.serverTest == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Main admission delay
        if: github.event_name == 'push'
        run: sleep 90
      - uses: actions/checkout@v4
      - run: rustup toolchain install
        working-directory: server
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server-test
          cache-on-failure: true
          save-if: true
          cache-all-crates: true
        id: rust-cache
      - uses: taiki-e/install-action@nextest
      - name: Build test binaries (populate cache)
        run: cargo nextest run --workspace --all-targets --features qdrant --no-run
      - name: Log cache family and restore status
        run: |-
          echo "cache-family=server-test"
          echo "shared-key=server-test"
          echo "runner-os=${{ runner.os }}"
          echo "rustc=$(rustc --version || echo 'unknown')"
          echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          echo "::notice::cache-family=server-test shared-key=server-test cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
        if: always()
  # Release builds trigger only on v* tag pushes, and GitHub caches saved on
  # a tag ref are invisible to every other ref — so a cache saved BY a
  # release run can never be restored by the next release, and every release
  # cold-compiled the workspace (~22 min of a ~25 min run). Caches created
  # on the DEFAULT branch are readable from all refs, so main owns the
  # release-bins family and release.yml is a restore-only consumer.
  # The env below must stay byte-identical to the release binaries job's
  # cargo-relevant env (RUSTFLAGS, CARGO_*): Swatinem/rust-cache hashes
  # those env vars into the cache key, and any drift silently produces a
  # second, unreachable cache family.
  cache-warm-x86_64-release:
    name: Cache Warm x86_64 (Release)
    needs:
      - preflight
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.preflight.outputs.serverTest == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: "true"
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - name: Main admission delay
        if: github.event_name == 'push'
        run: sleep 90
      - uses: actions/checkout@v4
      - run: rustup toolchain install
        working-directory: server
      - name: Install mold
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: release-bins
          cache-on-failure: true
          save-if: true
          cache-all-crates: true
        id: rust-cache
      - name: Log cache family and restore status
        run: |-
          echo "cache-family=release-bins"
          echo "shared-key=release-bins"
          echo "runner-os=${{ runner.os }}"
          echo "rustc=$(rustc --version || echo 'unknown')"
          echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          echo "::notice::cache-family=release-bins shared-key=release-bins cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
      # No UI build here: rust-embed bakes ui/dist at compile time, so
      # warming without it embeds the build.rs placeholder. That only
      # affects the final djinn-server crate's own artifact — every
      # dependency and intermediate workspace artifact still populates the
      # cache the release job restores. Worker first, then server, in the
      # same order and with the same flags as release.yml so feature
      # resolution matches (a unified build would feature-unify qdrant
      # onto worker deps).
      - name: Cargo build worker (populate cache)
        run: cargo build --release --locked -p djinn-agent-worker
      - name: Cargo build server (populate cache)
        run: cargo build --release --locked --features qdrant -p djinn-server
  cache-warm-aarch64:
    name: Cache Warm aarch64
    needs:
      - preflight
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.preflight.outputs.aarch64 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: "true"
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      OPENSSL_NO_VENDOR: "0"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
        working-directory: server
      - run: rustup target add aarch64-unknown-linux-gnu
        working-directory: server
      - name: Install cross C toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server-aarch64-check
          cache-on-failure: true
          save-if: true
        id: rust-cache
      - name: Log cache family and restore status
        run: |-
          echo "cache-family=server-aarch64-check"
          echo "shared-key=server-aarch64-check"
          echo "runner-os=${{ runner.os }}"
          echo "rustc=$(rustc --version || echo 'unknown')"
          echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          echo "::notice::cache-family=server-aarch64-check shared-key=server-aarch64-check cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
      - name: cargo check (aarch64)
        run: cargo check -p djinn-sandbox --all-targets --target aarch64-unknown-linux-gnu
  # One runner for every cheap guard lane. Each lane was previously its own
  # job doing ~15s of scripting behind ~30s of runner spin-up and a full
  # fetch-depth: 0 clone; merging them frees four to five concurrent job
  # slots per run for the merge queue. Preflight routing granularity is
  # preserved through per-step `if` guards on the same router outputs, and
  # the quality gate pairs the union of those selections with this job's
  # result.
  server-guards:
    name: Server Guards
    needs: preflight
    if: >-
      github.event_name != 'push' && (
        needs.preflight.outputs.cargoDeny == 'true'
        || needs.preflight.outputs.size == 'true'
        || needs.preflight.outputs.migrations == 'true'
        || needs.preflight.outputs.rawSql == 'true'
        || needs.preflight.outputs.capability == 'true'
        || needs.preflight.outputs.boundaries == 'true'
      )
    runs-on: ubuntu-latest
    env:
      BASE_SHA: |-
        ${{ github.event.pull_request.base.sha
           || github.event.merge_group.base_sha
           || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup toolchain install
        if: needs.preflight.outputs.cargoDeny == 'true'
        working-directory: server
      - uses: taiki-e/install-action@v2
        if: needs.preflight.outputs.cargoDeny == 'true'
        with:
          tool: cargo-deny
      - name: cargo-deny check
        if: needs.preflight.outputs.cargoDeny == 'true'
        working-directory: server
        run: |
          # Retry up to 3 times with backoff — crates.io downloads can
          # fail transiently (Connection reset by peer, DNS hiccups).
          for attempt in 1 2 3; do
            echo "::group::cargo-deny check (attempt $attempt)"
            if cargo deny check; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 10))
              echo "::warning::cargo-deny check failed (attempt $attempt), retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "::error::cargo-deny check failed after 3 attempts"
          exit 1
      - name: Check changed Rust file sizes
        if: needs.preflight.outputs.size == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu

          if [ -z "$BASE_SHA" ]; then
            # workflow_dispatch has no PR/merge context; fall back to origin/main
            # so the guard still runs against changes since the main branch.
            git fetch --no-tags --depth=1 origin main >/dev/null 2>&1 || true
            BASE_SHA="$(git rev-parse --verify origin/main 2>/dev/null || true)"
          fi

          if [ -z "$BASE_SHA" ]; then
            echo "::error::Could not determine a base SHA for changed-file detection (event=$EVENT_NAME)."
            exit 1
          fi

          echo "Computing changed-file diff against base $BASE_SHA (event=$EVENT_NAME)..."
          # --diff-filter=AMR = Added, Modified, Renamed. D (Deleted) is
          # intentionally excluded so deleted files are not re-checked.
          # The three-dot form uses the merge base of $BASE_SHA and HEAD,
          # which tolerates a slightly stale PR base SHA after main advances.
          git diff --name-only --diff-filter=AMR "$BASE_SHA...HEAD" \
            | ./scripts/check-file-size.sh --files-from-stdin
      - name: Check applied migrations are immutable
        if: needs.preflight.outputs.migrations == 'true'
        run: ./scripts/check-migrations-immutable.sh
      - name: Check raw-SQL boundary
        if: needs.preflight.outputs.rawSql == 'true'
        run: ./scripts/check-raw-sql-boundary.sh
      - name: Self-test capability boundary detectors
        if: needs.preflight.outputs.capability == 'true'
        run: ./scripts/test-capability-boundaries.sh
      - name: Check capability boundaries
        if: needs.preflight.outputs.capability == 'true'
        run: |
          ./scripts/check-git-boundary.sh
          ./scripts/check-http-boundary.sh
          ./scripts/check-k8s-boundary.sh
      - name: Check architectural boundaries
        if: needs.preflight.outputs.boundaries == 'true'
        run: python3 scripts/check_boundaries.py
  server-clippy:
    name: Server Clippy
    needs: preflight
    if: needs.preflight.outputs.clippy == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
        working-directory: server
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server-quality
          cache-on-failure: true
          cache-all-crates: true
          save-if: false
        id: rust-cache
      - name: Log cache family and restore status
        run: |-
          echo "cache-family=server-quality"
          echo "shared-key=server-quality"
          echo "runner-os=${{ runner.os }}"
          echo "rustc=$(rustc --version || echo 'unknown')"
          echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          echo "::notice::cache-family=server-quality shared-key=server-quality cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
      - uses: taiki-e/install-action@v2
        if: github.event_name != 'merge_group'
        with:
          tool: cargo-hakari
      - name: Verify workspace-hack (hakari)
        if: github.event_name != 'merge_group'
        run: |
          cargo hakari verify || {
            echo "::error::workspace-hack is out of date. Run 'cargo hakari generate && cargo hakari manage-deps' locally."
            exit 1
          }
      - name: Verify skills manifest is up to date
        if: github.event_name != 'merge_group'
        run: cargo run -p djinn-agent --bin djinn-skills-manifest -- check --root ..
      - name: Clippy
        run: cargo clippy --all-targets --features qdrant -- -D warnings
  server-aarch64-check:
    name: Server aarch64 Check
    needs: preflight
    if: needs.preflight.outputs.aarch64 == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: "true"
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      OPENSSL_NO_VENDOR: "0"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
        working-directory: server
      - run: rustup target add aarch64-unknown-linux-gnu
        working-directory: server
      - name: Install cross C toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server-aarch64-check
          cache-on-failure: true
          save-if: false
        id: rust-cache
      - name: Log cache family and restore status
        run: |-
          echo "cache-family=server-aarch64-check"
          echo "shared-key=server-aarch64-check"
          echo "runner-os=${{ runner.os }}"
          echo "rustc=$(rustc --version || echo 'unknown')"
          echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          echo "::notice::cache-family=server-aarch64-check shared-key=server-aarch64-check cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
      - name: cargo check (aarch64)
        run: cargo check -p djinn-sandbox --all-targets --target aarch64-unknown-linux-gnu
  nextest-plan:
    name: Plan Server Test Shards
    needs: preflight
    if: needs.preflight.outputs.serverTest == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      coldStart: ${{ steps.plan.outputs.coldStart }}
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
        working-directory: server
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server-test
          cache-on-failure: true
          cache-all-crates: true
          save-if: false
      - uses: taiki-e/install-action@nextest
      - name: Discover current nextest tests and plan exact-once shards
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) profile=pull-request ;;
            merge_group) profile=merge-group ;;
            *) profile=full-validation ;;
          esac
          # Discover first so each candidate can be checked by the planner against
          # the authoritative current test set before that candidate is selected.
          mkdir -p nextest-plan
          (
            cd server
            cargo nextest list --workspace --all-targets --features qdrant --message-format json
          ) > nextest-plan/discovery.json
          # Restore the latest successful timing artifact. This can fail because of
          # missing artifacts, stale/incompatible data, or GitHub API rate limits;
          # in every failure case the planner cold-starts safely from current discovery.
          # We paginate a bounded number of pages newest-first. For each successful
          # workflow candidate we independently attempt download, extraction, and
          # structural validation. Any candidate-specific failure causes us to continue
          # to the next older successful candidate; we only cold-start once the bounded
          # search is exhausted or the API cannot be queried.
          MAX_PAGES=5
          mkdir -p nextest-timing
          restored=0
          for page in $(seq 1 "$MAX_PAGES"); do
            page_response="$(mktemp)"
            page_candidates="$(mktemp)"
            set +e
            gh api "repos/${{ github.repository }}/actions/artifacts?name=nextest-timing&per_page=10&page=$page" \
              > "$page_response" 2> nextest-timing/restore.log
            api_status=$?
            set -e
            if [ "$api_status" -ne 0 ]; then
              echo "::notice::GitHub API query for timing artifacts failed; using cold-start balancing."
              rm -f "$page_response" "$page_candidates"
              break
            fi
            jq -r '.artifacts[] | select(.workflow_run.conclusion == "success") | .id' "$page_response" > "$page_candidates"
            artifact_count="$(jq '.artifacts | length' "$page_response")"
            rm -f "$page_response"
            if [ "$artifact_count" -eq 0 ]; then
              rm -f "$page_candidates"
              break
            fi
            while IFS= read -r artifact_id && [ -n "$artifact_id" ]; do
              rm -f nextest-timing/timing.zip nextest-timing/timing.json
              set +e
              gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > nextest-timing/timing.zip 2>> nextest-timing/restore.log
              dl_status=$?
              set -e
              if [ "$dl_status" -ne 0 ] || [ ! -s nextest-timing/timing.zip ]; then
                echo "::notice::Could not download timing artifact $artifact_id; trying next older candidate."
                continue
              fi
              set +e
              unzip -p nextest-timing/timing.zip timing.json > nextest-timing/timing.json 2>> nextest-timing/restore.log
              unzip_status=$?
              set -e
              if [ "$unzip_status" -ne 0 ] || [ ! -s nextest-timing/timing.json ]; then
                echo "::notice::Could not extract timing artifact $artifact_id; trying next older candidate."
                continue
              fi
              # Apply the planner's seven-day freshness policy before acceptance.
              if ! jq -e '
                .version == "ci-nextest-timing/v1" and
                (.tests | type) == "object" and
                (.generated_at | type) == "string" and
                ((.generated_at | fromdateiso8601) as $generated |
                  $generated <= now and (now - $generated) <= (7 * 24 * 60 * 60))
              ' nextest-timing/timing.json > /dev/null 2>&1; then
                echo "::notice::Timing artifact $artifact_id is malformed or incompatible; trying next older candidate."
                rm -f nextest-timing/timing.json
                continue
              fi
              # Apply the planner's own compatibility parser to this candidate. An
              # obsolete artifact with no samples for current discovery cannot improve
              # balancing, so continue to the next older successful candidate.
              if ! node --input-type=module - \
                nextest-plan/discovery.json nextest-timing/timing.json <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { loadTiming, parseDiscovery } from './scripts/ci-nextest-plan.mjs';
 
          const [discoveryPath, timingPath] = process.argv.slice(2);
          const tests = parseDiscovery(await readFile(discoveryPath, 'utf8'));
          const timing = loadTiming(await readFile(timingPath, 'utf8'), {
            discoveredIds: new Set(tests.map(({ id }) => id)),
          });
          if (!timing.valid || timing.timings.size === 0) {
            console.error(timing.reason ?? 'Timing artifact has no samples for current discovery');
            process.exit(1);
          }
          NODE
              then
                echo "::notice::Timing artifact $artifact_id is not planner-compatible; trying next older candidate."
                rm -f nextest-timing/timing.json
                continue
              fi
              echo "::notice::Restored compatible timing artifact $artifact_id for shard balancing."
              restored=1
              break 2
            done < "$page_candidates"
            rm -f "$page_candidates"
          done
          if [ "$restored" -ne 1 ]; then
            echo "::notice::No compatible prior timing artifact found; using cold-start balancing."
          fi
          args=(
            --discovery nextest-plan/discovery.json
            --profile "$profile"
            --event "$EVENT_NAME"
            --output nextest-plan/plan.json
            --matrix nextest-plan/matrix.json
            --proof nextest-plan/proof.json
          )
          if [ -f nextest-timing/timing.json ]; then
            args+=(--timing nextest-timing/timing.json)
          fi
          node scripts/ci-nextest-plan.mjs "${args[@]}"
          jq -e '.exactOnce == true and .discoveredCount == .assignedCount and .assignedCount == .uniqueAssignedCount' nextest-plan/proof.json
          echo '::group::Nextest exact-once proof'
          cat nextest-plan/proof.json
          echo '::endgroup::'
          echo "coldStart=$(jq -r '.coldStart' nextest-plan/proof.json)" >> "$GITHUB_OUTPUT"
          # Compact shard/index matrix only; full plan travels via artifact because a large
          # GITHUB_OUTPUT value can cause the planning job to be skipped silently.
          echo "matrix=$(jq -c '{include: [.shards[] | {shard, shardIndex}]}' nextest-plan/matrix.json)" >> "$GITHUB_OUTPUT"
      - name: Upload discovery, plan, matrix, and exact-once proof
        uses: actions/upload-artifact@v4
        with:
          name: nextest-plan-${{ github.run_id }}
          path: nextest-plan/
          if-no-files-found: error
          retention-days: 30
  server-test:
    name: Server Test
    # Shards deliberately do NOT `needs: nextest-plan`. The planner's
    # ~5-minute discovery compile used to serialize ahead of every shard's
    # own ~5-minute compile of the same crates; instead the shards start at
    # preflight-time, run their build concurrently with the planner, and
    # poll for the plan artifact (normally already uploaded by the time the
    # build finishes). The matrix is statically provisioned at the planner's
    # maximum width (COLD_START_SHARDS / WIDE_DEFAULT_SHARDS / PR_MAX_SHARDS
    # in scripts/ci-nextest-plan.mjs are all 4); when a plan selects fewer
    # shards, the surplus indices resolve no shard row and no-op, and the
    # timing-publish job still verifies exact-once coverage across the
    # shards that ran.
    needs:
      - preflight
    if: needs.preflight.outputs.serverTest == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: shard-1
            shardIndex: 0
          - shard: shard-2
            shardIndex: 1
          - shard: shard-3
            shardIndex: 2
          - shard: shard-4
            shardIndex: 3
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: djinn
        ports:
          - 5433:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk for server test artifacts
        run: |
          # The all-targets test build can exhaust the hosted runner after the
          # Rust cache is restored. These preinstalled SDKs are unused here.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Install PostgreSQL client tools
        run: |
          # The x64 hosted runner images preinstall postgresql-client; the
          # arm64 images do not, and without it pg_isready/psql are missing
          # and the template-database wait loop below spins forever. Guarded
          # so it is a no-op wherever the client already exists.
          if ! command -v pg_isready >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-client
          fi
      - name: Start fail-fast watcher (background)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Shards are the longest-lived and most expensive jobs, so each
          # hosts a background watcher: if any lane in this run concludes
          # failure, the run is cancelled instead of burning the remaining
          # shard minutes behind an already-failed gate. Cancelling from a
          # bystander AFTER the culprit concluded preserves its red
          # "failure" label (a self-cancel races finalization and stamps
          # it "cancelled"). The process dies with the job; redundant
          # watchers across shards are idempotent. This replaces both the
          # old dedicated watchdog job (a full runner slot polling for the
          # entire run) and the invalid workflow_job-based workflow.
          nohup bash -c '
            for _ in $(seq 1 240); do
              sleep 15
              failed=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
                --jq "[.jobs[] | select(.conclusion == \"failure\") | .name] | first // empty" 2>/dev/null || true)
              if [ -n "$failed" ]; then
                echo "Lane $failed failed — cancelling run ${{ github.run_id }}."
                gh run cancel ${{ github.run_id }} --repo ${{ github.repository }} || true
                exit 0
              fi
            done
          ' > "$RUNNER_TEMP/fail-fast-watch.log" 2>&1 &
          echo "fail-fast watcher started"
      - run: rustup toolchain install
        working-directory: server
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server-test
          cache-on-failure: true
          cache-all-crates: true
          save-if: false
        id: rust-cache
      - name: Log cache family and restore status
        run: |-
          echo "cache-family=server-test"
          echo "shared-key=server-test"
          echo "runner-os=${{ runner.os }}"
          echo "rustc=$(rustc --version || echo 'unknown')"
          echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          echo "::notice::cache-family=server-test shared-key=server-test cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Apply djinn-db migrations
        working-directory: server/crates/djinn-db
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/djinn
        run: sqlx migrate run --source migrations_postgres
      - name: Build Postgres test template
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h 127.0.0.1 -p 5433 -U postgres >/dev/null 2>&1; do sleep 1; done
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS djinn_test_template"
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE djinn_test_template"
          cd crates/djinn-db && DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5433/djinn_test_template sqlx migrate run --source migrations_postgres
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "UPDATE pg_database SET datistemplate = TRUE WHERE datname = 'djinn_test_template'"
      - name: Create test vault key
        run: |
          mkdir -p /var/tmp/djinn-test-vault
          openssl rand -out /var/tmp/djinn-test-vault/vault.key 32
          chmod 600 /var/tmp/djinn-test-vault/vault.key
      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@test.local"
          git config --global user.name "CI Test"
      # DB setup must precede this build: the sqlx macros compile against
      # the live migrated database (server/.env DATABASE_URL), not the
      # offline cache. The build overlaps the planner's discovery compile
      # of the same crates — that concurrency is the whole point of the
      # shards not depending on nextest-plan.
      - name: Build test binaries (concurrent with planner discovery)
        run: cargo nextest run --workspace --all-targets --features qdrant --no-run
      - name: Wait for and download full shard plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The planner runs concurrently with this shard's build; by the
          # time the build finishes the plan artifact is normally already
          # uploaded, so this loop usually exits on the first probe. If the
          # planner concludes without publishing a plan, fail immediately
          # instead of burning the full timeout.
          for attempt in $(seq 1 60); do
            artifact_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=nextest-plan-${{ github.run_id }}" \
              --jq '.artifacts[0].id // empty')
            if [ -n "$artifact_id" ]; then
              mkdir -p nextest-plan
              gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > nextest-plan/plan.zip
              unzip -o nextest-plan/plan.zip -d nextest-plan
              rm nextest-plan/plan.zip
              exit 0
            fi
            planner=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "Plan Server Test Shards")][0].conclusion // empty')
            case "$planner" in
              failure|cancelled|timed_out)
                echo "::error::Plan Server Test Shards concluded '$planner' without publishing a plan."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for the nextest plan artifact."
          exit 1
      - name: Resolve and validate shard filter and test IDs
        id: shard
        env:
          SHARD_INDEX: ${{ matrix.shardIndex }}
        run: |
          set -euo pipefail
          matched=$(jq -r --argjson idx "$SHARD_INDEX" '[.shards[] | select(.shardIndex == $idx)] | length' nextest-plan/matrix.json)
          shard_count=$(jq -r '.shardCount' nextest-plan/matrix.json)
          if [ "$matched" -eq 0 ]; then
            if [ "$SHARD_INDEX" -ge "$shard_count" ]; then
              # The matrix provisions the planner's maximum width; this plan
              # selected fewer shards, so this surplus index has no work.
              echo "::notice::Plan selected $shard_count shard(s); shardIndex $SHARD_INDEX is surplus and no-ops."
              echo "active=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Plan claims $shard_count shard(s) but has no row for shardIndex $SHARD_INDEX."
            exit 1
          fi
          jq -e --argjson idx "$SHARD_INDEX" '
            ([.shards[] | select(.shardIndex == $idx)]) as $matches
            | ($matches | length == 1)
            and ($matches[0] as $row
              | ($row.count == ($row.testIds | length))
              and (all($row.testIds[]; type == "string" and length > 0))
              and ($row.testIds | unique | length == ($row.testIds | length))
              and ($row.filter | type == "string" and length > 0))
          ' nextest-plan/matrix.json
          jq -er --argjson idx "$SHARD_INDEX" '
            ([.shards[] | select(.shardIndex == $idx)]) as $matches
            | if ($matches | length) != 1 then error("expected exactly one shard row for shardIndex \($idx)") else $matches[0].filter end
          ' nextest-plan/matrix.json > nextest-plan/shard-filter.txt
          jq -ec --argjson idx "$SHARD_INDEX" '
            ([.shards[] | select(.shardIndex == $idx)]) as $matches
            | if ($matches | length) != 1 then error("expected exactly one shard row for shardIndex \($idx)") else $matches[0].testIds end
          ' nextest-plan/matrix.json > nextest-plan/shard-test-ids.json
          echo "active=true" >> "$GITHUB_OUTPUT"
      - name: Generate nextest config with file-backed shard filter
        if: steps.shard.outputs.active == 'true'
        env:
          NEXTEST_PROFILE: ${{ github.event_name == 'pull_request' && 'pull-request' || github.event_name == 'merge_group' && 'merge-group' || 'full-validation' }}
        run: |
          set -euo pipefail
          PLANNER="$GITHUB_WORKSPACE/scripts/ci-nextest-plan.mjs" node --input-type=module - \
            .config/nextest.toml \
            nextest-plan/shard-filter.txt \
            "$NEXTEST_PROFILE" \
            nextest-plan/shard-nextest.toml <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const { injectDefaultFilter } = await import(process.env.PLANNER);
 
          const [basePath, filterPath, profile, outputPath] = process.argv.slice(2);
          const base = await readFile(basePath, 'utf8');
          const filter = await readFile(filterPath, 'utf8');
          const rendered = injectDefaultFilter(base, profile, filter);
          await writeFile(outputPath, rendered);
          NODE
          echo "::notice::Generated nextest config for profile $NEXTEST_PROFILE with file-backed default-filter."
      - name: Run planner-selected shard tests
        if: steps.shard.outputs.active == 'true'
        env:
          NEXTEST_PROFILE: ${{ github.event_name == 'pull_request' && 'pull-request' || github.event_name == 'merge_group' && 'merge-group' || 'full-validation' }}
        run: |
          set -uo pipefail
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          started_seconds=$(date +%s)
          set +e
          cargo nextest run --workspace --all-targets --features qdrant --profile "$NEXTEST_PROFILE" --config-file nextest-plan/shard-nextest.toml --test-threads 4
          status=$?
          set -e
          elapsed_seconds=$(( $(date +%s) - started_seconds ))
          mkdir -p nextest-timing
          jq -s --arg generated_at "$started_at" --argjson elapsed "$elapsed_seconds" '
            (.[0]) as $ids |
            ($ids | length) as $count |
            {
              version: "ci-nextest-timing/v1",
              generated_at: $generated_at,
              tests: (reduce $ids[] as $id ({}; .[$id] = (if $count > 0 then ($elapsed / $count) else 0 end)))
            }
          ' nextest-plan/shard-test-ids.json > "nextest-timing/timing-${{ matrix.shardIndex }}.json"
          exit "$status"
      - name: Upload retained shard timing data
        if: always() && steps.shard.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nextest-timing-${{ github.run_id }}-${{ matrix.shard }}
          path: server/nextest-timing/timing-${{ matrix.shardIndex }}.json
          if-no-files-found: warn
          retention-days: 30
  nextest-timing-publish:
    name: Publish Nextest Timing
    needs:
      - preflight
      - nextest-plan
      - server-test
    if: needs.preflight.outputs.serverTest == 'true' && github.event_name != 'push' && needs.nextest-plan.result == 'success' && needs.server-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download current plan and exact-once proof
        uses: actions/download-artifact@v4
        with:
          name: nextest-plan-${{ github.run_id }}
          path: nextest-plan
      - name: Download current shard timing data
        uses: actions/download-artifact@v4
        with:
          pattern: nextest-timing-${{ github.run_id }}-*
          path: nextest-timing-shards
          merge-multiple: true
      - name: Merge current successful shard timings
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, readdirSync, writeFileSync, mkdirSync, statSync } from 'node:fs';
          import { join } from 'node:path';

          const PROOF_VERSION = 'ci-nextest-plan/v1';
          const TIMING_VERSION = 'ci-nextest-timing/v1';

          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }

          function assert(condition, message) {
            if (!condition) fail(message);
          }

          const proof = JSON.parse(readFileSync('nextest-plan/proof.json', 'utf8'));
          assert(typeof proof === 'object' && !Array.isArray(proof), 'proof.json must be a single object');
          assert(proof.version === PROOF_VERSION, `proof version mismatch: expected ${PROOF_VERSION}, got ${proof.version}`);
          assert(proof.exactOnce === true, 'proof exactOnce must be true');
          assert(typeof proof.shardCount === 'number' && proof.shardCount > 0, 'proof.shardCount must be a positive number');
          assert(typeof proof.discoveredCount === 'number' && proof.discoveredCount >= 0, 'proof.discoveredCount invalid');
          assert(proof.assignedCount === proof.discoveredCount, 'proof.assignedCount must equal discoveredCount');
          assert(proof.uniqueAssignedCount === proof.assignedCount, 'proof.uniqueAssignedCount must equal assignedCount');
          assert(Array.isArray(proof.assignedIds), 'proof.assignedIds must be an array');
          assert(proof.assignedIds.length === proof.assignedCount, 'proof.assignedIds length mismatch');
          assert(new Set(proof.assignedIds).size === proof.assignedCount, 'proof.assignedIds must be unique');
          assert(proof.assignedIds.every(id => typeof id === 'string' && id.length > 0), 'proof.assignedIds must be non-empty strings');

          const matrix = JSON.parse(readFileSync('nextest-plan/matrix.json', 'utf8'));
          assert(matrix.version === proof.version, 'matrix version mismatch');
          assert(matrix.shardCount === proof.shardCount, 'matrix.shardCount mismatch');
          assert(Array.isArray(matrix.shards) && matrix.shards.length === proof.shardCount, 'matrix.shards length mismatch');
          const sortedShards = matrix.shards.slice().sort((a, b) => a.shardIndex - b.shardIndex);
          assert(sortedShards.every((row, i) => row.shardIndex === i), 'matrix shard indices must be 0..shardCount-1');
          for (const row of sortedShards) {
            assert(typeof row.count === 'number' && row.count > 0, `row ${row.shardIndex} count must be positive`);
            assert(Array.isArray(row.testIds) && row.testIds.length === row.count, `row ${row.shardIndex} testIds length mismatch`);
            assert(new Set(row.testIds).size === row.testIds.length, `row ${row.shardIndex} testIds must be unique`);
            assert(row.testIds.every(id => typeof id === 'string' && id.length > 0), `row ${row.shardIndex} testIds must be non-empty strings`);
            assert(typeof row.filter === 'string' && row.filter.length > 0, `row ${row.shardIndex} filter must be non-empty string`);
          }

          const shardDir = 'nextest-timing-shards';
          const actualFiles = readdirSync(shardDir)
            .filter(f => f.endsWith('.json'))
            .map(f => join(shardDir, f));
          const expectedFiles = Array.from({ length: proof.shardCount }, (_, i) => join(shardDir, `timing-${i}.json`));
          const expectedSet = new Set(expectedFiles);
          assert(actualFiles.length > 0, 'no shard timing artifacts were produced');
          assert(actualFiles.length === expectedFiles.length, `expected ${expectedFiles.length} timing files, found ${actualFiles.length}`);
          for (const f of actualFiles) {
            assert(expectedSet.has(f), `unexpected timing file ${f}`);
            let stats;
            try { stats = statSync(f); } catch { fail(`timing file ${f} is missing`); }
            assert(stats.isFile() && stats.size > 0, `timing file ${f} is empty or not a file`);
          }

          const timings = [];
          for (let i = 0; i < proof.shardCount; i++) {
            const file = expectedFiles[i];
            const timing = JSON.parse(readFileSync(file, 'utf8'));
            assert(timing.version === TIMING_VERSION, `timing version mismatch in ${file}`);
            assert(typeof timing.tests === 'object' && !Array.isArray(timing.tests), `timing.tests must be an object in ${file}`);
            const ids = Object.keys(timing.tests);
            assert(ids.every(id => typeof id === 'string' && id.length > 0), `timing IDs must be non-empty strings in ${file}`);
            assert(Object.values(timing.tests).every(v => typeof v === 'number' && Number.isFinite(v) && v >= 0), `timing durations must be non-negative finite numbers in ${file}`);
            timings.push(timing);
          }

          for (let i = 0; i < proof.shardCount; i++) {
            const row = sortedShards[i];
            const timing = timings[i];
            const timingIds = Object.keys(timing.tests).sort();
            const expectedIds = [...row.testIds].sort();
            assert(JSON.stringify(timingIds) === JSON.stringify(expectedIds), `timing IDs for shard ${i} do not match matrix row`);
          }

          const allTimingIds = timings.flatMap(t => Object.keys(t.tests));
          assert(allTimingIds.length === proof.assignedCount, 'total timing ID count mismatch');
          assert(new Set(allTimingIds).size === allTimingIds.length, 'timing IDs must be unique across all shards');
          const sortedTimingIds = [...allTimingIds].sort();
          const sortedAssignedIds = [...proof.assignedIds].sort();
          assert(JSON.stringify(sortedTimingIds) === JSON.stringify(sortedAssignedIds), 'timing IDs do not match proof.assignedIds');

          const merged = {
            version: TIMING_VERSION,
            generated_at: new Date().toISOString(),
            tests: Object.assign({}, ...timings.map(t => t.tests)),
          };
          mkdirSync('nextest-timing', { recursive: true });
          writeFileSync('nextest-timing/timing.json', JSON.stringify(merged, null, 2));
          console.log('::notice::Merged shard timings and verified exact-once coverage.');
          NODE
      - name: Upload latest compatible timing candidate
        uses: actions/upload-artifact@v4
        with:
          name: nextest-timing
          path: nextest-timing/timing.json
          if-no-files-found: error
          retention-days: 30
  server-sqlx-freshness:
    name: Server sqlx Freshness
    needs: preflight
    if: needs.preflight.outputs.sqlxFreshness == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/djinn
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: djinn
        ports:
          - 5433:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
        working-directory: server
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server-quality
          cache-on-failure: true
          cache-all-crates: true
          save-if: false
        id: rust-cache
      - name: Log cache family and restore status
        run: |-
          echo "cache-family=server-quality"
          echo "shared-key=server-quality"
          echo "runner-os=${{ runner.os }}"
          echo "rustc=$(rustc --version || echo 'unknown')"
          echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          echo "::notice::cache-family=server-quality shared-key=server-quality cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Apply djinn-db migrations
        working-directory: server/crates/djinn-db
        run: sqlx migrate run --source migrations_postgres
      - name: Verify .sqlx offline cache is up to date
        working-directory: .
        run: make sqlx-verify
  memory-eval:
    name: Memory Eval Phase 1
    needs: preflight
    if: needs.preflight.outputs.memoryEval == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: djinn
        ports:
          - 5433:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
        working-directory: server
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server-quality
          cache-on-failure: true
          cache-all-crates: true
          save-if: false
        id: rust-cache
      - name: Log cache family and restore status
        run: |-
          echo "cache-family=server-quality"
          echo "shared-key=server-quality"
          echo "runner-os=${{ runner.os }}"
          echo "rustc=$(rustc --version || echo 'unknown')"
          echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          echo "::notice::cache-family=server-quality shared-key=server-quality cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Apply djinn-db migrations
        working-directory: server/crates/djinn-db
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/djinn
        run: sqlx migrate run --source migrations_postgres
      - name: Build Postgres test template
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h 127.0.0.1 -p 5433 -U postgres >/dev/null 2>&1; do sleep 1; done
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS djinn_test_template"
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE djinn_test_template"
          cd crates/djinn-db && DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5433/djinn_test_template sqlx migrate run --source migrations_postgres
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "UPDATE pg_database SET datistemplate = TRUE WHERE datname = 'djinn_test_template'"
      - name: Create test vault key
        run: |
          mkdir -p /var/tmp/djinn-test-vault
          openssl rand -out /var/tmp/djinn-test-vault/vault.key 32
          chmod 600 /var/tmp/djinn-test-vault/vault.key
      - name: Validate fixtures
        run: cargo run -p djinn-memory-eval -- validate-fixtures
      - name: Run Phase 1 benchmark
        env:
          DJINN_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/postgres
        run: cargo run -p djinn-memory-eval -- run
      - name: Compare against baseline
        env:
          DJINN_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/postgres
        run: cargo run -p djinn-memory-eval -- compare
      - name: Upload Phase 1 report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-eval-phase1-report
          path: |
            server/target/memory-eval/phase1-report.json
            server/target/memory-eval/phase1-summary.md
          if-no-files-found: error
          retention-days: 30
      - name: Write job summary
        if: always()
        run: |
          SUMMARY="target/memory-eval/phase1-summary.md"
          if [[ -f "$SUMMARY" ]]; then
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi
  qa-smoke:
    name: qa-smoke
    needs: preflight
    if: needs.preflight.outputs.qaSmoke == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Clone ownership remains on the maintenance database while SQLx macros
    # compile against the separately migrated template.
    env:
      DJINN_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/postgres
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/djinn_test_template
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client tools
        run: |
          # The x64 hosted runner images preinstall postgresql-client; the
          # arm64 images do not, and without it pg_isready/psql are missing
          # and the template-database wait loop below spins forever. Guarded
          # so it is a no-op wherever the client already exists.
          if ! command -v pg_isready >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-client
          fi
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: server-test
          cache-on-failure: true
          cache-all-crates: true
          save-if: false
        id: rust-cache
      - name: Log cache family and restore status
        run: |-
          echo "cache-family=server-test"
          echo "shared-key=server-test"
          echo "runner-os=${{ runner.os }}"
          echo "rustc=$(rustc --version || echo 'unknown')"
          echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          echo "::notice::cache-family=server-test shared-key=server-test cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Build migrated Postgres template
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          until pg_isready -h 127.0.0.1 -p 5433 -U postgres >/dev/null 2>&1; do sleep 1; done
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE djinn_test_template"
          (cd crates/djinn-db && DATABASE_URL="$DATABASE_URL" sqlx migrate run --source migrations_postgres)
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "UPDATE pg_database SET datistemplate = TRUE WHERE datname = 'djinn_test_template'"
      - name: Build qa runner once
        run: cargo build -p djinn-qa
      - name: Precompile selected smoke test binaries
        run: |
          cargo test -p djinn-coordinator --no-run
          cargo test -p djinn-slot --no-run
          cargo test -p djinn-db --no-run
      - name: Run deterministic qa smoke and coverage gate
        run: |
          set +e
          target/debug/djinn-qa run --qa-profile smoke-ci --concurrency 8 --repo-root .. --evidence-dir qa/evidence/smoke-ci
          runner_status=$?
          target/debug/djinn-qa coverage --profile smoke-ci --format json --repo-root .. --evidence ../qa/evidence/smoke-ci --output ../qa/evidence/smoke-ci/coverage.json
          coverage_status=$?
          if [ "$coverage_status" -ne 0 ]; then
            echo "::error::Required smoke coverage gaps remain:"
            jq -r '.[] | select((.required_profiles | index("smoke-ci")) and .state != "proven") | "\(.coverage_id): state=\(.state), scenarios=\(.scenario_ids | join(",")), stale_reasons=\(.stale_reasons | join(","))"' ../qa/evidence/smoke-ci/coverage.json
          fi
          if [ "$runner_status" -ne 0 ] || [ "$coverage_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload qa smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-smoke-evidence
          path: qa/evidence/smoke-ci
          if-no-files-found: error
          retention-days: 30
  ui-frontend:
    name: UI Frontend
    needs: preflight
    if: needs.preflight.outputs.ui == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generated MCP types are up to date
        run: pnpm mcp:types:check
      - name: Generated usage analytics types are up to date
        run: pnpm usage:types:check
      - name: Type check
        run: pnpm tsc --noEmit
      - name: Tests
        run: pnpm test
      - name: Production build
        run: pnpm build
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'push'
    needs:
      - preflight
      - server-guards
      - server-clippy
      - server-aarch64-check
      - nextest-plan
      - server-test
      - nextest-timing-publish
      - server-sqlx-freshness
      - memory-eval
      - local-dev-contracts
      - qa-smoke
      - ui-frontend
    steps:
      - name: Fail closed on selected work
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          GUARDS: |-
            ${{ (needs.preflight.outputs.cargoDeny == 'true'
               || needs.preflight.outputs.size == 'true'
               || needs.preflight.outputs.migrations == 'true'
               || needs.preflight.outputs.rawSql == 'true'
               || needs.preflight.outputs.capability == 'true'
               || needs.preflight.outputs.boundaries == 'true') }}:${{ needs.server-guards.result }}
          CLIPPY: ${{ needs.preflight.outputs.clippy }}:${{ needs.server-clippy.result }}
          AARCH64: ${{ needs.preflight.outputs.aarch64 }}:${{ needs.server-aarch64-check.result }}
          SERVER_TEST_PLAN: ${{ needs.preflight.outputs.serverTest }}:${{ needs.nextest-plan.result }}
          SERVER_TEST_SHARDS: ${{ needs.preflight.outputs.serverTest }}:${{ needs.server-test.result }}
          SERVER_TEST_TIMING: ${{ needs.preflight.outputs.serverTest }}:${{ needs.nextest-timing-publish.result }}
          SQLX: ${{ needs.preflight.outputs.sqlxFreshness }}:${{ needs.server-sqlx-freshness.result }}
          MEMORY: ${{ needs.preflight.outputs.memoryEval }}:${{ needs.memory-eval.result }}
          TILT_CONTRACTS: ${{ needs.preflight.outputs.tiltContracts }}:${{ needs.local-dev-contracts.result }}
          QA_SMOKE: ${{ needs.preflight.outputs.qaSmoke }}:${{ needs.qa-smoke.result }}
          UI: ${{ needs.preflight.outputs.ui }}:${{ needs.ui-frontend.result }}
        run: |
          set -euo pipefail
          [ "$PREFLIGHT" = success ] || { echo "preflight ended $PREFLIGHT"; exit 1; }
          check() {
            local lane=$1 pair=$2 selected=${2%%:*} result=${2#*:}
            if [ "$selected" = true ] && [ "$result" = success ]; then return; fi
            if [ "$selected" = false ] && [ "$result" = skipped ]; then return; fi
            echo "lane $lane selected=$selected result=$result"; return 1
          }
          check server-guards "$GUARDS"; check clippy "$CLIPPY"; check aarch64 "$AARCH64"
          check server-test-plan "$SERVER_TEST_PLAN"; check server-test-shards "$SERVER_TEST_SHARDS"; check server-test-timing "$SERVER_TEST_TIMING"
          check sqlx-freshness "$SQLX"; check memory-eval "$MEMORY"
          check local-dev-contracts "$TILT_CONTRACTS"; check qa-smoke "$QA_SMOKE"; check ui "$UI"
