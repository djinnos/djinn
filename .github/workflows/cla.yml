name: CLA

# Gates every pull request on a signed Contributor License Agreement.
#
# A contributor signs once by commenting the sign sentence on any PR; the bot
# records their GitHub identity + timestamp in `signatures/version1/cla.json`
# on the `cla-signatures` branch. After that, all of their PRs (past and
# future) pass the CLA check. Re-run the check on a PR by commenting `recheck`.
#
# Why this exists: Djinn ships under the Business Source License 1.1, which
# only works if the Licensor (Djinn AI) holds the right to relicense every
# line — including the right to set the Change Date and distribute commercial
# editions. An external contributor retains copyright on their work unless they
# grant that right; this CLA captures the grant. See CLA.md.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    # Skip comment events that aren't a sign/recheck (every issue comment in the
    # repo fires this workflow otherwise); always run on the PR events.
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/djinnos/djinn/blob/main/CLA.md'
          # Signatures live on a side branch so signing never commits to main.
          branch: 'cla-signatures'
          # Bots never author copyrightable work — exempt them from signing.
          allowlist: 'dependabot[bot],github-actions[bot],*[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA ✍️ ✅'
          lock-pullrequest-aftermerge: false
