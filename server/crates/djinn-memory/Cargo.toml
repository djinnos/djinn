[package]
publish = false
name = "djinn-memory"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[features]
default = []
sqlx = ["dep:sqlx", "djinn-core/sqlx"]

[dependencies]
djinn-core = { path = "../djinn-core" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No driver feature on purpose: this crate's only sqlx use is
# `#[derive(sqlx::FromRow)]` (from `macros`), which expands to a `Row`-generic
# impl. The Postgres driver arrives through `djinn-core/sqlx`, which is what
# the `sqlx` feature below enables. Do not add "postgres" here.
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "macros"], optional = true }
time = { version = "0.3", features = ["formatting", "parsing"] }
workspace-hack.workspace = true

[lints]
workspace = true
