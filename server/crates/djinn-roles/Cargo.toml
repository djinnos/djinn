[package]
name = "djinn-roles"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
djinn-core = { path = "../djinn-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tracing = "0.1"
workspace-hack.workspace = true

[dev-dependencies]
toml = "0.9"
