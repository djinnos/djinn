[package]
publish = false
name = "djinn-spec-lint"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
markdown = "1"
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
stringprep = "0.1"
unicode-normalization = "0.1"

[lints]
workspace = true
