[package]
publish = false
name = "djinn-supervisor"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
djinn-core = { path = "../djinn-core" }
djinn-db = { path = "../djinn-db" }
djinn-provider = { path = "../djinn-provider" }
djinn-runtime = { path = "../djinn-runtime" }
djinn-stack = { path = "../djinn-stack" }
djinn-telemetry = { path = "../djinn-telemetry" }
djinn-workspace = { path = "../djinn-workspace" }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "net", "io-util", "fs"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
workspace-hack.workspace = true

[lints.clippy]
# Workspace lint baseline (manually replicated because this crate also carries
# crate-specific deny lints; Cargo forbids mixing `lints.workspace = true` with
# per-crate overrides — see server/Cargo.toml [workspace.lints.clippy]).
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"
# Crate-specific reliability lints (sibling epic a3qw).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dev-dependencies]
bincode = "1.3"
# `admission_handoff`'s `delete_for_test` — the durable-authority tests need an
# ABSENT row to prove "legitimately unarmed" is distinguishable from "the read
# failed" (goxi launcher blocker 13).
djinn-db = { path = "../djinn-db", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = "0.3"
# `#[tracing_test::traced_test]` — a PROCESS-GLOBAL capture subscriber, which is
# the only kind that is correct under `cargo test` at default parallelism.
# `tracing::dispatcher::set_default` is thread-local, but `Interest` is cached
# per callsite in a PROCESS-GLOBAL registry: whichever thread first hits a
# callsite decides its interest for every thread, and a sibling test hitting it
# with no dispatcher installed caches `Interest::never()` — permanently, because
# nothing rebuilds the cache afterwards. The events then never reach the
# thread-local capture and the assertion looks like a missing emission.
# `tracing-test` installs its subscriber with `set_global_default` over a LEAKED
# `Dispatch`, so no thread is ever without one. See `djinn-coordinator`, which
# uses the same crate for the same reason.
tracing-test = "0.2"
