[package]
publish = false
name = "djinn-k8s"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[features]
default = []
# Exposes cluster-free `Pod` fixtures (`pod_resize_fixture`) and the recording
# in-process apiserver (`runtime_fixture`) to downstream test targets. Kept
# behind a feature so production binaries never link them.
test-support = ["dep:tower", "dep:http", "dep:http-body-util"]

[dependencies]
djinn-cgroup-launcher = { path = "../djinn-cgroup-launcher" }
djinn-core = { path = "../djinn-core" }
djinn-db = { path = "../djinn-db" }
djinn-git = { path = "../djinn-git" }
djinn-runtime = { path = "../djinn-runtime" }
djinn-stack = { path = "../djinn-stack" }
djinn-telemetry = { path = "../djinn-telemetry" }
djinn-supervisor = { path = "../djinn-supervisor" }
djinn-workspace = { path = "../djinn-workspace" }
anyhow = "1"
async-trait = "0.1"
bincode = "1.3"
# Stream combinators for the Kueue Workload watch (`workload_inventory.rs`).
# `kube::runtime::watcher` yields a `Stream`, and this is the crate that makes
# it pollable — the same dependency `djinn-image-controller` carries for its
# Job watcher.
futures = "0.3"
kube = { version = "0.95", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["v1_30"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-patch = "2"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "net", "io-util", "process"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
# `runtime_fixture` only. Optional regular dependencies rather than dev-only
# ones, because a dev-dependency is absent when this crate is compiled as a
# dependency of `djinn-server`'s test binary with `test-support` enabled — the
# same reason `server/Cargo.toml` carries `tower` as an optional dependency.
tower = { version = "0.5", features = ["util"], optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
workspace-hack.workspace = true

[dev-dependencies]
async-trait = "0.1"
djinn-db = { path = "../djinn-db", features = ["test-support"] }
djinn-provider = { path = "../djinn-provider" }
# goxi launcher blocker 8/9 guard: the required-path set a brokered child depends
# on is derived from the REAL image ENV the Dockerfile emitter bakes, not from a
# copy of it. See tests/launcher_child_filesystem_reachability.rs.
djinn-image-builder = { path = "../djinn-image-builder" }
# jqvg drift guard only: the secret mount paths rendered here must stay covered
# by the shell sandbox's confidential-path denylist.
djinn-sandbox = { path = "../djinn-sandbox" }
serde_yaml = "0.9"
# fbiy-B2 (tests/kueue_disruption_conformance.rs) ONLY.
#
# `workspace-hack` unifies rustls 0.23 with BOTH the `ring` and the `aws-lc-rs`
# providers, so `CryptoProvider::get_default_or_install_from_crate_features()`
# cannot pick one and every `kube::Client` in a djinn-k8s test binary panics on
# construction — measured 2026-07-30, and the reason
# `tests/kueue_cluster_harness.rs` drives `kubectl` instead. The live disruption
# proof has to call the REAL `SessionRuntime::watch_infra_death`, which takes a
# real client, so that binary installs the provider itself before it builds one.
#
# Same line `server/Cargo.toml` already carries for `server/src/main.rs`'s
# identical `install_default()` call: dev-only, ring, no default features.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
http = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-test = "0.4"

[lints]
workspace = true
