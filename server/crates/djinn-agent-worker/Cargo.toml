[package]
publish = false
name = "djinn-agent-worker"
version = "0.1.0"
edition = "2024"

# Statically links `djinn-agent` to reuse the in-process supervisor + stage
# execution drivers inside the per-task-run Pod. Coordinator / LSP / MCP code
# paths are linked but not instantiated.

[[bin]]
name = "djinn-agent-worker"
path = "src/main.rs"

[dependencies]
djinn-agent = { path = "../djinn-agent" }
djinn-core = { path = "../djinn-core" }
djinn-db = { path = "../djinn-db" }
djinn-git = { path = "../djinn-git" }
djinn-graph = { path = "../djinn-graph" }
djinn-provider = { path = "../djinn-provider" }
djinn-runtime = { path = "../djinn-runtime" }
djinn-slot = { path = "../djinn-slot" }
djinn-stack = { path = "../djinn-stack" }
djinn-supervisor = { path = "../djinn-supervisor" }
djinn-telemetry = { path = "../djinn-telemetry" }
djinn-workspace = { path = "../djinn-workspace" }
anyhow = "1"
async-trait = "0.1"
bincode = "1.3"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
rayon = "1"
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
workspace-hack.workspace = true

[dev-dependencies]
djinn-db = { path = "../djinn-db", features = ["test-support"] }
futures = "0.3"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
