[package]
publish = false
name = "djinn-agent"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[features]
# Exposes cluster-free slot-pool factory hooks and test helpers for downstream integration tests.
test-support = ["tempfile"]

[dependencies]
djinn-core = { path = "../djinn-core" }
djinn-db = { path = "../djinn-db" }
djinn-memory = { path = "../djinn-memory" }
djinn-git = { path = "../djinn-git" }
djinn-provider = { path = "../djinn-provider" }
djinn-control-plane = { path = "../djinn-control-plane" }
djinn-telemetry = { path = "../djinn-telemetry" }
djinn-runtime = { path = "../djinn-runtime", features = ["test-runtime"] }
djinn-stack = { path = "../djinn-stack" }
djinn-supervisor = { path = "../djinn-supervisor" }
djinn-k8s = { path = "../djinn-k8s" }
djinn-workspace = { path = "../djinn-workspace" }
djinn-roles = { path = "../djinn-roles" }
djinn-sandbox = { path = "../djinn-sandbox" }
djinn-lsp = { path = "../djinn-lsp" }
djinn-compaction = { path = "../djinn-compaction" }
djinn-mcp-extension = { path = "../djinn-mcp-extension" }
djinn-orchestration-types = { path = "../djinn-orchestration-types" }
djinn-slot = { path = "../djinn-slot", features = ["test-support"] }
djinn-coordinator = { path = "../djinn-coordinator" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-stream = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "form"] }
rmcp = { version = "1", features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
schemars = "1"
regex = "1.12.3"
git2 = "0.20"
libc = "0.2"
wait-timeout = "0.2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
globset = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"
ring = "0.17"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v7"] }
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio-rustls", "macros"] }
async-trait = "0.1"
tempfile = { version = "3", optional = true }
workspace-hack.workspace = true

[dev-dependencies]
axum = "0.8"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = "3"
insta = { version = "1", features = ["json"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
# Activate test-support on djinn-slot so agent tests can call
# test-only methods (e.g. `SlotPoolHandle::test_set_token_override`)
# on the canonical djinn-slot pool handle.
djinn-slot = { path = "../djinn-slot", features = ["test-support"] }
# Self dev-dependency so integration tests under tests/ can use the
# cfg-gated `djinn_agent::test_helpers` module.
djinn-agent = { path = ".", features = ["test-support"] }

[lints]
workspace = true
