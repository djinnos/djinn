[package]
publish = false
name = "djinn-provider"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
djinn-core = { path = "../djinn-core" }
djinn-db = { path = "../djinn-db" }
djinn-telemetry = { path = "../djinn-telemetry" }
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
dirs = "6"
futures = "0.3"
hf-hub = "0.5.0"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["reqwest-rustls"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "form"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_urlencoded = "0.7"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio-rustls", "macros"] }
thiserror = "2"
tokenizers = "0.22.2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v7"] }
workspace-hack.workspace = true

[dev-dependencies]
djinn-db = { path = "../djinn-db", features = ["test-support"] }
wiremock = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
