[package]
publish = false
name = "djinn-git"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
djinn-core = { path = "../djinn-core" }
globset.workspace = true
anyhow = "1"
git2 = "0.20"
libc = "0.2"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
workspace-hack.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
