[package]
publish = false
name = "djinn-slot"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[features]
# Exposes cluster-free slot-pool factory hooks for downstream integration tests.
test-support = []

[dependencies]
djinn-core = { path = "../djinn-core" }
djinn-db = { path = "../djinn-db" }
djinn-git = { path = "../djinn-git" }
djinn-memory = { path = "../djinn-memory" }
djinn-provider = { path = "../djinn-provider" }
djinn-control-plane = { path = "../djinn-control-plane" }
djinn-runtime = { path = "../djinn-runtime" }
djinn-supervisor = { path = "../djinn-supervisor" }
djinn-roles = { path = "../djinn-roles" }
djinn-compaction = { path = "../djinn-compaction" }
djinn-mcp-extension = { path = "../djinn-mcp-extension" }
djinn-orchestration-types = { path = "../djinn-orchestration-types" }
djinn-stack = { path = "../djinn-stack" }
djinn-lsp = { path = "../djinn-lsp" }
djinn-telemetry = { path = "../djinn-telemetry" }
anyhow = "1"
regex = "1.12.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-stream = "0.3"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v7"] }
async-trait = "0.1"

workspace-hack.workspace = true

[dev-dependencies]
axum = "0.8"
djinn-db = { path = "../djinn-db", features = ["test-support"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = "3"
insta = { version = "1", features = ["json"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[lints.clippy]
# Workspace lint baseline (manually replicated because this crate also carries
# crate-specific deny lints; Cargo forbids mixing `lints.workspace = true` with
# per-crate overrides — see server/Cargo.toml [workspace.lints.clippy]).
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"
# Crate-specific reliability lints (sibling epic 5jd0).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
