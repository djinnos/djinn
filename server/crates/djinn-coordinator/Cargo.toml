[package]
publish = false
name = "djinn-coordinator"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[features]
default = []
test-support = ["dep:tempfile"]

[dependencies]
djinn-core = { path = "../djinn-core" }
djinn-db = { path = "../djinn-db" }
djinn-spec-lint = { path = "../djinn-spec-lint" }
djinn-memory = { path = "../djinn-memory" }
djinn-git = { path = "../djinn-git" }
djinn-provider = { path = "../djinn-provider" }
djinn-control-plane = { path = "../djinn-control-plane" }
djinn-telemetry = { path = "../djinn-telemetry" }
djinn-runtime = { path = "../djinn-runtime" }
djinn-supervisor = { path = "../djinn-supervisor" }
djinn-workspace = { path = "../djinn-workspace" }
djinn-roles = { path = "../djinn-roles" }
djinn-lsp = { path = "../djinn-lsp" }
djinn-orchestration-types = { path = "../djinn-orchestration-types" }
djinn-slot = { path = "../djinn-slot" }
djinn-stack = { path = "../djinn-stack" }
djinn-k8s = { path = "../djinn-k8s" }
# The zero-dependency wire contract for `leaf-v1` / `resize-v2`. Depended on
# directly, not through `djinn-k8s`, so `resize_authorization` can compare
# migration 164's persisted protocol against the shared TYPE without acquiring a
# Kubernetes dependency of its own.
djinn-launcher-protocol = { path = "../djinn-launcher-protocol" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-stream = "0.3"
regex = "1.12.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "form"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v7"] }
async-trait = "0.1"
metrics = "=0.24.6"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
globset = { workspace = true }
libc = "0.2"
tempfile = { version = "3", optional = true }
workspace-hack.workspace = true

[dev-dependencies]
djinn-agent = { path = "../djinn-agent", features = ["test-support"] }
djinn-db = { path = "../djinn-db", features = ["test-support"] }
# `pod_resize_fixture` — a stored `Pod` driven through the PRODUCTION observation,
# patch and confirmation code. `deny.toml` bans a direct `k8s-openapi` dependency
# outside the Kubernetes capability owner, so the fixture is how this crate's
# lift tests get a Pod at all.
djinn-k8s = { path = "../djinn-k8s", features = ["test-support"] }
djinn-agent-worker = { path = "../djinn-agent-worker" }
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
filetime = "0.2"
insta = { version = "1", features = ["json"] }
tracing-test = "0.2"
djinn-slot = { path = "../djinn-slot", features = ["test-support"] }

[lints.clippy]
# Workspace lint baseline (manually replicated because this crate also carries
# crate-specific deny lints; Cargo forbids mixing `lints.workspace = true` with
# per-crate overrides — see server/Cargo.toml [workspace.lints.clippy]).
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"
# Crate-specific reliability lints (sibling epic mzdj).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
