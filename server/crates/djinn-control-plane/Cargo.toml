[package]
publish = false
name = "djinn-control-plane"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
djinn-core = { path = "../djinn-core", features = ["sqlx"] }
djinn-db = { path = "../djinn-db" }
djinn-memory = { path = "../djinn-memory" }
djinn-git = { path = "../djinn-git" }
djinn-provider = { path = "../djinn-provider" }
djinn-stack = { path = "../djinn-stack" }
async-trait = "0.1"
dirs = "6"
rmcp = { version = "1", features = ["server", "transport-streamable-http-server"] }
http = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v7"] }
futures = "0.3"
anyhow = "1"
regex = "1"
markdown = "1"
globset = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
workspace-hack.workspace = true

[features]
# Exposes `test_support::McpTestHarness` + stub bridge impls for downstream
# integration tests (e.g. contract tests that previously needed `AppState`).
# Off by default; enabled automatically under `cfg(test)` for this crate.
test-support = []

[dev-dependencies]
# Self-reference enables `feature = "test-support"` for integration tests
# under `tests/` (which compile against the lib as an external crate, so
# `#[cfg(test)]` gating on `test_support` doesn't apply).
djinn-control-plane = { path = ".", features = ["test-support"] }
djinn-agent = { path = "../djinn-agent", features = ["test-support"] }
tempfile = "3"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7"
insta = { version = "1", features = ["json", "redactions"] }
uuid = { version = "1", features = ["v7"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
djinn-slot = { path = "../djinn-slot" }
wiremock = "0.6"

[lints]
workspace = true
