[package]
publish = false
name = "djinn-qa"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
djinn-db = { path = "../djinn-db" }
djinn-git = { path = "../djinn-git" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
workspace-hack.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
