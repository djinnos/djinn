[build]
# Feature set djinn's warm-cache pre-build compiles with, so the warm base
# matches what CI and task-run pods actually build.
#
# `djinn-agent-worker::cargo_cache_policy` reads this key to derive the warm
# job's `--features` args; without it the warm base is built with NO features
# while CI (`.github/workflows/quality-gate.yml`) and worker commands use
# `--features qdrant`. Feature resolution differs, so every unit whose
# resolution depends on it misses the warm base and recompiles.
#
# This is djinn's own convention, NOT a cargo key: cargo emits
# `warning: unused config key build.features` and ignores it. That warning is
# expected — do not "fix" it by deleting this, and do not move the feature list
# into the platform, which is deliberately repo-agnostic and reads it from here.
#
# Keep in sync with the `--features` used by the Server Clippy / Server Test
# jobs in `.github/workflows/quality-gate.yml`.
features = ["qdrant"]

# NOTE: `rustc-wrapper = "sccache"` is intentionally NOT set here. The djinn
# platform (warm/worker pods) reuses a warm, main-based per-project
# cargo target base with INCREMENTAL compilation (CI-style, like
# Swatinem/rust-cache); sccache forbids incremental, so forcing it here would
# disable the whole warm-cache fast path.
#
# sccache is not used in CI either. `.github/workflows/quality-gate.yml` and
# `release.yml` both set `RUSTC_WRAPPER: ""` — an explicit empty wrapper, so
# that a wrapper leaking in from a runner image or a caller's environment
# cannot change `-C metadata` and invalidate the restored rust-cache. CI does
# pin `CARGO_INCREMENTAL: 0`, which is what keeps the GitHub Actions cache
# small; that clamp is independent of any wrapper. Local dev + djinn pods
# default to cargo's normal incremental dev/test profiles.
#
# NOTE: do NOT hardcode `target-dir` here, and do NOT add a setup script
# that mutates this file at runtime.  Each git worktree gets its own
# default `target/` directory (cargo's default behavior).
#
# History: commit 4befbf9b accidentally contaminated main with a literal
# `target-dir = "/tmp/.../0bhg-server"` because a setup script was
# rewriting this file in-place per worker.  The follow-up moved isolation
# into the djinn-agent command runner via an injected CARGO_TARGET_DIR
# env var pointing at /tmp/djinn-targets/...  That hack (a) leaked tens
# of GB onto tmpfs, (b) hard-coded a Rust assumption into the otherwise
# language-agnostic command runner, and (c) didn't achieve dep sharing
# anyway since each worktree got its own dir.  Both the in-file mutation
# AND the env injection are gone now; cargo's default target dir is the
# whole story.

[env]
TMPDIR = "/var/tmp"
# Force openssl-sys to link the system OpenSSL instead of compiling the
# vendored copy from source. `--all-features` activates `openssl/vendored`
# somewhere in the dep tree, and the agent/CI images ship libssl but NOT the
# make/perl/C toolchain needed to build OpenSSL from source — so without this
# `cargo clippy/test --all-features` fails in the build script. No effect on
# default-feature builds (vendored isn't active there).
OPENSSL_NO_VENDOR = "1"
# Default every cargo invocation in this workspace to the isolated test
# Postgres on :5433. Both sqlx-macros (compile-time schema validation via
# DATABASE_URL) and the test harness (runtime DB creation via
# DJINN_TEST_DATABASE_URL) honor these. To deliberately point at a different
# instance (e.g. sqlx-prepare against a stable schema), override at the
# command line.
DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5433/djinn"
DJINN_TEST_DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5433/postgres"
# Default tests to a disk-backed vault key under /var/tmp — NOT the
# production vault at ~/.djinn/vault.key which is owned by root (the
# djinn-server container writes it). crypto::vault_key_path() honors
# this env var ahead of DJINN_HOME and ~/.djinn. Override at command
# line only when deliberately exercising the production vault.
DJINN_VAULT_KEY_PATH = "/var/tmp/djinn-test-vault/vault.key"
# NOTE: incremental compilation is left at cargo's profile defaults
# (dev/test = ON). We deliberately do NOT clamp `CARGO_INCREMENTAL` here:
# the djinn warm/worker pods rely on consistent incremental-on so the
# warm-base seed is reusable, and a `force = true` clamp would override the
# env they set. CI still pins `CARGO_INCREMENTAL: 0` in
# `.github/workflows/quality-gate.yml`, so the GitHub Actions cache stays
# incremental-free.

# Release profile keeps default LLVM backend for optimized output. Profiles
# are left at cargo defaults (dev/test incremental ON) so the warm-cache fast
# path works; see the [build] note above.

[net]
git-fetch-with-cli = true

# Rewrite SSH GitHub URLs to HTTPS for CI / machines without SSH keys.
[url."https://github.com/jh-block/"]
insteadOf = "git@github.com:jh-block/"
