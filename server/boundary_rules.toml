# server/boundary_rules.toml
#
# Checked-in architectural boundary rule set encoding the intended
# workspace layering DAG.  CI runs `scripts/check_boundaries.py` against
# this file so that architectural inversions cannot silently re-tangle
# the dependency graph.  The checker reads crate manifests + greps source
# only — no database, no code-graph warm, no workspace compile.  See
# docs/BOUNDARY_CHECKER_RUNBOOK.md.
#
# Each `[[rules]]` entry is a single forbidden edge: if any dependency
# whose source matches `from_glob` targets a node matching `to_glob`,
# that edge is reported as a violation.
#
# Glob syntax: `**/djinn-agent/**` reduces to the crate name `djinn-agent`
# for crate-level rules (matched against declared Cargo.toml dependency
# edges), and `**/djinn-*/**` becomes `djinn-*` to match every djinn-*
# crate.  Self-references (a crate depending on itself) are never edges
# and so are never reported.  A rule whose `from_glob` keeps a path shape
# (e.g. ends in `.rs`) is treated as file-level: the matching source
# files are scanned for a `use` of the forbidden crate.
#
# The slot-pool/k8s lifecycle rule is intentionally file-level because it
# replaces the former source-scanning unit test and only constrains
# production files under djinn-agent's slot-pool module, not all of
# djinn-agent.
#
# Cross-reference: [[design/r7iw-roadmap]] item 2 and item 4.

[boundary]
level = "file"
description = "Server workspace layering DAG — architectural boundary rules"

# ------------------------------------------------------------------ #
# Agent high fan-out guard
# ------------------------------------------------------------------ #
# The agent should reach the code-graph tool surface through the
# control-plane bridge, not as a direct crate dependency.  This edge is
# currently green (djinn-agent has no djinn-graph dependency), so it is
# enforced as a hard "do not introduce" guard.

[[rules]]
name = "no-agent-imports-graph"
from_glob = "**/djinn-agent/**"
to_glob = "**/djinn-graph/**"
description = "Agent must not import djinn-graph directly; the code-graph tool surface should be reached through the control-plane bridge, not a direct dependency."

# ------------------------------------------------------------------ #
# Slot-pool / k8s lifecycle guard (file-level)
# ------------------------------------------------------------------ #
# Intentionally file-level: it constrains only the production slot-pool
# lifecycle files, not all of djinn-agent.  It replaces the former
# source-scanning unit test and is currently green.

[[rules]]
name = "slot-pool-no-k8s-direct-import"
from_glob = "**/actors/slot/pool/{actor,handle,mod,types}.rs"
to_glob = "**/djinn-k8s/**"
description = "Production slot pool lifecycle code must not import djinn_k8s directly; use the RuntimeOps bridge layer."

# ------------------------------------------------------------------ #
# DEFERRED — aspirational rules not enforced today
# ------------------------------------------------------------------ #
# The following edges describe a TARGET architecture that the current
# tree massively violates, so they cannot be enforced as hard "zero"
# rules without a false-green baseline:
#
#   * no-agent-imports-control-plane — djinn-agent → djinn-control-plane
#     (~20 source files reference djinn_control_plane today)
#   * no-agent-imports-db            — djinn-agent → djinn-db
#     (~44 source files reference djinn_db today)
#   * no-db-imports-memory           — djinn-db → djinn-memory
#     (~15 source files reference djinn_memory today)
#
# These intentionally route the agent's storage/orchestration access
# through a bridge instead of direct crate deps.  Enforcing them is a
# real refactor, not a CI wiring task.  If a "no NEW occurrences"
# ratchet is wanted before that refactor lands, add a baseline-allowlist
# mode to scripts/check_boundaries.py and re-introduce them here.

# ------------------------------------------------------------------ #
# Leaf crate isolation
# ------------------------------------------------------------------ #
# Leaf crates (core, stack, telemetry) are foundational utilities with
# zero djinn-* dependencies by design.  They must not import any other
# djinn crate — keeping them dependency-free preserves their role as
# stable building blocks.  The `**/djinn-*/**` to_glob matches every
# djinn-* crate; the checker excludes self-references so intra-crate
# edges are never flagged.

[[rules]]
name = "leaf-core-imports-no-djinn-crate"
from_glob = "**/djinn-core/**"
to_glob = "**/djinn-*/**"
description = "Leaf isolation: djinn-core must not import any other djinn crate. Self-references (intra-crate edges) are excluded by the checker."

[[rules]]
name = "leaf-stack-imports-no-djinn-crate"
from_glob = "**/djinn-stack/**"
to_glob = "**/djinn-*/**"
description = "Leaf isolation: djinn-stack must not import any other djinn crate. Self-references (intra-crate edges) are excluded by the checker."

[[rules]]
name = "leaf-telemetry-imports-no-djinn-crate"
from_glob = "**/djinn-telemetry/**"
to_glob = "**/djinn-*/**"
description = "Leaf isolation: djinn-telemetry must not import any other djinn crate. Self-references (intra-crate edges) are excluded by the checker."

# ------------------------------------------------------------------ #
# djinn-roles isolation (Phase 3 extraction boundary)
# ------------------------------------------------------------------ #
# djinn-roles owns role configuration, prompt rendering, and AgentType.
# It must be a focused leaf-like crate: it depends only on djinn-core
# and its own non-djinn dependencies.  It must NOT depend on djinn-agent
# (which would invert the intended layering) or on djinn-mcp-extension
# (Phase 4 owns that extraction).

[[rules]]
name = "no-roles-imports-agent"
from_glob = "**/djinn-roles/**"
to_glob = "**/djinn-agent/**"
description = "djinn-roles must not depend on djinn-agent. The roles crate is a lower layer; djinn-agent is the facade that re-exports from djinn-roles. An inversion here defeats the extraction."

[[rules]]
name = "no-roles-imports-extension"
from_glob = "**/djinn-roles/**"
to_glob = "**/djinn-mcp-extension/**"
description = "djinn-roles must not depend on djinn-mcp-extension. Phase 4 owns extension extraction; the roles crate must remain extension-agnostic."
