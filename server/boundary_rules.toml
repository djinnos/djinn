# server/boundary_rules.toml
#
# Checked-in architectural boundary rule set encoding the intended
# workspace layering DAG.  CI loads this file and runs the crate-level
# `boundary_check` op against it so that architectural inversions cannot
# silently re-tangle the dependency graph.
#
# Each `[[rules]]` entry is a single forbidden edge: if any dependency
# whose source matches `from_glob` targets a node matching `to_glob`,
# that edge is reported as a violation.
#
# Glob syntax: `**/djinn-agent/**` matches files inside the djinn-agent
# crate (file-level checking) and reduces to the crate name `djinn-agent`
# for crate-level matching.  The crate-level checker strips the glob to a
# crate-name pattern, so `**/djinn-*/**` becomes `djinn-*` and matches
# every djinn-* crate.  Self-references (a crate importing itself) are
# excluded by the checker and never reported as violations.
#
# Cross-reference: [[design/r7iw-roadmap]] item 2.

[boundary]
level = "crate"
description = "Server workspace layering DAG — architectural boundary rules"

# ------------------------------------------------------------------ #
# Reverse-dependency guard
# ------------------------------------------------------------------ #
# The agent sits at the top of the layering DAG and must NOT import the
# control-plane crate.  control-plane is the bridge / orchestration
# layer; an agent → control-plane edge creates a cycle because the
# control-plane already dispatches into the agent.

[[rules]]
name = "no-agent-imports-control-plane"
from_glob = "**/djinn-agent/**"
to_glob = "**/djinn-control-plane/**"
description = "Agent must not import control-plane; control-plane is the bridge layer that dispatches into the agent. A reverse edge here creates a layering cycle."

# ------------------------------------------------------------------ #
# Agent high fan-out guards
# ------------------------------------------------------------------ #
# The agent should talk to infrastructure exclusively through the
# control-plane bridge.  Direct agent → db / agent → graph edges bypass
# that indirection and tightly couple the agent to storage / graph
# internals, which is an architectural smell that should be flagged.

[[rules]]
name = "no-agent-imports-db"
from_glob = "**/djinn-agent/**"
to_glob = "**/djinn-db/**"
description = "Agent must not import djinn-db directly; storage access should go through the control-plane bridge. This edge also guards the downward layering (nothing below djinn-db should import the higher agent)."

[[rules]]
name = "no-agent-imports-graph"
from_glob = "**/djinn-agent/**"
to_glob = "**/djinn-graph/**"
description = "Agent must not import djinn-graph directly; the code-graph tool surface should be reached through the control-plane bridge, not a direct dependency."

# ------------------------------------------------------------------ #
# Known inversion guard
# ------------------------------------------------------------------ #
# djinn-db → djinn-memory is a known historical inversion.  It is
# documented here so the rule set catches it and any NEW occurrence is
# surfaced in CI rather than silently merged.

[[rules]]
name = "no-db-imports-memory"
from_glob = "**/djinn-db/**"
to_glob = "**/djinn-memory/**"
description = "Known inversion guard: djinn-db must not import djinn-memory. The memory layer is higher in the DAG than the db layer; this edge is tracked so new occurrences surface in CI."

# ------------------------------------------------------------------ #
# Leaf crate isolation
# ------------------------------------------------------------------ #
# Leaf crates (core, stack, telemetry) are foundational utilities with
# zero djinn-* dependencies by design.  They must not import any other
# djinn crate — keeping them dependency-free preserves their role as
# stable building blocks.  The `**/djinn-*/**` to_glob matches every
# djinn-* crate; the checker excludes self-references so intra-crate
# edges are never flagged.

[[rules]]
name = "leaf-core-imports-no-djinn-crate"
from_glob = "**/djinn-core/**"
to_glob = "**/djinn-*/**"
description = "Leaf isolation: djinn-core must not import any other djinn crate. Self-references (intra-crate edges) are excluded by the checker."

[[rules]]
name = "leaf-stack-imports-no-djinn-crate"
from_glob = "**/djinn-stack/**"
to_glob = "**/djinn-*/**"
description = "Leaf isolation: djinn-stack must not import any other djinn crate. Self-references (intra-crate edges) are excluded by the checker."

[[rules]]
name = "leaf-telemetry-imports-no-djinn-crate"
from_glob = "**/djinn-telemetry/**"
to_glob = "**/djinn-*/**"
description = "Leaf isolation: djinn-telemetry must not import any other djinn crate. Self-references (intra-crate edges) are excluded by the checker."
