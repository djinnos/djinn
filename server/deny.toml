# cargo-deny configuration for the djinn server workspace.
#
# Run from server/:
#   cargo deny check
#   cargo deny check advisories
#   cargo deny check licenses
#   cargo deny check bans
#
# Reference: https://embarkstudios.github.io/cargo-deny/

# ---------------------------------------------------------------------------
# Advisories
#
# Fail on known vulnerabilities and yanked crates.  The advisories check
# always fails on vulnerable and yanked crates by default in cargo-deny
# 0.19.x.  Known advisories for transitive dependencies that cannot be
# resolved without upstream upgrades are listed below so that the gate
# remains green while the team tracks fixes.
# ---------------------------------------------------------------------------
[advisories]
ignore = [
    # backoff is unmaintained (transitive via kube-runtime → kube)
    "RUSTSEC-2025-0012",
    # bincode 1.x is unmaintained (transitive via tokenizers)
    "RUSTSEC-2025-0141",
    # derivative is unmaintained (transitive via multiple crates)
    "RUSTSEC-2024-0388",
    # instant is unmaintained (transitive via crossbeam-epoch etc.)
    "RUSTSEC-2024-0384",
    # paste is unmaintained (transitive via various macro crates)
    "RUSTSEC-2024-0436",
    # rustls-pemfile is unmaintained (transitive via hyper-rustls etc.)
    "RUSTSEC-2025-0134",
    # Marvin Attack: timing sidechannel in RSA (transitive via ring/rustls)
    "RUSTSEC-2023-0071",
    # Rand unsound with custom logger (transitive via many crates)
    "RUSTSEC-2026-0097",
    # ring: name constraints for URI names incorrectly accepted
    "RUSTSEC-2026-0098",
    # ring: name constraints for wildcard certificates
    "RUSTSEC-2026-0099",
    # ring: reachable panic in CRL parsing
    "RUSTSEC-2026-0104",
    # gix: undefined behavior in Remote::list()
    "RUSTSEC-2026-0183",
    # gix: undefined behavior with Signature from buffer
    "RUSTSEC-2026-0184",
    # rmcp: DNS rebinding in Streamable HTTP server transport (missing Host
    # header validation). Patched in rmcp >= 1.4.0; we are on 0.16.0 and the
    # upgrade is a breaking major-version migration tracked separately. djinn's
    # MCP server runs ingress-fronted + OAuth-authenticated, not as a loopback
    # server, which is the primary DNS-rebinding target. Remove this on upgrade.
    "RUSTSEC-2026-0189",
    # anyhow: unsoundness in Error::downcast_mut() violates borrow rules
    # (transitive via many crates). Patched in anyhow >= 1.0.103; remove on
    # upgrade.
    "RUSTSEC-2026-0190",
]

# ---------------------------------------------------------------------------
# Licenses
#
# Explicit allowlist reconciled against the server dependency graph as of
# 2026-06-23.  Workspace crates are excluded via [licenses.private] because
# none are published to crates.io.
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates are not published to crates.io; skip their license check.
ignore = true

# ---------------------------------------------------------------------------
# Bans — green ratchet for sqlx direct wrappers.
#
# Only the workspace crates listed in `wrappers` may declare a direct
# dependency on `sqlx`.  Any new crate that adds `sqlx` to its own
# [dependencies] will fail this check.
#
# sqlx helper crates (sqlx-core, sqlx-macros, sqlx-macros-core, sqlx-mysql,
# sqlx-postgres) are transitive dependencies pulled in by the allowed
# wrappers and are intentionally NOT banned — the ratchet targets direct
# wrapper crates only.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"

deny = [
    { crate = "sqlx", wrappers = [
        "djinn-server",
        "djinn-agent",
        "djinn-control-plane",
        "djinn-core",
        "djinn-db",
        "djinn-memory",
        "djinn-provider",
        "workspace-hack",
    ] },
]
