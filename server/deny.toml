# cargo-deny configuration for the djinn server workspace.
#
# Run from server/:
#   cargo deny check
#   cargo deny check advisories
#   cargo deny check licenses
#   cargo deny check bans
#
# Reference: https://embarkstudios.github.io/cargo-deny/

# ---------------------------------------------------------------------------
# Advisories
#
# Fail on known vulnerabilities and yanked crates.  The advisories check
# always fails on vulnerable and yanked crates by default in cargo-deny
# 0.19.x.  Known advisories for transitive dependencies that cannot be
# resolved without upstream upgrades are listed below so that the gate
# remains green while the team tracks fixes.
# ---------------------------------------------------------------------------
[advisories]
ignore = [
    # backoff is unmaintained (transitive via kube-runtime → kube)
    "RUSTSEC-2025-0012",
    # bincode 1.x is unmaintained (transitive via tokenizers)
    "RUSTSEC-2025-0141",
    # derivative is unmaintained (transitive via multiple crates)
    "RUSTSEC-2024-0388",
    # instant is unmaintained (transitive via crossbeam-epoch etc.)
    "RUSTSEC-2024-0384",
    # paste is unmaintained (transitive via various macro crates)
    "RUSTSEC-2024-0436",
    # rustls-pemfile is unmaintained (transitive via hyper-rustls etc.)
    "RUSTSEC-2025-0134",
    # Marvin Attack: timing sidechannel in RSA (transitive via ring/rustls)
    "RUSTSEC-2023-0071",
    # Rand unsound with custom logger (transitive via many crates)
    "RUSTSEC-2026-0097",
    # ring: name constraints for URI names incorrectly accepted
    "RUSTSEC-2026-0098",
    # ring: name constraints for wildcard certificates
    "RUSTSEC-2026-0099",
    # ring: reachable panic in CRL parsing
    "RUSTSEC-2026-0104",
    # gix: undefined behavior in Remote::list()
    "RUSTSEC-2026-0183",
    # gix: undefined behavior with Signature from buffer
    "RUSTSEC-2026-0184",
    # rmcp: DNS rebinding in Streamable HTTP server transport (missing Host
    # header validation). Patched in rmcp >= 1.4.0; we are on 0.16.0 and the
    # upgrade is a breaking major-version migration tracked separately. djinn's
    # MCP server runs ingress-fronted + OAuth-authenticated, not as a loopback
    # server, which is the primary DNS-rebinding target. Remove this on upgrade.
    "RUSTSEC-2026-0189",
    # anyhow: unsoundness in Error::downcast_mut() violates borrow rules
    # (transitive via many crates). Patched in anyhow >= 1.0.103; remove on
    # upgrade.
    "RUSTSEC-2026-0190",
]

# ---------------------------------------------------------------------------
# Licenses
#
# Explicit allowlist reconciled against the server dependency graph as of
# 2026-06-23.  Workspace crates are excluded via [licenses.private] because
# none are published to crates.io.
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates are not published to crates.io; skip their license check.
ignore = true

# ---------------------------------------------------------------------------
# Bans — direct-dependency wrapper ratchets for capability-owner crates.
#
# The `[bans]` entries below are intentionally narrow: they only stop a NEW
# workspace crate from directly pulling in a capability-owner crate. They are
# NOT a proof that call sites are confined to the owner crate. The source
# capability-boundary scripts (`scripts/check_boundaries.py`,
# `scripts/check-capability-*.sh`) and their allowlist remain the authority for
# shell-outs, direct API calls, and transitive-call-site ownership.
#
# `workspace-hack` is included in each `wrappers` list because it mirrors the
# unified dependency graph via hakari and is not a normal consumer of the
# capability. Any crate that is an allowed wrapper must appear by its Cargo
# package name.
#
# Helper crates (e.g. sqlx-core, sqlx-macros, libgit2-sys, hyper, etc.) are
# transitive dependencies pulled in by the allowed wrappers and are
# intentionally NOT banned — the ratchets target direct declarations only.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"

deny = [
    # sqlx: only database-owner crates may declare it directly. The live
    # workspace currently has djinn-server, djinn-agent, djinn-control-plane,
    # djinn-core, djinn-db, djinn-memory, and djinn-provider as direct
    # dependents; workspace-hack is included for hakari unification.
    { crate = "sqlx", wrappers = [
        "djinn-server",
        "djinn-agent",
        "djinn-control-plane",
        "djinn-core",
        "djinn-db",
        "djinn-memory",
        "djinn-provider",
        "workspace-hack",
    ] },

    # git2: the git-capability owner crate is djinn-git. Only crates that are
    # allowed to touch libgit2 directly are listed here as first-party
    # wrappers. In the current workspace these are djinn-git, djinn-agent,
    # djinn-image-controller, djinn-stack, djinn-workspace, and djinn-server
    # (for the `vendored` feature flag that forwards git2 features).
    # workspace-hack is included for hakari unification.
    #
    # NOTE: This ratchet does NOT catch git shell-outs (e.g. `git clone`,
    # `git rev-parse`); the source capability-boundary script for git is the
    # authority for shell-outs and call-site confinement.
    { crate = "git2", wrappers = [
        "djinn-git",
        "djinn-agent",
        "djinn-image-controller",
        "djinn-stack",
        "djinn-workspace",
        "djinn-server",
        "workspace-hack",
    ] },

    # reqwest: the outbound-HTTP owner crate is djinn-provider. The current
    # workspace has many crates directly depending on reqwest, both as
    # first-party wrappers (djinn-server, djinn-agent, djinn-control-plane,
    # djinn-coordinator, and djinn-provider) and as transitive third-party
    # crates (opentelemetry-otlp/opentelemetry-http, hf-hub, rmcp). We can only
    # ratchet the first-party direct declarations; third-party reqwest pulls
    # are listed below as `wrappers` so the existing graph stays green while
    # new first-party direct dependencies are still rejected.
    #
    # NOTE: This ratchet does NOT catch lower-level HTTP clients (e.g. hyper,
    # kube-client) or network shells-outs; the source capability-boundary
    # script for outbound HTTP is the authority for shell-outs and call-site
    # confinement.
    { crate = "reqwest", wrappers = [
        "djinn-server",
        "djinn-agent",
        "djinn-control-plane",
        "djinn-coordinator",
        "djinn-provider",
        "opentelemetry-otlp",
        "opentelemetry-http",
        "hf-hub",
        "rmcp",
        "workspace-hack",
    ] },

    # kube and k8s-openapi: the Kubernetes client capability owner crate is
    # djinn-k8s. Only djinn-k8s and djinn-image-controller are first-party
    # wrappers that directly declare these crates. kube-runtime, kube-core, and
    # kube-client are kube-internal transitive dependencies listed below as
    # wrappers so the existing graph stays green; new first-party direct
    # dependencies are still rejected.
    #
    # NOTE: These ratchets do NOT catch in-cluster API calls through raw HTTP
    # clients, kubectl shell-outs, or other Kubernetes-adjacent libraries; the
    # source capability-boundary script for Kubernetes is the authority for
    # shell-outs and call-site confinement.
    { crate = "kube", wrappers = [
        "djinn-k8s",
        "djinn-image-controller",
    ] },
    { crate = "k8s-openapi", wrappers = [
        "djinn-k8s",
        "djinn-image-controller",
        "kube",
        "kube-runtime",
        "kube-core",
        "kube-client",
    ] },
]
