{{- $githubAppConfigAttempted := include "djinn.githubAppConfigAttempted" . -}}
{{- $buildAdmission := .Values.buildAdmission -}}
{{- $server := .Values.server -}}
{{- $migrationOperatorSecret := default "" .Values.migration.designatedOperatorSecret -}}
{{- if .Release.IsInstall -}}
  {{- $migrationOperatorSecret = required "migration.designatedOperatorSecret is required on fresh installs to bootstrap the caller-owned designated operator" .Values.migration.designatedOperatorSecret -}}
{{- end -}}
{{- if eq $buildAdmission.mode "enforce" -}}
  {{- if ne (int $server.replicas) 1 -}}
    {{- fail "buildAdmission.mode=enforce requires server.replicas=1" -}}
  {{- end -}}
  {{- if eq $server.strategy.type "RollingUpdate" -}}
    {{- if or (ne (toString $server.strategy.rollingUpdate.maxSurge) "0") (ne (toString $server.strategy.rollingUpdate.maxUnavailable) "1") -}}
      {{- fail "buildAdmission.mode=enforce requires server.strategy RollingUpdate with maxSurge=0 and maxUnavailable=1" -}}
    {{- end -}}
  {{- else if ne $server.strategy.type "Recreate" -}}
    {{- fail "buildAdmission.mode=enforce requires server.strategy.type=Recreate or non-overlapping RollingUpdate" -}}
  {{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "djinn.fullname" . }}-server
  namespace: {{ include "djinn.namespace" . }}
  labels:
    {{- include "djinn.server.labels" . | nindent 4 }}
spec:
  replicas: {{ $server.replicas }}
  strategy:
    # Coordinator leadership is gated by a Postgres advisory lock (see
    # `djinn_server::leadership` + `AppState::become_leader`), so a brief
    # two-pod overlap during a deploy is safe: only the lock-holder dispatches
    # Jobs / runs the coordinator + worker RPC listener; the other pod serves
    # HTTP in standby. That lets us surge — bring the new pod to Ready BEFORE
    # terminating the old one — which closes the zero-Ready-endpoint window
    # that `Recreate` left behind (the ingress 503 on every deploy).
    # `maxUnavailable: 0` guarantees the old pod isn't torn down until the new
    # one is Ready and serving; `maxSurge: 1` caps the overlap at one extra pod.
    # The new pod boots in HTTP-only standby (readiness is independent of
    # leadership) and promotes itself once the old pod exits and releases the
    # advisory lock.
    type: {{ $server.strategy.type }}
    {{- if eq $server.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ $server.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ $server.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "djinn.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Protect the control plane from Karpenter consolidation eviction. The
        # server is the RPC hub + coordinator; if it's drained for bin-packing,
        # every in-flight worker loses its RPC stream and its run ends
        # Interrupted/[] (and the Recreate rollout gap is re-incurred for no
        # deploy). Voluntary-disruption opt-out only; it can still be drained
        # for a real node failure or a chart rollout.
        karpenter.sh/do-not-disrupt: "true"
        # Rotate Pod when any of its mounted config changes — kagent pattern.
        # `sha256sum` of the rendered template text is enough for detection.
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret-github-app: {{ include (print $.Template.BasePath "/secret-github-app.yaml") . | sha256sum }}
        checksum/secret-vault-key: {{ include (print $.Template.BasePath "/secret-vault-key.yaml") . | sha256sum }}
      labels:
        {{- include "djinn.server.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "djinn.serviceAccountName.controller" . }}
      # Give the binary's shutdown path (HTTP drain → RPC drain → SQLx
      # pool close, capped at 30s internally) enough headroom to run
      # before SIGKILL. Without this, in-flight statements on the SQLx
      # pool die mid-statement and Postgres has to abort them server-side
      # (visible as "aborted_connection" in pg_stat_database). 60s is the
      # chart's contract with the binary — see `main.rs`'s `pool.close()`
      # deadline.
      terminationGracePeriodSeconds: 60
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # hostPath / PVC volumes land owned by root:root, but djinn-server runs
      # as uid 10001. fsGroup only helps for CSI-backed PVCs, not hostPath, so
      # we chown the three writable mounts up-front in a root initContainer.
      # Idempotent — re-runs every pod start with negligible cost.
      initContainers:
        - name: fix-volume-perms
          image: {{ .Values.image.server | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for d in /var/lib/djinn/mirrors /var/lib/djinn/cache /var/lib/djinn/projects; do
                mkdir -p "$d"
                chown 10001:10001 "$d"
                chmod 0775 "$d"
              done
          volumeMounts:
            - name: mirrors
              mountPath: /var/lib/djinn/mirrors
            - name: cache
              mountPath: /var/lib/djinn/cache
            - name: projects
              mountPath: /var/lib/djinn/projects
        # Apply pending SQL migrations before the server boots.
        #
        # This was a separate `pre-install,pre-upgrade` Helm hook Job, but a
        # hook runs in its own phase BEFORE the chart's normal resources are
        # applied — so on a cold install neither this ServiceAccount nor the
        # bundled Postgres StatefulSet exist yet, and the migrator can never
        # connect (the hook silently assumed an already-running external DB, as
        # in the ArgoCD/EKS path where every sync is an upgrade of a live app).
        # A fresh `helm install` with bundled Postgres therefore wedged in
        # pending-install forever.
        #
        # As an initContainer it's an ordinary part of the Deployment: it reads
        # the CURRENT release's ConfigMap (no stale-configmap foot-gun), waits
        # for Postgres via the binary's built-in `wait_for_database_reachable`
        # (~60s TCP retry), takes the sqlx migrator advisory lock to apply
        # migrations, then exits — the app container boots next and only
        # verifies the schema (lock-free). With replicas=1 + maxSurge=1 exactly
        # one migrator runs at a time; the advisory lock serialises any overlap.
        # Works identically for fresh/upgrade and bundled/external Postgres.
{{- if .Release.IsInstall }}
        - name: bootstrap-designated-operator
          image: {{ .Values.image.server | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["djinn-server"]
          args: ["--bootstrap-designated-operator-only"]
          envFrom:
            - configMapRef:
                name: {{ include "djinn.fullname" . }}-server
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: DJINN_MIGRATION_DESIGNATED_OPERATOR_USER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $migrationOperatorSecret | quote }}
                  key: user_id
            - name: DJINN_BOOTSTRAP_DESIGNATED_OPERATOR_GITHUB_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $migrationOperatorSecret | quote }}
                  key: github_id
            - name: DJINN_BOOTSTRAP_DESIGNATED_OPERATOR_GITHUB_LOGIN
              valueFrom:
                secretKeyRef:
                  name: {{ $migrationOperatorSecret | quote }}
                  key: github_login
            {{- if .Values.database.existingSecret }}
            # Use the same caller-owned URL as migrate and the application.
            - name: DJINN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: url
            {{- end }}
            - name: DJINN_UI_ENABLED
              value: "false"
            - name: MALLOC_CONF
              value: {{ $server.mallocConf | quote }}
{{- end }}
        - name: migrate
          image: {{ .Values.image.server | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["djinn-server"]
          args: ["--migrate-only"]
          envFrom:
            - configMapRef:
                name: {{ include "djinn.fullname" . }}-server
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if $migrationOperatorSecret }}
            - name: DJINN_MIGRATION_DESIGNATED_OPERATOR_USER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $migrationOperatorSecret | quote }}
                  key: user_id
            {{- end }}
            {{- if .Values.database.existingSecret }}
            # External DB URL from a caller-owned Secret — the ConfigMap omits
            # DJINN_DATABASE_URL in this mode, mirroring the app container.
            - name: DJINN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: url
            {{- end }}
            # migrate-only never serves HTTP/UI — skip the embedded-asset probe.
            - name: DJINN_UI_ENABLED
              value: "false"
            # Keep allocator behavior identical to the application server.
            - name: MALLOC_CONF
              value: {{ $server.mallocConf | quote }}
          resources:
            {{- toYaml .Values.resources.server | nindent 12 }}
      containers:
        - name: djinn-server
          image: {{ .Values.image.server | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: rpc
              containerPort: {{ .Values.service.rpcPort }}
              protocol: TCP
            - name: api
              containerPort: {{ .Values.service.apiPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "djinn.fullname" . }}-server
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.database.existingSecret }}
            # External DB URL pulled from a caller-owned Secret (typically
            # provisioned out-of-band for RDS credentials). The configmap
            # intentionally skips DJINN_DATABASE_URL when this is set, so
            # the env name only lands here.
            - name: DJINN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: url
            {{- end }}
            # Shared with migrate-only so all djinn-server invocations use the
            # operator-selected jemalloc configuration.
            - name: MALLOC_CONF
              value: {{ $server.mallocConf | quote }}
            # HTTP bind port — must match `service.apiPort`. The binary's
            # CLI default is 8372 (legacy local-dev), so we have to pin it
            # here or the readiness probe would never pass.
            - name: DJINN_PORT
              value: {{ .Values.service.apiPort | quote }}
            # Pin the worker reverse-RPC bind addr explicitly; the code
            # defaults to 0.0.0.0:8443 already but surfacing it here makes
            # the chart self-documenting.
            - name: DJINN_RPC_ADDR
              value: {{ printf "0.0.0.0:%d" (.Values.service.rpcPort | int) | quote }}
            # Force the k8s runtime path even though it's the default — we
            # never want a chart-managed Deployment accidentally running as
            # the in-process TestRuntime.
            - name: DJINN_RUNTIME
              value: "kubernetes"
            # Keep cleanup off migrate-only: only the application container
            # activates the coordinator's selected cleanup mode.
            - name: DJINN_CACHE_CLEANUP_MODE
              value: {{ .Values.cacheCleanup.mode | quote }}
            # Admission mode and cap are intentionally literal server env
            # entries, rather than implicit binary defaults. Enforce topology
            # validation above makes this exact configuration safe to render.
            - name: DJINN_BUILD_ADMISSION_MODE
              value: {{ $buildAdmission.mode | quote }}
            - name: DJINN_MAX_BUILD_TASKRUNS
              value: {{ $buildAdmission.maxBuildTaskRuns | quote }}
            - name: DJINN_IMAGE_BUILDER_IMAGE
              value: {{ .Values.imagePipeline.builderImage | quote }}
            # Fully-qualified ref used in `COPY --from=<ref>` in each
            # generated project Dockerfile. Must be pullable from inside
            # the cluster (i.e. include the registry host). Local-dev
            # sets this to `localhost:5001/djinn-agent-runtime:dev`.
            - name: DJINN_IMAGE_AGENT_WORKER_IMAGE
              value: {{ .Values.image.runtime | quote }}
            # The djinn release version (tag of the server image). Folded into
            # the per-project catalog image hash so a version bump rebuilds
            # every project image — guaranteeing new agent prompts/tools reach
            # task-run pods even when `image.runtime` is an unversioned tag.
            - name: DJINN_VERSION
              value: {{ .Values.image.server | toString | splitList ":" | last | quote }}
            # Image-pipeline hostnames are computed from the release name
            # here so the Rust controller doesn't fall back to its
            # hardcoded `djinn-`-prefixed defaults when the Helm release
            # is named something else. Override at values level via
            # imagePipeline.registryHost / imagePipeline.buildkitdHost.
            - name: DJINN_IMAGE_REGISTRY_HOST
              value: {{ include "djinn.imagePipeline.registryHost" . | quote }}
            - name: DJINN_IMAGE_BUILDKITD_HOST
              value: {{ include "djinn.imagePipeline.buildkitdHost" . | quote }}
            - name: DJINN_IMAGE_NAMESPACE
              value: {{ include "djinn.namespace" . | quote }}
            # SA the build Pod runs under. Must carry the cluster's IRSA /
            # Workload-Identity annotation so the docker credential helper
            # baked into djinn-image-builder can authenticate to the managed
            # registry (ECR/GCR/ACR). Reusing djinn-controller (the SA the
            # server itself runs as) keeps the build Pod inside the same
            # trust boundary as its dispatcher.
            - name: DJINN_IMAGE_BUILD_SERVICE_ACCOUNT
              value: {{ include "djinn.serviceAccountName.controller" . | quote }}
            - name: DJINN_IMAGE_REGISTRY_AUTH_SECRET
              value: {{ include "djinn.imagePipeline.registryAuthSecretName" . | quote }}
            # Retention is disabled and dry-run by default. Keep these runtime
            # settings adjacent to the Zot registry wiring so a destructive
            # Zot policy cannot be rendered without the server's startup
            # preflight receiving the same mode and newest-tag count.
            - name: DJINN_ZOT_RETENTION_ENABLED
              value: {{ .Values.imagePipeline.zot.retention.enabled | quote }}
            - name: DJINN_ZOT_RETENTION_DRY_RUN
              value: {{ .Values.imagePipeline.zot.retention.dryRun | quote }}
            - name: DJINN_ZOT_RETENTION_NEWEST_TAGS
              value: {{ .Values.imagePipeline.zot.retention.newestTags | quote }}
            - name: DJINN_ZOT_RETENTION_ENDPOINT
              value: {{ printf "http://%s" (include "djinn.imagePipeline.registryHost" .) | quote }}
            # The preflight HTTP client needs the same basic-auth credentials
            # as Zot. Both chart-generated and caller-owned auth Secrets use
            # the `username` and `password` keys; values never land in a
            # ConfigMap or a literal env value. Omit refs when in-cluster Zot
            # is disabled because retention is necessarily non-destructive.
            {{- if .Values.imagePipeline.zot.enabled }}
            - name: DJINN_ZOT_RETENTION_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "djinn.imagePipeline.registryAuthSecretName" . | quote }}
                  key: username
            - name: DJINN_ZOT_RETENTION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "djinn.imagePipeline.registryAuthSecretName" . | quote }}
                  key: password
            {{- end }}
            - name: DJINN_IMAGE_MIRROR_PVC
              value: {{ include "djinn.pvcName.mirrors" . | quote }}
            # Cluster-wide cap on concurrent project-image build Jobs. The
            # controller counts live build Jobs each reconcile pass and
            # defers new ones once this many are in flight, so a mass
            # rebuild (e.g. a worker-ref bump invalidating every project's
            # image hash) can't starve the single shared buildkitd into a
            # liveness-kill crash loop. Deferred projects are picked up on a
            # later tick as slots free.
            - name: DJINN_IMAGE_MAX_CONCURRENT
              value: {{ .Values.imagePipeline.controller.maxConcurrentBuilds | quote }}
            # djinn-k8s runtime (task-run + warm-job dispatcher) — same
            # pattern as the image pipeline above: everything is derived
            # from the release fullname + namespace so no hardcoded
            # "djinn-" prefix leaks into the compiled binary.
            - name: DJINN_K8S_NAMESPACE
              value: {{ include "djinn.namespace" . | quote }}
            - name: DJINN_K8S_SERVICE_ACCOUNT
              value: {{ include "djinn.serviceAccountName.taskrun" . | quote }}
            - name: DJINN_K8S_MIRROR_PVC
              value: {{ include "djinn.pvcName.mirrors" . | quote }}
            - name: DJINN_K8S_CACHE_PVC
              value: {{ include "djinn.pvcName.cache" . | quote }}
            - name: DJINN_K8S_SERVER_ADDR
              value: {{ printf "%s-server.%s.svc.cluster.local:%d"
                        (include "djinn.fullname" .)
                        (include "djinn.namespace" .)
                        (.Values.service.rpcPort | int) | quote }}
            # Resource sizing the controller stamps onto the task-run + warm
            # Job PodSpecs it dispatches. These size the EPHEMERAL worker/warm
            # Pods djinn-server spawns, NOT this long-lived server Pod (that's
            # `resources.server` on the container below). Sourced from
            # `resources.taskrun` / `resources.warm` in values.yaml.
            #
            # Emitted BEFORE the `extraEnv` include at the end of this env list
            # on purpose: Kubernetes resolves a duplicate env name to the LAST
            # entry, so an operator who also sets any of these via `extraEnv`
            # still wins. Keep new sizing vars above the `extraEnv` block to
            # preserve that override property.
            - name: DJINN_K8S_CPU_REQUEST
              value: {{ .Values.resources.taskrun.requests.cpu | quote }}
            - name: DJINN_K8S_CPU_LIMIT
              value: {{ .Values.resources.taskrun.limits.cpu | quote }}
            - name: DJINN_K8S_MEMORY_REQUEST
              value: {{ .Values.resources.taskrun.requests.memory | quote }}
            - name: DJINN_K8S_MEMORY_LIMIT
              value: {{ .Values.resources.taskrun.limits.memory | quote }}
            - name: DJINN_K8S_WARM_CPU_REQUEST
              value: {{ .Values.resources.warm.requests.cpu | quote }}
            - name: DJINN_K8S_WARM_CPU_LIMIT
              value: {{ .Values.resources.warm.limits.cpu | quote }}
            - name: DJINN_K8S_WARM_MEMORY_REQUEST
              value: {{ .Values.resources.warm.requests.memory | quote }}
            - name: DJINN_K8S_WARM_MEMORY_LIMIT
              value: {{ .Values.resources.warm.limits.memory | quote }}
            - name: DJINN_K8S_WARM_JOB_TIMEOUT_SECONDS
              value: {{ .Values.resources.warm.jobTimeoutSeconds | quote }}
            # Pod scheduling for task-run + warm Jobs. JSON-encoded so the
            # controller can deserialize directly into k8s_openapi types
            # without bringing a YAML parser into the dispatch path. The
            # `with` blocks omit the env var entirely when the values are
            # empty defaults, leaving the controller on its built-in fallback
            # (no scheduling hints — matches pre-feature behavior).
            {{- with .Values.resources.taskrun.nodeSelector }}
            - name: DJINN_K8S_NODE_SELECTOR
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .Values.resources.taskrun.tolerations }}
            - name: DJINN_K8S_TOLERATIONS
              value: {{ toJson . | quote }}
            {{- end }}
            - name: DJINN_VAULT_KEY_PATH
              value: /var/run/secrets/djinn/vault.key
            {{- if $githubAppConfigAttempted }}
            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: /var/run/secrets/djinn/github-app/private-key.pem
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "djinn.secretName.githubApp" . }}
                  key: app-id
                  optional: true
            - name: GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "djinn.secretName.githubApp" . }}
                  key: client-id
                  optional: true
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "djinn.secretName.githubApp" . }}
                  key: client-secret
                  optional: true
            {{- end }}
            # Provider API keys — read by djinn-provider::bootstrap at startup.
            # Every entry is optional: the Secret is rendered with empty
            # strings for unset keys, and `optional: true` means the pod
            # happily starts even if the Secret doesn't exist at all (e.g. an
            # operator who only uses Codex OAuth through the UI).
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "djinn.secretName.providers" . }}
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "djinn.secretName.providers" . }}
                  key: OPENAI_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "djinn.secretName.providers" . }}
                  key: GOOGLE_API_KEY
                  optional: true
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "djinn.secretName.providers" . }}
                  key: AZURE_OPENAI_API_KEY
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "djinn.secretName.providers" . }}
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "djinn.secretName.providers" . }}
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: GCP_VERTEX_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "djinn.secretName.providers" . }}
                  key: GCP_VERTEX_PROJECT_ID
                  optional: true
            {{- if .Values.langfuse.enabled }}
            - name: DJINN_LANGFUSE_ENDPOINT
              value: {{ .Values.langfuse.endpoint | quote }}
            - name: DJINN_LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "djinn.secretName.langfuse" . }}
                  key: DJINN_LANGFUSE_PUBLIC_KEY
            - name: DJINN_LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "djinn.secretName.langfuse" . }}
                  key: DJINN_LANGFUSE_SECRET_KEY
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: mirrors
              mountPath: /var/lib/djinn/mirrors
            - name: cache
              mountPath: /var/lib/djinn/cache
            - name: projects
              mountPath: /var/lib/djinn/projects
            - name: vault-key
              mountPath: /var/run/secrets/djinn/vault.key
              subPath: vault.key
              readOnly: true
            {{- if $githubAppConfigAttempted }}
            - name: github-app
              mountPath: /var/run/secrets/djinn/github-app
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources.server | nindent 12 }}
          lifecycle:
            # On termination, sleep briefly *before* the SIGTERM. The
            # endpoints controller propagates the deleted pod to every
            # kube-proxy asynchronously, so for a few hundred ms after
            # the pod enters Terminating, new traffic can still land on
            # us. The sleep lets that propagation finish, so when the
            # binary's `with_graceful_shutdown` flips it actually has no
            # in-flight requests to drain.
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            initialDelaySeconds: 5
            # The default 1s timeout fails spuriously when task-run pods
            # oversubscribe the node during compile/link storms; /health is
            # cheap, so a slow answer means CPU starvation, not sickness.
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            initialDelaySeconds: 30
            timeoutSeconds: 5
            # 5 × 30s = 150s of sustained unresponsiveness before a restart.
            # Every liveness restart wipes in-memory session-activity state
            # and orphans the running worker fleet, so restarting the server
            # must be a last resort, not a response to load spikes.
            failureThreshold: 5
      volumes:
        - name: mirrors
          persistentVolumeClaim:
            claimName: {{ include "djinn.pvcName.mirrors" . }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "djinn.pvcName.cache" . }}
        - name: projects
          persistentVolumeClaim:
            claimName: {{ include "djinn.pvcName.projects" . }}
        - name: vault-key
          secret:
            secretName: {{ include "djinn.secretName.vaultKey" . }}
            items:
              - key: vault.key
                path: vault.key
            # 0444 (world-readable) so the non-root djinn user (uid 10001)
            # can read the file. The Secret is namespace-scoped + only
            # mounted into this Pod, so "world-readable" inside the
            # container is fine.
            defaultMode: 0444
        {{- if $githubAppConfigAttempted }}
        - name: github-app
          secret:
            secretName: {{ include "djinn.secretName.githubApp" . }}
            optional: true
            # 0444 (world-readable) so the non-root djinn user (uid 10001)
            # can read the file. The Secret is namespace-scoped + only
            # mounted into this Pod, so "world-readable" inside the
            # container is fine.
            defaultMode: 0444
        {{- end }}
