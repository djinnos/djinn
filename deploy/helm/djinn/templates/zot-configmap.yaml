{{- if and .Values.imagePipeline.zot.retention.enabled (not .Values.imagePipeline.zot.retention.dryRun) (or (not .Values.imagePipeline.enabled) (not .Values.imagePipeline.zot.enabled)) -}}
{{- fail "imagePipeline.zot.retention cannot be destructive unless imagePipeline.enabled and imagePipeline.zot.enabled are true; no Zot policy or matching runtime preflight endpoint would be rendered" -}}
{{- end -}}
{{- if and .Values.imagePipeline.enabled .Values.imagePipeline.zot.enabled -}}
# Zot registry configuration. Single rendered config.json mounted into the
# StatefulSet at /etc/zot/config.json. Live GC (gcInterval, gcDelay) keeps
# storage bounded without a restart; dedupe dedupes identical blobs across
# repos which matters heavily for per-project devcontainer builds that share
# the djinn-agent-worker Feature base layers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-zot-config" (include "djinn.fullname" .) }}
  namespace: {{ include "djinn.namespace" . }}
  labels:
    {{- include "djinn.labels" . | nindent 4 }}
    app.kubernetes.io/component: zot
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": true,
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h"{{- if .Values.imagePipeline.zot.retention.enabled }},
        "retention": {
          "dryRun": {{ .Values.imagePipeline.zot.retention.dryRun }},
          "delay": "1h",
          "policies": [
            {
              "repositories": ["djinn-image-*"],
              "deleteUntagged": {{ .Values.imagePipeline.zot.retention.deleteUntagged }},
              "keepTags": [
                {
                  "newest": {{ .Values.imagePipeline.zot.retention.newestTags }}
                }
              ]
            }
          ]
        }{{- end }}
      },
      "http": {
        "address": "0.0.0.0",
        "port": "{{ .Values.imagePipeline.zot.port }}",
        "auth": {
          "htpasswd": {
            "path": "/secret/htpasswd"
          }
        },
        "accessControl": {
          "repositories": {
            "**": {
              "policies": [
                {
                  "users": [{{ .Values.imagePipeline.zot.auth.username | default "djinn" | quote }}],
                  "actions": ["read", "create", "update", "delete"]
                }
              ]{{- if .Values.imagePipeline.zot.anonymousPull }},
              "anonymousPolicy": ["read"]{{- end }}
            }
          }
        }
      },
      "log": {
        "level": "info"
      }
    }
{{- end -}}
