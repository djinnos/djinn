{{- if and .Values.imagePipeline.enabled (not .Values.imagePipeline.zot.auth.existingSecret) -}}
# Docker auth used by buildkitd. Three rendering modes share one template +
# Secret so the buildkitd Deployment never has to change its mount.
#
#  * credHelpers mode — when `imagePipeline.buildkitd.credHelpers` is set,
#    render a config.json that maps each registry host to a credential
#    helper. The helper binaries live in the djinn-buildkitd image; cloud
#    identity flows in via the controller/taskrun SA annotations. No
#    htpasswd is emitted (cloud registries don't use Zot's basic auth).
#
#  * Zot mode — when in-cluster Zot is enabled, render an htpasswd line
#    for Zot's HTTP basic-auth AND a docker auth entry under the same
#    username/password pair. Used by the chart-rendered Zot StatefulSet.
#
#  * Anonymous mode — neither credHelpers nor in-cluster Zot (e.g. local
#    kind-registry). Render an empty `{"auths":{}}` config.json so the
#    buildkitd mount succeeds; the registry itself requires no auth.
#
# An existingSecret in values bypasses this template entirely; the operator
# is then responsible for whichever keys their buildkitd setup needs.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "djinn.imagePipeline.registryAuthSecretName" . }}
  namespace: {{ include "djinn.namespace" . }}
  labels:
    {{- include "djinn.labels" . | nindent 4 }}
    app.kubernetes.io/component: buildkitd
type: Opaque
{{- if .Values.imagePipeline.buildkitd.credHelpers }}
{{- $cfg := dict "credHelpers" .Values.imagePipeline.buildkitd.credHelpers }}
stringData:
  config.json: {{ toJson $cfg | quote }}
{{- else if .Values.imagePipeline.zot.enabled }}
{{- $user := .Values.imagePipeline.zot.auth.username | default "djinn" }}
{{- $pass := .Values.imagePipeline.zot.auth.password | default "djinn" }}
{{- $registry := include "djinn.imagePipeline.registryHost" . }}
{{- $b64cred := printf "%s:%s" $user $pass | b64enc }}
{{- $cfg := dict "auths" (dict $registry (dict "auth" $b64cred)) }}
stringData:
  htpasswd: {{ htpasswd $user $pass | quote }}
  config.json: {{ toJson $cfg | quote }}
  # The server's Zot retention preflight authenticates with these key refs.
  # They are intentionally Secret data, never ConfigMap data.
  username: {{ $user | quote }}
  password: {{ $pass | quote }}
{{- else }}
# Anonymous-registry fallback (e.g. kind-registry in local/kind installs):
# no credHelpers, no in-cluster Zot, but buildkitd-deployment still mounts
# `config.json` from this Secret, so render an empty auths config rather
# than letting the mount fail with "non-existent secret key: config.json".
stringData:
  config.json: {{ toJson (dict "auths" dict) | quote }}
{{- end }}
{{- end -}}
