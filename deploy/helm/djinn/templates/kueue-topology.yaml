{{- /*
Kueue queue topology (ResourceFlavor + ClusterQueue + two LocalQueues).

These are `kueue.x-k8s.io/v1beta1` objects, so the API server rejects them
outright on a cluster where Kueue is not installed. Until this guard existed
the templates rendered UNCONDITIONALLY, which made the whole `djinn` chart
un-installable on any cluster lacking Kueue CRDs — observed on the production
VPS.

The guard is an explicit VALUE, deliberately not `.Capabilities.APIVersions`.
Capability probing returns nothing under `helm template`, which is exactly what
Tilt uses to render this chart, so a capability guard would silently omit the
topology in local dev and silently include it in a live install — two different
manifests from one chart, with no error either way.

An explicit value fails loudly instead. Set `kueue.enabled: true` only after
installing the prerequisite (`deploy/helm/djinn-prereqs`, see
deploy/kueue/README.md). If you set it true without that, `helm install` stops
with a plain "no matches for kind ResourceFlavor" from the API server — a
diagnosable error, not a chart that quietly ships less than you asked for.

This topology is INERT until `kueue.armed` is ALSO true. `kueue.enabled` renders
the queues; `kueue.armed` labels the Namespace and stamps `suspend` +
`kueue.x-k8s.io/queue-name` onto build Jobs. Keeping them separate is what makes
"Kueue installed, topology rendered, nothing captured" representable — the exact
state `deploy/kueue/zero-capture-gate.sh` verifies. `armed` implies `enabled`;
`deployment-server.yaml` fails the render on the other combination.
*/ -}}
{{- if .Values.kueue.enabled -}}
{{- $kueue := .Values.kueue -}}
{{- $capacity := $kueue.capacity -}}
{{- $dedicatedNodePool := and (eq $capacity.source "nodepool-limits") $capacity.nodePool.dedicated (ne $capacity.nodePool.name "") -}}
{{- $vectorV1 := eq $capacity.contract "vector-v1" -}}
{{- if not (kindIs "float64" $kueue.buildPods) -}}
{{- if not (kindIs "int64" $kueue.buildPods) -}}
{{- fail "kueue.enabled is true but kueue.buildPods is not a number. It is the pods nominalQuota for the ClusterQueue; set a positive integer, or set kueue.enabled=false if the Kueue prerequisite (deploy/helm/djinn-prereqs) is not installed." -}}
{{- end -}}
{{- end -}}
{{- $cohortName := printf "%s-build" (include "djinn.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- $taskQueueName := printf "%s-kueue" (include "djinn.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- $warmQueueName := printf "%s-warm" (include "djinn.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- $scipQueueName := printf "%s-scip" (include "djinn.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- /* Warm request values are projected by deployment-server.yaml. SCIP uses
      its singleton Job defaults in djinn_k8s::config. */ -}}
{{- $warmCpuRequest := .Values.resources.warm.requests.cpu -}}
{{- $warmMemoryRequest := .Values.resources.warm.requests.memory -}}
{{- $scipCpuRequest := "1" -}}
{{- $scipMemoryRequest := "4Gi" -}}
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: {{ printf "%s-kueue" (include "djinn.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "djinn.labels" . | nindent 4 }}
{{- if $dedicatedNodePool }}
spec:
  nodeLabels:
    karpenter.sh/nodepool: {{ $capacity.nodePool.name | quote }}
{{- else if $vectorV1 }}
spec:
  nodeLabels:
    {{ $capacity.flavorSelector.key }}: {{ $capacity.flavorSelector.value | quote }}
{{- else }}
spec: {}
{{- end }}
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: {{ $taskQueueName }}
  labels:
    {{- include "djinn.labels" . | nindent 4 }}
    djinn.io/quota-owner: derived-capacity
  annotations:
    djinn.io/binding-resource: pods
spec:
  cohort: {{ $cohortName }}
  preemption:
    reclaimWithinCohort: Never
  # WHO MAY SUBMIT — and the reason this line is not optional.
  #
  # MEASURED on a live armed kind cluster (fbiy-B1, 2026-07-30): with this field
  # ABSENT, every Workload this topology captured sat Pending forever with
  #
  #     QuotaReserved=False  reason=Pending
  #     "workload namespace doesn't match ClusterQueue selector"
  #
  # and NOTHING was ever admitted. `kueue.armed` renders build Jobs with
  # `suspend: true` and hands admission to Kueue; a ClusterQueue that admits
  # nothing therefore never undoes that suspend, so an armed install captures
  # every task-run/warm/SCIP Job and runs none of them. Patching `{}` onto the
  # live ClusterQueue admitted 2 of 3 queued Jobs within seconds — same cluster,
  # same Jobs, one field.
  #
  # The trap is in the CRD's own doc string: "Defaults to null which is a
  # nothing selector (no namespaces eligible). If set to an empty selector `{}`,
  # then all namespaces are eligible." An omitted selector is not "unrestricted";
  # it is "nobody", and it fails silently.
  #
  # `{}` rather than a label selector on purpose. The admission fence already
  # exists and it is not this field: Kueue only creates a Workload in a namespace
  # carrying `djinn.io/kueue-managed` (the prerequisite's
  # managedJobsNamespaceSelector), a Workload only reaches THIS ClusterQueue
  # through a LocalQueue, and all three LocalQueues are rendered into the djinn
  # namespace alone. A third, independently-settable copy of that same fence is
  # exactly what wedged admission here without a single error anywhere.
  namespaceSelector: {}
  # BestEffortFIFO, not StrictFIFO. Three Workload kinds (task-run, warm, SCIP)
  # share this queue, and a warm Pod is long-lived (measured 5442s end to end).
  # Under StrictFIFO one head-of-line Workload that cannot fit the current
  # CPU/memory/Pods vector blocks every smaller Workload behind it;
  # BestEffortFIFO lets smaller fits through. In vector-v1, Pods is the real
  # Node ceiling rather than a three-slot cap. Fairness across kinds is not a
  # goal here — throughput is.
  queueingStrategy: BestEffortFIFO
  # WHAT IS BOUNDED.
  #
  # The declared finite vector is this cohort's complete nominal capacity.
  # Background singleton queues own zero and borrow their Pod requests.
  # Kueue computes a Workload's request across every resource its PodSet asks
  # for, so all three request dimensions need one named flavor.
  resourceGroups:
    - coveredResources: ["pods", "cpu", "memory"]
      flavors:
        - name: {{ printf "%s-kueue" (include "djinn.fullname" .) | trunc 63 | trimSuffix "-" }}
          resources:
            - name: pods
              nominalQuota: {{ $kueue.buildPods }}
            - name: cpu
              nominalQuota: {{ $kueue.buildCpu }}
            - name: memory
              nominalQuota: {{ $kueue.buildMemory }}
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: {{ include "djinn.fullname" . }}-task-run
  namespace: {{ include "djinn.namespace" . }}
  labels:
    {{- include "djinn.labels" . | nindent 4 }}
spec:
  clusterQueue: {{ $taskQueueName }}
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: {{ $warmQueueName }}
  labels:
    {{- include "djinn.labels" . | nindent 4 }}
    djinn.io/quota-owner: warm-borrow
spec:
  cohort: {{ $cohortName }}
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["pods", "cpu", "memory"]
      flavors:
        - name: {{ printf "%s-kueue" (include "djinn.fullname" .) | trunc 63 | trimSuffix "-" }}
          resources:
            - name: pods
              nominalQuota: 0
              borrowingLimit: 1
            - name: cpu
              nominalQuota: 0
              borrowingLimit: {{ $warmCpuRequest }}
            - name: memory
              nominalQuota: 0
              borrowingLimit: {{ $warmMemoryRequest }}
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: {{ include "djinn.fullname" . }}-warm
  namespace: {{ include "djinn.namespace" . }}
  labels:
    {{- include "djinn.labels" . | nindent 4 }}
spec:
  clusterQueue: {{ $warmQueueName }}
---
{{/*
The left-trim marker is deliberately absent here (`{{/*`, not `{{- /*`). With
it, this comment swallowed the newline after the `---` above and the trailing
`-}}` swallowed the one below it, rendering the literal `---apiVersion:` — not a
document separator. `helm template` re-splits and re-emits documents so its
output looked correct, but `helm lint` parses the rendered file directly and
reported "invalid Yaml document separator". It was invisible while
`kueue.enabled` shipped false, because the whole file rendered to nothing; it
surfaced the moment the topology became a chart default.

SCIP joins Kueue. rust-analyzer indexing is genuinely CPU-heavy — the measured
SCIP phase of a production warm was 3644s — so leaving it outside the quota
would make the ClusterQueue under-count the very load it exists to bound.

Image build deliberately gets NO LocalQueue. It is an upstream dependency of a
task-run, so sharing this ClusterQueue admits a priority-inversion deadlock: a
task-run holds a slot waiting on its project image while that image build is
queued behind it. Adding a `-build` queue here re-introduces that.
*/ -}}
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: {{ $scipQueueName }}
  labels:
    {{- include "djinn.labels" . | nindent 4 }}
    djinn.io/quota-owner: warm-borrow
spec:
  cohort: {{ $cohortName }}
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["pods", "cpu", "memory"]
      flavors:
        - name: {{ printf "%s-kueue" (include "djinn.fullname" .) | trunc 63 | trimSuffix "-" }}
          resources:
            - name: pods
              nominalQuota: 0
              borrowingLimit: 1
            - name: cpu
              nominalQuota: 0
              borrowingLimit: {{ $scipCpuRequest }}
            - name: memory
              nominalQuota: 0
              borrowingLimit: {{ $scipMemoryRequest }}
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: {{ include "djinn.fullname" . }}-scip
  namespace: {{ include "djinn.namespace" . }}
  labels:
    {{- include "djinn.labels" . | nindent 4 }}
spec:
  clusterQueue: {{ $scipQueueName }}
{{- end }}
