{{- if .Values.backingServices.networkPolicy.enabled }}
# Restricts on-demand backing-service Pods (Phase C) so they accept traffic
# ONLY from djinn task-run worker Pods in this namespace — not from arbitrary
# pods or outside the namespace. Gated (default off); enable alongside
# DJINN_BACKING_SERVICES_ENABLED once the feature is validated on the cluster.
#
# NOTE: this is namespace-level isolation (any task-run worker can reach any
# backing service). Strict per-task isolation needs a dynamic policy/controller
# (e.g. kubedock-dns-style) — tracked as a follow-up; safe because each service
# is also ownerRef'd to its task's Job and torn down with it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "djinn.fullname" . }}-backing-services
  namespace: {{ include "djinn.namespace" . }}
  labels:
    {{- include "djinn.server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      djinn.app/component: backing-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              djinn.app/component: task-run-worker
{{- end }}
