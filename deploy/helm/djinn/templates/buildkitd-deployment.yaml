{{- if .Values.imagePipeline.enabled -}}
# Rootless BuildKit daemon. Single shared Deployment — build Jobs dispatched
# by the image controller (PR 5) dial this via DOCKER_HOST/gRPC and drive
# `docker buildx` + `devcontainer build` remotely.
#
# Upstream example we track: moby/buildkit → examples/kubernetes/pod.rootless.yaml.
# Node prerequisites live in deploy/helm/djinn/README.md — kernel.unprivileged_
# userns_clone=1 + user.max_user_namespaces>=28633.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "djinn.fullname" . }}-buildkitd
  namespace: {{ include "djinn.namespace" . }}
  labels:
    {{- include "djinn.labels" . | nindent 4 }}
    app.kubernetes.io/component: buildkitd
spec:
  replicas: 1
  strategy:
    # buildkitd holds an exclusive lock on /home/user/.local/share/buildkit;
    # two rolling replicas would fight over it. Recreate keeps it simple.
    type: Recreate
  selector:
    matchLabels:
      {{- include "djinn.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: buildkitd
  template:
    metadata:
      labels:
        {{- include "djinn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: buildkitd
        djinn.io/capacity-reserved: "true"
      annotations:
        # Protect in-flight builds from Karpenter consolidation eviction. This
        # is a single shared replicas:1 + Recreate daemon, so any eviction (the
        # "Evicted pod: Underutilized" consolidation case) tears down EVERY
        # concurrent build mid-stream — the build Jobs see their gRPC transport
        # close with `GOAWAY graceful_stop` while exporting layers. Voluntary-
        # disruption opt-out only; it can still be drained for a real node
        # failure or a chart rollout. Mirrors server/qdrant.
        karpenter.sh/do-not-disrupt: "true"
        # AppArmor unconfined is required for rootless + user-namespace
        # orchestration. Seccomp Unconfined is the same story — BuildKit's
        # rootless OCI worker uses syscalls blocked by the default profile.
        container.apparmor.security.beta.kubernetes.io/buildkitd: unconfined
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: buildkitd
          image: {{ .Values.imagePipeline.buildkitd.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            # Exposing gRPC on :1234 matches the Service port. --addr is the
            # bind address the daemon listens on; build Jobs connect over TCP.
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            - --addr
            - {{ printf "tcp://0.0.0.0:%d" (.Values.imagePipeline.buildkitd.port | int) | quote }}
            # Rootless: no nested process-sandbox. Upstream-documented flag
            # for this exact K8s rootless mode.
            - --oci-worker-no-process-sandbox
            {{- if .Values.imagePipeline.buildkitd.zotPlaintext }}
            # Plaintext-Zot topologies (local/kind) mount a ConfigMap with
            # a per-registry `http = true` entry; pass it via --config.
            - --config
            - /etc/buildkit/buildkitd.toml
            {{- end }}
          securityContext:
            # Minimum privileges for rootless BuildKit in K8s: unconfined
            # seccomp + AppArmor, runAsUser 1000 (the `user` account baked
            # into the rootless image). NOT runAsNonRoot=false — this IS
            # non-root, just unconfined.
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          {{- $probes := .Values.imagePipeline.buildkitd.probes }}
          # `buildctl debug workers` is a gRPC round-trip to the daemon. A
          # busy buildkitd — e.g. mid-build under a concurrent-rebuild herd —
          # can be slow to answer it even though it's perfectly healthy. With
          # the k8s-default 1s timeoutSeconds + failureThreshold 3, three
          # slow answers in a row had the kubelet kill buildkitd, taking
          # every in-flight build down with `GOAWAY graceful_stop`. The
          # generous timeoutSeconds + failureThreshold below (values-driven)
          # keep a merely-busy daemon alive; the startupProbe gives a cold
          # daemon room to come up before liveness starts counting.
          startupProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            periodSeconds: {{ $probes.periodSeconds }}
            timeoutSeconds: {{ $probes.timeoutSeconds }}
            failureThreshold: {{ $probes.startupFailureThreshold }}
          readinessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: {{ $probes.periodSeconds }}
            timeoutSeconds: {{ $probes.timeoutSeconds }}
            failureThreshold: {{ $probes.failureThreshold }}
          livenessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 30
            periodSeconds: {{ $probes.livenessPeriodSeconds }}
            timeoutSeconds: {{ $probes.timeoutSeconds }}
            failureThreshold: {{ $probes.failureThreshold }}
          ports:
            - name: grpc
              containerPort: {{ .Values.imagePipeline.buildkitd.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.imagePipeline.buildkitd.resources | nindent 12 }}
          volumeMounts:
            # Rootless buildkit writes its OCI worker state under $HOME; since
            # the image uses /home/user, mount an emptyDir there. Build-cache
            # durability lives in Zot (--cache-to=type=registry), not here.
            - name: buildkitd-data
              mountPath: /home/user/.local/share/buildkit
            # Docker auth — credentials for pushing to Zot. Matches the
            # registry-auth-secret.yaml shape (config.json key → ~/.docker/).
            - name: registry-auth
              mountPath: /home/user/.docker/config.json
              subPath: config.json
              readOnly: true
            {{- if .Values.imagePipeline.buildkitd.zotPlaintext }}
            - name: buildkitd-config
              mountPath: /etc/buildkit
              readOnly: true
            {{- end }}
      volumes:
        - name: buildkitd-data
          emptyDir: {}
        {{- if .Values.imagePipeline.buildkitd.zotPlaintext }}
        - name: buildkitd-config
          configMap:
            name: {{ include "djinn.fullname" . }}-buildkitd-config
        {{- end }}
        - name: registry-auth
          secret:
            {{- if .Values.imagePipeline.zot.auth.existingSecret }}
            secretName: {{ .Values.imagePipeline.zot.auth.existingSecret | quote }}
            {{- else }}
            secretName: {{ printf "%s-zot-auth" (include "djinn.fullname" .) | quote }}
            {{- end }}
            items:
              - key: config.json
                path: config.json
            defaultMode: 0444
{{- end -}}
