{{- /*
  Apply pending SQL migrations before the server Deployment rolls.

  Why this exists:
    Migrations run in a dedicated Job rather than on the app pod's boot
    path. The pre-install + pre-upgrade hook with weight -5 fires
    BEFORE the Deployment touches anything, so the migrator has
    exclusive access to the database: no concurrent traffic, no other
    djinn-server pod racing on the same `_sqlx_migrations` advisory
    lock, and no risk of two pods seeing a half-applied schema during
    a rolling upgrade.

    Pulling migrations off the boot path also keeps app-pod startup
    short and predictable, which matters for readinessProbe budgets
    and for the worker pool's reconnect logic.

  How this fixes failure modes:
    `restartPolicy: OnFailure` retries transient connection errors
    inside the Job rather than failing the whole helm rollout.
    `backoffLimit: 3` caps retries so a genuinely broken migration
    surfaces fast instead of churning the Job indefinitely.
    Postgres' deadlock detector kills cycle victims with SQLSTATE 40P01
    immediately, and `djinn_db::retry` covers the migrator's own retry
    needs at the application layer.

  Cleanup:
    `hook-delete-policy: before-hook-creation,hook-succeeded` keeps
    successful runs out of the way (no Job clutter in `kubectl get
    jobs`) while leaving failed runs around for `kubectl logs`-based
    triage. The companion `--migrate-only` flag is also useful as a
    standalone debugging tool: `kubectl run --rm -it djinn-migrate \
    --image=... --command -- djinn-server --migrate-only`.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  # Suffix with the release revision so successive helm upgrades create
  # distinct Job names — the `before-hook-creation` cleanup policy still
  # nukes prior failures, but the unique name keeps `kubectl get jobs`
  # output legible during a rolling release.
  name: {{ include "djinn.fullname" . }}-migrate-{{ .Release.Revision }}
  namespace: {{ include "djinn.namespace" . }}
  labels:
    # Use the chart-wide labels here rather than `djinn.server.labels`
    # so we don't collide on `app.kubernetes.io/component` — this Job
    # is a sibling component to the server Deployment, not a copy of
    # it.
    {{- include "djinn.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # Bail after 10 minutes — far longer than any reasonable migration on
  # a healthy Postgres, short enough that a wedged hook doesn't pin the
  # release indefinitely.
  activeDeadlineSeconds: 600
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "djinn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "djinn.serviceAccountName.controller" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: djinn-migrate
          image: {{ .Values.image.server | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["djinn-server"]
          args: ["--migrate-only"]
          # Env is rendered INLINE from `.Values` rather than imported from
          # the chart's ConfigMap. This is intentional: the Job runs as a
          # `pre-install,pre-upgrade` Helm hook (weight -5), which fires
          # BEFORE the new release's ConfigMap is applied to the cluster.
          # If we used `envFrom: configMapRef`, the Job would read the
          # PRIOR release's ConfigMap — a foot-gun that wedged staging on
          # v0.1.4→v0.1.7 when DJINN_DB_BACKEND was removed. Inline env
          # tracks the release Helm is rolling, not the cluster's last
          # committed state.
          env:
            - name: DJINN_HOME
              value: "/var/lib/djinn"
            - name: RUST_LOG
              value: {{ .Values.env.rustLog | quote }}
            - name: DJINN_VECTOR_BACKEND
              value: "qdrant"
            {{- if include "djinn.databaseUrl.fromSecret" . }}
            - name: DJINN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: url
            {{- else }}
            - name: DJINN_DATABASE_URL
              value: {{ include "djinn.databaseUrl" . | quote }}
            {{- end }}
            # Force-disable the UI bundle path entirely — migrate-only
            # never spins up the HTTP listener, but the flag avoids any
            # filesystem probe for the embedded assets if a future refactor
            # moves UI init earlier in main.
            - name: DJINN_UI_ENABLED
              value: "false"
          resources:
            {{- toYaml .Values.resources.server | nindent 12 }}
