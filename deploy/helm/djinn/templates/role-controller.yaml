apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "djinn.fullname" . }}-controller
  namespace: {{ include "djinn.namespace" . }}
  labels:
    {{- include "djinn.server.labels" . | nindent 4 }}
rules:
  # Task-run dispatch: djinn-server creates a Job + backing Secret per run,
  # watches the Pod, reads logs if needed, and deletes everything on teardown.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # The inert Kueue prerequisite only needs controller observation of the
  # namespaced Workloads it will own after the later cutover.
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads"]
    verbs: ["get", "list", "watch"]
  # Task-run / warm / verification Pod lifecycle (the Pods themselves are
  # created by the Job controller; djinn only watches + cleans them up).
  # Backing services run as native sidecars inside these Pods, so there are no
  # standalone Pods or ClusterIP Services to manage any more.
  # `patch` carries the exact-Pod watchdog's confirmation hold: a service-owned
  # finalizer is added immediately before the UID-fenced DELETE and released
  # after teardown, so an accepted deletion stays durably observable.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  # In-place Pod vertical scaling (`PATCH pods/resize`, k8s >= 1.33) for the CPU
  # quota cutover. djinn-server, holding the controller ServiceAccount, is the
  # ONLY resize actor: the task-run ServiceAccount has no RBAC at all, task-run
  # Pods set `automountServiceAccountToken: false`, and their single projected
  # token carries audience `djinn` rather than the apiserver's — so
  # repository-controlled child code cannot reach this subresource.
  #
  # `patch` alone. The resize subresource accepts PATCH only, so `update` would
  # be dead breadth, and no other verb is meaningful on a subresource that
  # exists solely to mutate a running Pod's resources.
  #
  # Deliberately NAMESPACED, and deliberately without `resourceNames`. RBAC
  # cannot express a set of Pod names that only exists at run time (one per
  # task-run), so exact-Pod authorization is an APPLICATION invariant — the
  # durable permit relation plus a Pod UID fence — not an RBAC one. Task Pods
  # simply hold no resize credential to bypass that with. Do not widen this
  # Role, or promote it cluster-wide, to compensate; tests/pods-resize-rbac.sh
  # fails on either.
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # Per-project environment_config ConfigMap (mounted into warm + task-run
  # Pods) and per-build ConfigMaps carrying the image-builder Dockerfile.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # Read-only on events, useful for surfacing scheduler errors back to the UI.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # The Kueue arming preflight reads THIS namespace back at startup to confirm
  # it really carries `djinn.io/kueue-managed` before any renderer stamps
  # `suspend: true` onto a build Job
  # (server/crates/djinn-k8s/src/kueue_preflight.rs).
  #
  # Namespaces are cluster-scoped, but the apiserver derives the request's
  # namespace attribute from the object name for `GET /api/v1/namespaces/<name>`,
  # so this NAMESPACED rule authorizes reading this namespace and nothing else.
  # Verified against a real apiserver (kind, k8s v1.34): with only this rule, GET
  # of the own namespace returns 200 while GET of another namespace and LIST
  # namespaces both return 403. That is why the preflight needs no ClusterRole,
  # and TokenReview (role-tokenreview.yaml) remains the server's only
  # cluster-wide permission.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
