# Default values for the djinn chart.
#
# One-org-per-deployment. No multi-tenant knobs — all resources land in a
# single namespace and the controller reconciles only that namespace.

# -----------------------------------------------------------------------------
# Images
# -----------------------------------------------------------------------------
image:
  # djinn-server controller image (the long-lived Deployment).
  # Override per-release; `:latest` is only a safe default for demos. Use a
  # pinned tag (e.g. `ghcr.io/djinnos/djinn-server:0.1.0`) for production.
  server: djinn-server:latest
  # djinn-agent-runtime image used by task-run Jobs the controller dispatches.
  # Not referenced by any template in this chart directly — the controller
  # reads it from env and plugs it into the Job PodSpec at dispatch time.
  runtime: djinn-agent-runtime:latest
  pullPolicy: IfNotPresent
  # pullSecrets: []

# -----------------------------------------------------------------------------
# Namespace
# -----------------------------------------------------------------------------
namespace:
  # When true the chart renders a Namespace object. Turn off if you manage the
  # namespace externally (GitOps, Terraform, `kubectl create ns`).
  create: true
  # Namespace the chart's resources land in. Defaults to the Release namespace
  # when empty.
  name: djinn

# -----------------------------------------------------------------------------
# ServiceAccounts
# -----------------------------------------------------------------------------
serviceAccount:
  # SA the djinn-server controller Deployment runs under. Has namespaced RBAC
  # to create + delete Jobs/Pods/Secrets (for task-run dispatch) plus a
  # cluster-scoped binding for TokenReview (for validating worker tokens).
  controller: djinn-controller
  # SA mounted into task-run Job Pods. Has no RBAC — the projected token
  # (audience `djinn`) is presented to djinn-server, which resolves identity
  # via the cluster TokenReview API.
  taskrun: djinn-taskrun
  # Provider-agnostic annotation maps applied to each SA. Operators populate
  # these with whatever their environment needs:
  #   * EKS IRSA       — eks.amazonaws.com/role-arn: arn:aws:iam:...
  #   * GKE Workload
  #     Identity       — iam.gke.io/gcp-service-account: <sa>@<project>.iam.gserviceaccount.com
  #   * AKS Workload
  #     Identity       — azure.workload.identity/client-id: <uuid>
  # The chart stays cloud-neutral; nothing here is rendered when the map is
  # empty (the local-dev install path).
  controllerAnnotations: {}
  taskrunAnnotations: {}

# -----------------------------------------------------------------------------
# Service (for djinn-server)
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  # Worker RPC port — task-run pods dial this to establish the bincode-over-TCP
  # reverse-RPC channel back to djinn-server.
  rpcPort: 8443
  # HTTP API / UI port.
  apiPort: 3000

# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------
resources:
  server:
    requests:
      # CPU requests are the CFS weight under contention. At 250m-500m the
      # server lost enough CPU during compile storms (a full worker fleet
      # linking at once) to fail its readiness probe — transient 521s observed
      # in production. Pin the request to 1 full core so the long-lived
      # controller keeps a guaranteed share while task-run pods burst.
      cpu: "1"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  # Resource sizing the controller stamps onto the task-run Job PodSpecs it
  # dispatches. These size the EPHEMERAL worker Pods djinn-server spawns, NOT
  # the long-lived server Deployment above (that's `resources.server`). They
  # reach the running server as the DJINN_K8S_CPU/MEMORY_{REQUEST,LIMIT} env
  # vars emitted by templates/deployment-server.yaml, and the k8s runtime
  # stamps them onto every task-run Pod it creates.
  #
  # Rationale for low requests / high limits (proven on a single 12-CPU/47Gi
  # VPS node running several concurrent workers): keep requests small so many
  # Pods schedule onto one node, and set limits high so a cargo build/link
  # burst can spike into the node's idle headroom. Workers idle-wait on the
  # LLM most of the time, so their steady-state footprint sits far below the
  # limit — over-committing the node is safe and lets more work run in
  # parallel.
  taskrun:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      # CARGO_BUILD_JOBS / NEXTEST_TEST_THREADS derive from this CPU limit
      # (PR #1896), so it bounds per-pod compile parallelism. At limit 6 a full
      # fleet of 8 workers compiling simultaneously drove load 55-68 on 12
      # cores and starved the readiness probes; at limit 4 the plateau is ~39,
      # which the node tolerates. Keep memory high — a cargo link burst still
      # needs the headroom.
      cpu: "4"
      memory: "22Gi"
    # Pod scheduling for both task-run and warm Jobs. Warm Pods pre-warm the
    # graph cache that task-runs later adopt, so they MUST land on the same
    # NodePool — that's why one set of hints covers both.
    #
    # Typical use case: a dedicated Karpenter NodePool tainted
    # `workload-type=djinn:NoSchedule` and labelled `workload-type=djinn`.
    # Set nodeSelector to target it and add the matching toleration:
    #
    #   nodeSelector:
    #     workload-type: djinn
    #   tolerations:
    #     - key: workload-type
    #       operator: Equal
    #       value: djinn
    #       effect: NoSchedule
    #
    # Empty defaults leave the fields unset — any node that the Pod's other
    # constraints allow is eligible (preserves the pre-feature behavior).
    nodeSelector: {}
    tolerations: []
  # Resource sizing for graph-warm Jobs — the short-lived Pods that populate
  # the canonical graph cache a later task-run adopts. These reach the running
  # server as the DJINN_K8S_WARM_* env vars emitted by
  # templates/deployment-server.yaml and are stamped onto every warm Pod.
  #
  # Same low-request / high-limit rationale as `taskrun` above: SCIP indexer
  # subprocesses (rust-analyzer, scip-go, ...) spike CPU/memory during a warm
  # pass but idle otherwise, so a small request packs Pods onto a node while a
  # high limit lets a burst use the idle headroom. Warm Jobs run in the
  # background and don't gate worker latency, so over-committing is safe.
  warm:
    requests:
      cpu: "2"
      memory: "2Gi"
    limits:
      # Same per-pod compile-parallelism bound as `taskrun` above: warm passes
      # compile the workspace too, and CARGO_BUILD_JOBS / NEXTEST_TEST_THREADS
      # derive from this limit (PR #1896). Limit 4 keeps a warm-plus-worker
      # fleet under the ~39 plateau the 12-core node tolerates instead of the
      # 55-68 spike seen at limit 6.
      cpu: "4"
      memory: "16Gi"
    # Max wall-clock seconds a warm Job may run before the kubelet terminates
    # it (activeDeadlineSeconds), surfaced as DJINN_K8S_WARM_JOB_TIMEOUT_SECONDS.
    # 3600s (60 min) covers a cold single-pass warm of a ~12-crate workspace
    # (~20-25 min observed) with ample margin. Raise it if a larger workspace
    # consistently hits the deadline.
    jobTimeoutSeconds: 3600

# -----------------------------------------------------------------------------
# Storage
# -----------------------------------------------------------------------------
# RWX is required for the mirrors PVC on multi-node clusters — the controller
# writes mirror clones and task-run Job Pods read from them. The cache PVC is
# similarly RWX so cargo/pnpm/pip caches survive across task runs.
storage:
  # Mirrors are shared between the server (writer) and image-build + task-run
  # Jobs (readers). In prod this requires RWX storage; on single-node clusters
  # like kind, RWO PVCs work because RWO is enforced per-node, not per-pod.
  mirrors:
    size: 50Gi
    storageClassName: ""   # "" → use cluster default. Must satisfy RWX on multi-node.
    accessMode: ReadWriteMany
    # Set to reuse a pre-existing PVC instead of rendering one from this chart.
    existingClaim: ""
  cache:
    size: 20Gi
    storageClassName: ""
    accessMode: ReadWriteMany
    existingClaim: ""
  # Reference working clones populated by `project_add_from_github`. Mounted
  # at /var/lib/djinn/projects and referenced by project.path in the
  # database, so it must survive pod restarts. RWX is required on multi-node
  # clusters: the surge rollout (maxSurge=1) briefly runs two server pods that
  # both mount this PVC and may land on different nodes. Only the leader pod
  # writes it; the standby pod reads, and the overlap is bounded to a deploy
  # window. On single-node clusters (kind, values.local.yaml) RWO still works
  # because RWO is enforced per-node, not per-pod.
  # NOTE: accessMode is immutable on an existing PVC — a projects PVC
  # previously provisioned as RWO must be recreated/migrated to take RWX.
  projects:
    size: 20Gi
    storageClassName: ""
    accessMode: ReadWriteMany
    existingClaim: ""

# -----------------------------------------------------------------------------
# Secrets
# -----------------------------------------------------------------------------
secrets:
  githubApp:
    # If non-empty, the Deployment mounts the named Secret instead of a
    # chart-rendered one. The Secret must expose the same keys listed below.
    existingSecret: ""
    # Literal values — rendered into a chart-managed Secret when
    # existingSecret is empty. Leave blank in VCS; set via `--set` or
    # a local -f overrides file.
    appId: ""
    privateKey: ""
    clientId: ""
    clientSecret: ""
  vaultKey:
    existingSecret: ""
    # Base64-encoded 32-byte AES key used by djinn-db's credential vault.
    # When empty, the chart self-provisions: on first install it generates a
    # fresh 32-byte key via Sprig `randBytes`, and on subsequent `helm upgrade`
    # runs it looks up and preserves the existing Secret's value so data
    # already encrypted under that key stays decryptable. Set this to pin a
    # specific key (e.g. to share across environments or restore from backup).
    key: ""
  # Provider API keys bootstrapped into the encrypted credential vault at
  # server startup. Each non-empty value lands as an env var on the djinn-
  # server pod (keyed by the builtin provider's `required_env_vars`). The
  # server's `bootstrap_env_credentials` pass upserts them into the vault
  # so dispatch-time lookups resolve without any UI interaction.
  #
  # Leave everything blank to rely on ChatGPT / Codex sign-in through the
  # SPA (device-code flow) — that path doesn't use any of these fields.
  providers:
    # If set, mount this pre-existing Secret instead of chart-rendering one.
    # The Secret must expose the same keys listed below (ANTHROPIC_API_KEY,
    # OPENAI_API_KEY, …).
    existingSecret: ""
    anthropicApiKey: ""
    openaiApiKey: ""
    googleApiKey: ""
    azureOpenaiApiKey: ""
    awsAccessKeyId: ""
    awsSecretAccessKey: ""
    gcpVertexProjectId: ""

# -----------------------------------------------------------------------------
# Langfuse (LLM observability) — OTLP export from djinn-server
# -----------------------------------------------------------------------------
# djinn-server initialises OpenTelemetry only when both public + secret keys
# are set. Leave blank to disable. The chart renders a Secret with
# DJINN_LANGFUSE_{PUBLIC,SECRET}_KEY and injects it via envFrom.
langfuse:
  enabled: false
  # OTLP endpoint. For self-hosted Langfuse this is
  # http://<langfuse-web-svc>:3000/api/public/otel.
  endpoint: ""
  # Langfuse project keys (pk-lf-... / sk-lf-...). When existingSecret is
  # non-empty, the chart mounts that instead of rendering one; the Secret
  # must carry DJINN_LANGFUSE_PUBLIC_KEY + DJINN_LANGFUSE_SECRET_KEY.
  publicKey: ""
  secretKey: ""
  existingSecret: ""

# -----------------------------------------------------------------------------
# Ingress (opt-in)
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  host: ""
  # Extra annotations (e.g. cert-manager issuer).
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# -----------------------------------------------------------------------------
# Postgres 16 (bundled SQL state)
# -----------------------------------------------------------------------------
# Stock upstream `postgres:16` running as a single-replica StatefulSet. The
# server speaks plain Postgres protocol via sqlx; deadlock detection is
# reliable (SQLSTATE 40P01) and JSONB columns avoid the LONGTEXT-string
# round-trips MySQL forced on us.
#
# For staging / prod, set `postgres.enabled: false` and provide
# `database.externalUrl` or `database.existingSecret` below — the
# StatefulSet + Service won't render and the server dials your RDS
# endpoint instead.
postgres:
  # Set to false to use an external Postgres (RDS, Cloud SQL, etc.).
  # Mutually exclusive with database.externalUrl / database.existingSecret —
  # the chart will render the bundled StatefulSet only when enabled is true.
  enabled: true
  image: postgres:16
  auth:
    # Password for the bundled `djinn` Postgres user. Empty string falls
    # back to a chart-default ("djinn-local-dev") suitable ONLY for
    # kind / local-dev. Set a real password for any cluster reachable
    # outside the namespace.
    password: ""
  # Service name + port exposed inside the cluster. Consumed by djinn-server
  # via the DJINN_DATABASE_URL env computed in configmap.yaml.
  service:
    port: 5432
  storage:
    size: 20Gi
    accessMode: ReadWriteOnce
    storageClassName: ""
  # Surfaced as `-c key=value` args on the postgres process. shared_buffers
  # at 2G matches the prior MySQL footprint; max_connections=200 leaves
  # headroom over the server's pool (100) + migrate initContainer (1) +
  # worker pool (<=16) + ad-hoc tooling.
  config:
    sharedBuffers: 2GB
    maxConnections: 200
  resources:
    requests:
      # CPU request is the CFS weight under contention. At 500m the bundled
      # Postgres lost CPU during compile storms and pg_isready probes timed
      # out; pin to 1 full core so SQL stays responsive while task-run pods
      # burst. Keep limits as-is.
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

# -----------------------------------------------------------------------------
# Database connection (external override)
# -----------------------------------------------------------------------------
# When `postgres.enabled: false`, the server needs to know how to reach the
# external Postgres. Two mutually-exclusive ways to specify it:
#
#   1. externalUrl: literal URL string (rendered into the chart ConfigMap).
#      Convenient for staging but bakes the password into the rendered
#      Helm release. Format:
#        postgres://user:password@host:5432/dbname?sslmode=require
#
#   2. existingSecret: name of an existing Kubernetes Secret with a `url`
#      key holding the full Postgres URL. The Deployment's app + migrate
#      containers pull DJINN_DATABASE_URL via `valueFrom: secretKeyRef`, so
#      the URL never lands in a ConfigMap or in `helm get values` output. Preferred
#      for RDS credentials (typically provisioned out-of-band in a vault).
#
# Set exactly one. When `postgres.enabled: true`, both should be empty.
database:
  externalUrl: ""
  existingSecret: ""

# -----------------------------------------------------------------------------
# Qdrant (bundled vector store)
# -----------------------------------------------------------------------------
qdrant:
  enabled: true
  image: qdrant/qdrant:latest
  service:
    httpPort: 6333
    grpcPort: 6334
  storage:
    size: 10Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

# -----------------------------------------------------------------------------
# Server env
# -----------------------------------------------------------------------------
env:
  rustLog: "info,djinn=debug"
  # Public base URL (used for GitHub App callback + browser redirects). When
  # empty the Deployment omits the env var and djinn-server falls back to its
  # own default (`http://127.0.0.1:3000`, appropriate only for local dev).
  publicUrl: ""
  webUrl: ""
  # When true, djinn-server exposes a token-gated GitHub App manifest setup
  # flow (setup routes, /auth/config hints, /setup/status). When false (the
  # production default), setup routes are hidden and the server continues to
  # load GitHub App credentials from the mounted Secret only. This flag is
  # rendered into the server ConfigMap as DJINN_ENABLE_SELF_SETUP.
  enableSelfSetup: false

# Arbitrary extra env injected into the server container. Useful for ad-hoc
# tuning knobs without re-templating.
extraEnv: []
# - name: FOO
#   value: bar

# Extra `envFrom` sources merged into the server container after the
# chart-rendered ConfigMap. Useful when an out-of-band sync (Doppler
# operator, External Secrets Operator, Vault Agent Injector, ...) lands a
# fat env-bag Secret in the namespace that you'd rather mount whole than
# wire as N individual `extraEnv` entries via `valueFrom.secretKeyRef`.
# Each entry is a standard core/v1 EnvFromSource (configMapRef / secretRef).
extraEnvFrom: []
# - secretRef:
#     name: djinn-env
# - configMapRef:
#     name: extra-config

# Node placement (applied to djinn-server Deployment).
nodeSelector: {}
tolerations: []
affinity: {}

# Labels merged onto every chart-managed resource.
labels: {}

# -----------------------------------------------------------------------------
# Image pipeline (Phase 3): BuildKit daemon + Zot registry + image controller
# -----------------------------------------------------------------------------
# Per-project devcontainer images are built by a reconciling image-controller
# that drives `devcontainer build` in a Job against a shared rootless BuildKit
# daemon and pushes the result to an in-cluster Zot registry. Kubernetes Jobs
# for task runs pull from Zot at dispatch time.
#
# Node prerequisites for rootless BuildKit (see README.md):
#   sysctl kernel.unprivileged_userns_clone=1
#   sysctl user.max_user_namespaces=28633   # or higher
imagePipeline:
  enabled: true
  # Host:port where the controller + buildkitd push/pull per-project images.
  # Leave empty to derive from the Release name and namespace
  # (`<release>-zot.<ns>.svc.cluster.local:<zot.port>`). Set this to an
  # external registry (ECR, GHCR, a TLS-fronted Zot) to bypass the in-cluster
  # Zot Service entirely.
  registryHost: ""
  # tcp:// endpoint of the BuildKit daemon. Leave empty to derive from the
  # Release name and namespace (`tcp://<release>-buildkitd.<ns>.svc.cluster.local:<buildkitd.port>`).
  # Set to an external buildkitd to bypass the in-cluster daemon.
  buildkitdHost: ""
  # Pinned reference to the djinn-agent-worker devcontainer Feature. Consumed
  # by generated `.devcontainer/devcontainer.json` starter files (PR 6) and
  # by PR 5's build Job env.
  featureRef: "ghcr.io/djinnos/djinn-agent-worker:1"
  buildkitd:
    # djinn-buildkitd = moby/buildkit:rootless + ECR/GCR/ACR credential
    # helpers baked in (see server/docker/djinn-buildkitd.Dockerfile).
    # Override to plain moby/buildkit:rootless for the no-credHelpers path.
    image: ghcr.io/djinnos/djinn-buildkitd:latest
    # gRPC port exposed on the buildkitd Service. Consumed by the build Job
    # via DOCKER_HOST=tcp://<svc>:<port>.
    port: 1234
    # When Zot is served plaintext (local/kind), buildkitd needs a
    # per-registry `http = true` entry so its push step doesn't negotiate
    # TLS. Set to `false` in environments where Zot is fronted with TLS
    # (Ingress + cert-manager / ACM / etc.) or where the target registry
    # is a managed HTTPS service (ECR, GHCR). Changing this toggles the
    # `buildkitd-config` ConfigMap + mount on/off.
    zotPlaintext: false
    # Per-registry credential-helper map rendered into the docker config.json
    # that buildkitd mounts at /home/user/.docker/config.json. Format:
    #   <registry-host>: <helper-binary-suffix>
    # e.g.
    #   "981534455912.dkr.ecr.us-east-1.amazonaws.com": ecr-login
    #   "us-east1-docker.pkg.dev":                       gcr
    #   "myacr.azurecr.io":                              acr-env
    # When non-empty, the chart-rendered config.json carries credHelpers
    # instead of the inline Zot username/password. The helper binaries live
    # in the djinn-buildkitd image; cloud identity (IRSA, Workload Identity,
    # etc.) flows in via the SA annotations above.
    credHelpers: {}
    # Health-probe tuning for the single shared buildkitd. The probe is a
    # `buildctl debug workers` gRPC round-trip; a busy daemon (e.g. mid-build
    # under a concurrent-rebuild herd) can be slow to answer it even while
    # perfectly healthy. The k8s defaults (timeoutSeconds 1, failureThreshold
    # 3) once had the kubelet liveness-kill a merely-busy buildkitd, dropping
    # every in-flight build with `GOAWAY graceful_stop`. These generous
    # defaults stop that; tune per cluster if needed.
    probes:
      # Seconds the kubelet waits for `buildctl debug workers` to answer
      # before counting the probe as failed. Default k8s is 1s — far too
      # tight for a loaded daemon.
      timeoutSeconds: 10
      # Consecutive readiness/liveness failures tolerated before the pod is
      # marked unready / restarted. Default k8s is 3.
      failureThreshold: 6
      # How often readiness + startup probes run.
      periodSeconds: 30
      # Liveness probes less aggressively than readiness so transient load
      # spikes pull the pod out of the Service (readiness) long before they
      # can trigger a restart (liveness).
      livenessPeriodSeconds: 60
      # Startup probe failures tolerated before liveness takes over. With
      # periodSeconds 30 this is a generous ~10min window for a cold daemon
      # (warming the OCI worker, restoring cache) to come up.
      startupFailureThreshold: 20
    # buildkitd is the single shared build engine; a concurrent-build herd
    # is CPU- and memory-hungry. These defaults are sized to survive a burst
    # without the kubelet OOM/CPU-starving the daemon into a probe-kill loop.
    # The image controller's maxConcurrentBuilds cap keeps the herd bounded.
    resources:
      requests:
        cpu: "2"
        memory: "2Gi"
      limits:
        cpu: "6"
        memory: "10Gi"
  zot:
    # In-cluster Zot OCI registry. Off by default — most cloud deployments
    # use a managed registry (ECR/GCR/ACR) via `buildkitd.credHelpers`.
    # Flip to true for local/kind/air-gapped installs.
    enabled: false
    image: ghcr.io/project-zot/zot-linux-amd64:v2.1.0
    # HTTP port exposed on the Zot Service. v1 OCI distribution spec.
    port: 5000
    # Allow anonymous pulls (no auth challenge) for in-cluster image
    # pulls. Writes still require htpasswd credentials. Useful when
    # kubelet pulls per-project devcontainer images built by the image
    # pipeline — avoids wiring pull-secrets onto every Job Pod Spec.
    # Leave false in environments where image confidentiality matters.
    anonymousPull: false
    storage:
      size: 100Gi
      storageClassName: ""   # "" → cluster default
      accessMode: ReadWriteOnce
      existingClaim: ""
    auth:
      # When non-empty, the chart mounts this pre-existing Secret instead of
      # rendering one from the inline values. Secret must carry both
      # `htpasswd` (bcrypt'd user:pass) and `config.json` (docker auth config).
      existingSecret: ""
      # Default credentials used by buildkitd + image-controller to push/pull.
      # Overridden via --set or a secrets-only values file at install time.
      username: "djinn"
      password: "djinn"
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
  controller:
    # PR 5 replaces this with the real image-controller binary. Until then the
    # Deployment renders as a busybox sleep stub so the rest of the chart can
    # be installed + iterated on.
    image: "busybox:1.36"
    # Cluster-wide cap on concurrent project-image build Jobs, wired to the
    # server via DJINN_IMAGE_MAX_CONCURRENT. The image controller counts
    # live build Jobs each reconcile pass and defers new builds once this
    # many are in flight, so a mass rebuild can't starve the single shared
    # buildkitd into a liveness-probe-kill crash loop. Deferred projects are
    # re-evaluated on later reconcile ticks as slots free. Keep this low
    # relative to buildkitd's CPU limit.
    maxConcurrentBuilds: 4
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  # Builder image (Node + docker CLI + buildx + @devcontainers/cli) baked by
  # server/docker/djinn-image-builder.Dockerfile. Pinned here for PR 5 build
  # Jobs; no template in this chart references it directly — the controller
  # reads it from env and plugs it into the Job PodSpec at dispatch time.
  builderImage: "ghcr.io/djinnos/djinn-image-builder:latest"
