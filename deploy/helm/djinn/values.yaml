# Default values for the djinn chart.
#
# One-org-per-deployment. No multi-tenant knobs — all resources land in a
# single namespace and the controller reconciles only that namespace.

# -----------------------------------------------------------------------------
# Images
# -----------------------------------------------------------------------------
image:
  # djinn-server controller image (the long-lived Deployment).
  # Override per-release; `:latest` is only a safe default for demos. Use a
  # pinned tag (e.g. `ghcr.io/djinnos/djinn-server:0.1.0`) for production.
  server: djinn-server:latest
  # djinn-agent-runtime image used by task-run Jobs the controller dispatches.
  # Not referenced by any template in this chart directly — the controller
  # reads it from env and plugs it into the Job PodSpec at dispatch time.
  runtime: djinn-agent-runtime:latest
  pullPolicy: IfNotPresent
  # pullSecrets: []

# -----------------------------------------------------------------------------
# Cache cleanup
# -----------------------------------------------------------------------------
# The chart is the production activation surface. Local development explicitly
# overrides this destructive mode in values.local.yaml.
cacheCleanup:
  mode: delete

# -----------------------------------------------------------------------------
# Graph generation retention
# -----------------------------------------------------------------------------
# Begin in dry-run mode to observe candidates and retention metrics before an
# operator explicitly enables delete. `historyN` retains the newest N published
# generations in addition to the current generation.
graphRetention:
  mode: dry_run
  historyN: 3

# -----------------------------------------------------------------------------
# SCIP indexer cache retention
# -----------------------------------------------------------------------------
# Bounds the content-addressed SCIP index cache on the shared `/cache` PVC
# (`$XDG_CACHE_HOME/djinn/scip-indexer`). Every warm mints a new entry for each
# workspace whose sources changed, and nothing used to remove one: the tree on
# the production cluster reached 4.5 GiB across 40 entries, of which 33 had
# never been read back.
#
# These are TUNING ONLY. The binary carries the same two defaults, so a
# deployment that never sets them — an older chart, a raw manifest, a local
# `cargo run` — still gets a bounded cache. Removing this block does not
# unbound anything.
#
# Eviction is least-recently-USED (newest of atime/mtime), so entries that keep
# producing cache hits keep surviving; entries written once and never read back
# are exactly what gets reclaimed. An entry another pod is publishing into or
# has touched in the last 30 minutes is never a candidate.
#
# Set either value to 0 to disable that bound. Nothing else does.
scipCache:
  # Total-size ceiling for the cache tree, in bytes. Default 4 GiB ≈ 25 warm
  # generations of the largest project measured on the cluster (~165 MiB per
  # generation across all its workspaces), comfortably above the longest reuse
  # distance observed there (26 h) and ~5% of the shared cache claim.
  maxBytes: 4294967296
  # Evict entries unused for longer than this. The size cap binds first on a
  # busy project; this leg bounds a project warmed too rarely to ever hit it.
  maxIdleHours: 168

# -----------------------------------------------------------------------------
# Standalone SCIP-index Job
# -----------------------------------------------------------------------------
# PR #2697 split the semantic (SCIP) index out of the graph-warm Job into its
# own Job so a warm would find the index already computed and only warm the
# cargo/build cache. `enabled` below is the ONLY thing that decides whether that
# Job is ever created (`djinn_k8s::scip_schedule::ScipIndexScheduler::enabled`,
# read per tick from `DJINN_K8S_SCIP_INDEX_ENABLED`, default false).
#
# Until this block existed the chart rendered NO env var for it, so the switch
# had no operator surface at all: the split shipped, stayed green, and never
# ran once in production. Every warm therefore paid the full inline index —
# measured 2026-07-27 at 3644s of a 5442s warm, i.e. 67% of the warm's wall
# clock was the phase the split exists to remove. The chart even renders a
# `<fullname>-scip` LocalQueue (templates/kueue-topology.yaml) to admit Jobs
# that nothing could create.
#
# Armed by default. The switch costs an additional Pod sized by
# `resources.scip` — a 16Gi memory limit against a measured ~10 GB peak — and
# buys back the 67% of every warm that the inline index costs. Read the cadence
# gates in `djinn_k8s::scip_schedule::decide` before disarming it: the Job is
# additionally skipped while a warm Job is in flight and while the head has not
# stood still for `quiescenceSeconds`, so on a repository that merges more often
# than it indexes it already declines to run.
scipIndex:
  # Master arming switch. The BINARY still defaults this off
  # (`KubernetesConfig::for_testing`), so this chart is the only thing that
  # arms it — see `djinn_k8s::config::FAIL_CLOSED_ARMING_SWITCHES`, whose
  # chart-render obligation `tests/scip-index-arming-render.sh` enforces in
  # both directions (a surface must exist, and it must ship armed).
  enabled: true
  # Cadence floor between dispatches, in seconds. Default 3h.
  intervalSeconds: 10800
  # How long the repository head must have stood still before an index is worth
  # producing, in seconds. Default 3523 — the measured SCIP phase cost. The
  # cache key folds in source hashes, so an index produced at a head that then
  # moves serves nobody. 0 disables the gate.
  quiescenceSeconds: 3523
  # How long a warm Pod waits for another Pod's in-flight index of the same
  # tree before indexing inline itself, in seconds. Projected onto every warm
  # Pod as DJINN_SCIP_CLAIM_WAIT_SECONDS. 0 disables waiting.
  claimWaitSeconds: 900

# -----------------------------------------------------------------------------
# Kueue build admission
# -----------------------------------------------------------------------------
# The pods quota Kueue admits build Jobs against. This is the ONLY remaining
# build-concurrency bound — the in-process pods-quota reservation authority was
# deleted in #2822 — so both flags below ship armed and an install that turns
# them off has no bound on concurrent build Pods at all.
kueue:
  # Render the ResourceFlavor / ClusterQueue / LocalQueue topology.
  #
  # ON by default: Kueue's pods quota is the only remaining build-concurrency
  # bound (the in-process pods-quota reservation authority was deleted in
  # #2822), so a stock install that omitted the topology would dispatch
  # unbounded build Pods.
  #
  # `djinn-prereqs` IS THEREFORE A PREREQUISITE, NOT AN OPTION. The topology is
  # `kueue.x-k8s.io/v1beta1`, and a cluster without Kueue rejects those objects.
  # Install the prerequisite release first (`deploy/helm/djinn-prereqs`, see
  # deploy/kueue/README.md and docs/deploy/kubernetes.md). The Kueue controller
  # must be READY, not merely installed: ClusterQueue and LocalQueue carry a
  # conversion webhook, so applying even a v1beta1 object needs the webhook
  # service serving. Install the prerequisite with `--wait`.
  #
  # A cluster without it fails at INSTALL, by name: templates/prereq-guard.yaml
  # checks `kueue.x-k8s.io/v1beta1` against live API discovery and stops the
  # release with the prerequisite's path in the message, rather than letting the
  # API server answer "no matches for kind ResourceFlavor" with no remedy.
  #
  # This stays an explicit value rather than a `.Capabilities.APIVersions` probe
  # that decides what to render: capability probing is empty under `helm
  # template` (what Tilt uses), so a probe would silently omit the topology in
  # local dev and silently include it in a live install — two manifests from one
  # chart. The guard uses discovery only to REFUSE, never to render less.
  #
  # Enabling it does NOT arm anything: no Job carries a queue name and no
  # namespace is Kueue-managed. Arming is the separate `armed` flag below.
  #
  # Set both this and `armed` false for a cluster that will never run Kueue
  # (see values.local.yaml, the kind/local-dev profile).
  enabled: true
  # The finite admission vector. These are Kubernetes quantities rather than
  # inferred from one binding resource: every admitted build Pod consumes cpu,
  # memory, and one pod from the declared ceiling.
  buildCpu: "12"
  buildMemory: "48Gi"
  buildPods: 3
  # Runtime-derived capacity controller inputs. `source` selects where the
  # controller observes the vector; `staticFallback` is the finite fail-closed
  # vector available to static and dedicated-NodePool deployments.
  capacity:
    enabled: false
    source: node-sum
    queueName: ""
    nodeSelector:
      key: ""
      value: ""
    headroom:
      cpu: "750m"
      memory: "1Gi"
      pods: 0
    staticFallback:
      cpu: "12"
      memory: "48Gi"
      pods: 3
    nodePool:
      # `nodepool-limits` is valid only for an explicitly dedicated pool. Helm
      # enforces this assertion and a non-empty name in values.schema.json.
      dedicated: false
      name: ""

  # Arm Kueue admission for build Jobs (cutover epic 4c9q, slice S1).
  #
  # ON by default. `enabled` alone renders queues nothing is admitted into; the
  # quota only binds once the renderers hand their Jobs to Kueue, which is what
  # this flag does. A stock install therefore ships the bound, not the scaffold.
  #
  # This single value drives BOTH halves of the capture contract, and they can
  # never be split onto separate flags:
  #   1. the `djinn.io/kueue-managed` label on the Namespace
  #      (templates/namespace.yaml) — Kueue captures Jobs ONLY in a namespace
  #      carrying it;
  #   2. `DJINN_KUEUE_ARMED` on djinn-server, which makes the task-run, warm and
  #      standalone-SCIP renderers create their Jobs `suspend: true` with a
  #      `kueue.x-k8s.io/queue-name` label.
  #
  # `suspend: true` is NOT inert. A suspended Job in an UNLABELLED namespace is
  # never captured, so nothing ever unsuspends it and every build Job hangs
  # forever. That is why both halves hang off this one value.
  #
  # INVARIANT: armed implies enabled. `armed: true` with `enabled: false` fails
  # the render — arming with no ClusterQueue to admit into is the same hang.
  #
  # INVARIANT: armed requires a namespace this chart can label. With
  # `namespace.create: false` the chart renders no Namespace object and
  # therefore CANNOT apply `djinn.io/kueue-managed`, so that combination fails
  # the render unless you acknowledge you have labelled it yourself — see
  # `namespaceLabelledExternally` below.
  #
  # Image builds stay deliberately unarmed at every value of this flag: an image
  # build is an upstream dependency of a task-run, so sharing one ClusterQueue
  # creates a priority-inversion deadlock.
  armed: true

  # Operator acknowledgement that an EXTERNALLY MANAGED namespace already
  # carries `djinn.io/kueue-managed=true`.
  #
  # Only consulted when `armed: true` AND `namespace.create: false`. In that
  # combination the chart renders no Namespace object, so it cannot apply the
  # label Kueue requires in order to capture anything — while still setting
  # `DJINN_KUEUE_ARMED`, which makes every task-run, warm and standalone-SCIP
  # Job render `suspend: true`. Nothing captures those Jobs, so nothing
  # unsuspends them, and every build hangs forever. The chart therefore REFUSES
  # that combination outright unless you set this true.
  #
  # Before setting it:
  #     kubectl label namespace <ns> djinn.io/kueue-managed=true
  #
  # This value is an unverified CLAIM at render time — Helm cannot see cluster
  # state. The claim is checked for real at djinn-server startup: the server
  # GETs its own namespace and, when the label is absent, DISARMS itself and
  # logs the reason rather than rendering Jobs that would hang (see
  # `server/crates/djinn-k8s/src/kueue_preflight.rs`). This flag buys you an
  # install; it does not buy you capture.
  #
  # Leave false when `namespace.create: true` — the chart applies the label
  # itself and the acknowledgement is inert.
  namespaceLabelledExternally: false

# -----------------------------------------------------------------------------
# Per-invocation CPU lease (cgroup launcher)
# -----------------------------------------------------------------------------
# The throughput semaphore. This bounds how much CPU each task-run gets while it
# is building, per invocation rather than per pod.
#
# Why per-invocation: a static pod cap strands capacity. A worker holds its slot
# through LLM streaming while compiling nothing, planners never compile at all,
# and different repositories compile at very different speeds. With the launcher
# armed, every shell command starts in its own cgroup leaf throttled to 250m and
# is lifted to the pod's full CPU limit only once it demonstrates it is actually
# CPU-hungry.
#
#   required  (default) — render the cgroup-launcher sidecar. The launcher
#                         establishes its own delegated cgroup v2 root at
#                         startup, which needs `SYS_ADMIN` plus an AppArmor
#                         opt-out for the duration of that bootstrap; it drops
#                         the capability irreversibly out of its bounding set
#                         before the broker accepts any work, which is the only
#                         layer under it and is verified at runtime.
#   disabled            — explicit local/development compatibility: no sidecar,
#                         cgroup leaf, or lease; shell commands run in-process
#                         at the pod's own quota.
#
# Requires a cgroup-v2 node whose kubelet offers the `cpu` controller to
# container cgroups. The launcher container is rendered with
# `appArmorProfile: Unconfined`, because the container runtime's default
# AppArmor profile carries a flat `deny mount,` and denies the launcher's
# `mount(2)` with EACCES even though CAP_SYS_ADMIN is held — that is what took
# v0.7.5 down on its first armed task pod. The opt-out is scoped to that one
# container; seccomp stays RuntimeDefault, and the pod is deliberately NOT
# user-namespaced (`hostUsers: false` leaves the launcher's own cgroup owned by
# an unmapped uid, which breaks the delegation one step after the mount).
#
# Every precondition fails CLOSED: an unusable render is refused at dispatch
# before a Job is submitted, and a launcher that cannot establish its delegation
# exits non-zero before binding its socket.
#
# WHY THE DEFAULT IS `required`, AND WHAT IT DEMANDS OF YOUR NODES
# ----------------------------------------------------------------
# An armed launcher is only half of a pair. `validate_enforcement_render`
# refuses to dispatch when `cgroupLauncher.mode: required` is paired with
# `cgroupWritable.taskRuns.enabled: false`, and that pairing was this file's
# default through v0.7.25: a fresh `helm install` with stock values could not
# dispatch a single task on any node, and production went down for exactly that
# reason on 2026-07-29. The two knobs must move together or not at all, so the
# stock profile arms BOTH:
#
#   cgroupLauncher:  { mode: required }
#   cgroupWritable:  { runtimeClass: { enabled: true }, taskRuns: { enabled: true } }
#
# That pairing is checked at render time — `templates/deployment-server.yaml`
# refuses the incoherent halves by name — but the NODE half cannot be. The
# task-run RuntimeClass carries `scheduling.nodeSelector:
# djinn.io/cgroup-writable=true`, so on a cluster whose nodes have not passed
# `deploy/node/k3s/djinn-cgroup-writable-conformance.sh` and been labelled,
# every task-run Pod is simply unschedulable — a slower failure than the 07-29
# outage but a failure all the same, and a silent one.
#
# `templates/prereq-guard.yaml` is what makes it loud: on a real install or
# upgrade it lists the cluster's Nodes and refuses the release, naming the
# label, the conformance script and the RuntimeClass, instead of installing
# "successfully" onto a cluster that can never run a task. It is inert under
# `helm template` (Helm's `lookup` returns nothing there), which is why the
# render-only gate below still answers the render-shaped question.
#
# `deploy/preflight/render-gate.sh` runs the real dispatch validator against a
# real render; run it against the values you are about to deploy before you
# deploy them. It is deliberately NOT a cluster check — the node prerequisites
# are the prereq guard's and the conformance script's business, not its.
#
# For a cluster that will never have prepared nodes (kind, a laptop, a
# direct-worker profile), disable the complete stack explicitly — see
# values.local.yaml, which does exactly that.
cgroupLauncher:
  # Armed by default: a production render must include the quota mechanism
  # required by resize-v2 rather than silently dispatching ungoverned work.
  mode: required

# -----------------------------------------------------------------------------
# Writable cgroup preparation rollout
# -----------------------------------------------------------------------------
# The preparation release can create the cluster-scoped RuntimeClass used by the
# kubelet-delegated writable cgroup rollout after nodes have passed the
# corresponding conformance check and are labeled
# `djinn.io/cgroup-writable=true`.
#
# The stock profile renders and assigns the writable RuntimeClass because the
# armed launcher depends on it. Operators may explicitly disable the complete
# stack for local/direct-worker profiles.
#
# `taskRuns.enabled` is also the other half of `cgroupLauncher.mode` above:
# `required` + `taskRuns.enabled: false` is refused at dispatch
# (`RenderValidationError::MissingDelegatedRuntimeClass`) and produces zero
# Jobs, which is the outage this default pairing caused on 2026-07-29.
cgroupWritable:
  runtimeClass:
    enabled: true
  taskRuns:
    enabled: true

# -----------------------------------------------------------------------------
# Server deployment
# -----------------------------------------------------------------------------
# Availability-first rolling update. Coordinator leadership is gated by a
# Postgres advisory lock, so a brief two-pod overlap during a deploy is safe and
# no topology is forbidden: replicas and rollout settings are free knobs.
server:
  replicas: 1
  # jemalloc configuration for every djinn-server process in the Deployment,
  # including the migrate-only initContainer. Quote this because commas and
  # colons are meaningful to YAML while MALLOC_CONF requires them literally.
  mallocConf: "background_thread:true,dirty_decay_ms:10000,muzzy_decay_ms:10000"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# -----------------------------------------------------------------------------
# Namespace
# -----------------------------------------------------------------------------
namespace:
  # When true the chart renders a Namespace object. Turn off if you manage the
  # namespace externally (GitOps, Terraform, `kubectl create ns`).
  create: true
  # Namespace the chart's resources land in. Defaults to the Release namespace
  # when empty.
  name: djinn

# -----------------------------------------------------------------------------
# ServiceAccounts
# -----------------------------------------------------------------------------
serviceAccount:
  # SA the djinn-server controller Deployment runs under. Has namespaced RBAC
  # to create + delete Jobs/Pods/Secrets (for task-run dispatch) plus a
  # cluster-scoped binding for TokenReview (for validating worker tokens).
  controller: djinn-controller
  # SA mounted into task-run Job Pods. Has no RBAC — the projected token
  # (audience `djinn`) is presented to djinn-server, which resolves identity
  # via the cluster TokenReview API.
  taskrun: djinn-taskrun
  # Provider-agnostic annotation maps applied to each SA. Operators populate
  # these with whatever their environment needs:
  #   * EKS IRSA       — eks.amazonaws.com/role-arn: arn:aws:iam:...
  #   * GKE Workload
  #     Identity       — iam.gke.io/gcp-service-account: <sa>@<project>.iam.gserviceaccount.com
  #   * AKS Workload
  #     Identity       — azure.workload.identity/client-id: <uuid>
  # The chart stays cloud-neutral; nothing here is rendered when the map is
  # empty (the local-dev install path).
  controllerAnnotations: {}
  taskrunAnnotations: {}

# -----------------------------------------------------------------------------
# Service (for djinn-server)
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  # Worker RPC port — task-run pods dial this to establish the bincode-over-TCP
  # reverse-RPC channel back to djinn-server.
  rpcPort: 8443
  # HTTP API / UI port.
  apiPort: 3000

# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------
resources:
  server:
    requests:
      # CPU requests are the CFS weight under contention. At 250m-500m the
      # server lost enough CPU during compile storms (a full worker fleet
      # linking at once) to fail its readiness probe — transient 521s observed
      # in production. 1 core was still not enough: with five task-run pods
      # bursting past their requests the server missed 1s-deadline health
      # probes for minutes at a stretch and was liveness-killed ~10×/day,
      # orphaning every running session. 2 cores keeps the control plane
      # responsive through full-fleet link storms.
      cpu: "2"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  # Resource sizing the controller stamps onto the task-run Job PodSpecs it
  # dispatches. These size the EPHEMERAL worker Pods djinn-server spawns, NOT
  # the long-lived server Deployment above (that's `resources.server`). They
  # reach the running server as the DJINN_K8S_CPU/MEMORY_{REQUEST,LIMIT} env
  # vars emitted by templates/deployment-server.yaml, and the k8s runtime
  # stamps them onto every task-run Pod it creates.
  #
  # Rationale for low requests / high limits (proven on a single 12-CPU/47Gi
  # VPS node running several concurrent workers): keep requests small so many
  # Pods schedule onto one node, and set limits high so a cargo build/link
  # burst can spike into the node's idle headroom. Workers idle-wait on the
  # LLM most of the time, so their steady-state footprint sits far below the
  # limit — over-committing the node is safe and lets more work run in
  # parallel.
  taskrun:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      # CARGO_BUILD_JOBS / NEXTEST_TEST_THREADS derive from this CPU limit
      # (PR #1896), so it bounds per-pod compile parallelism. At limit 6 a full
      # fleet of 8 workers compiling simultaneously drove load 55-68 on 12
      # cores and starved the readiness probes; at limit 4 the plateau is ~39,
      # which the node tolerates. Keep memory high — a cargo link burst still
      # needs the headroom.
      cpu: "4"
      memory: "22Gi"
    # Pod scheduling for both task-run and warm Jobs. Warm Pods pre-warm the
    # graph cache that task-runs later adopt, so they MUST land on the same
    # NodePool — that's why one set of hints covers both.
    #
    # Typical use case: a dedicated Karpenter NodePool tainted
    # `workload-type=djinn:NoSchedule` and labelled `workload-type=djinn`.
    # Set nodeSelector to target it and add the matching toleration:
    #
    #   nodeSelector:
    #     workload-type: djinn
    #   tolerations:
    #     - key: workload-type
    #       operator: Equal
    #       value: djinn
    #       effect: NoSchedule
    #
    # Empty defaults leave the fields unset — any node that the Pod's other
    # constraints allow is eligible (preserves the pre-feature behavior).
    nodeSelector: {}
    tolerations: []

  # Resource sizing for graph-warm Jobs — the short-lived Pods that populate
  # the canonical graph cache a later task-run adopts. These reach the running
  # server as the DJINN_K8S_WARM_* env vars emitted by
  # templates/deployment-server.yaml and are stamped onto every warm Pod.
  #
  # Same low-request / high-limit rationale as `taskrun` above: SCIP indexer
  # subprocesses (rust-analyzer, scip-go, ...) spike CPU/memory during a warm
  # pass but idle otherwise, so a small request packs Pods onto a node while a
  # high limit lets a burst use the idle headroom. Warm Jobs run in the
  # background and don't gate worker latency, so over-committing is safe.
  warm:
    requests:
      cpu: "2"
      memory: "2Gi"
    limits:
      # Same per-pod compile-parallelism bound as `taskrun` above: warm passes
      # compile the workspace too, and CARGO_BUILD_JOBS / NEXTEST_TEST_THREADS
      # derive from this limit (PR #1896). Limit 4 keeps a warm-plus-worker
      # fleet under the ~39 plateau the 12-core node tolerates instead of the
      # 55-68 spike seen at limit 6.
      cpu: "4"
      memory: "16Gi"
    # Max wall-clock seconds a warm Job may run before the kubelet terminates
    # it (activeDeadlineSeconds), surfaced as DJINN_K8S_WARM_JOB_TIMEOUT_SECONDS.
    # This one deadline covers BOTH halves of the warm Pod's work: the cargo
    # pass AND the SCIP indexing + graph publication that follow it in the same
    # Pod. A complete production warm measured on 2026-07-27 spent 1798s in
    # cargo and 3644s in the graph phase — 5442s end to end. 7200s (120 min)
    # covers that with ~29 min of margin. The previous 3600s default only ever
    # accounted for the cargo half, so any workspace of that size was SIGKILLed
    # at 60 minutes on every warm and published no server index. Raise it if a
    # larger workspace consistently hits the deadline.
    #
    # This is the ONLY warm wall-clock knob that matters: it is the Job's
    # activeDeadlineSeconds, it drives the in-process warm watcher deadline
    # (that value plus a fixed 300s slack), and it is projected into the warm
    # Pod as DJINN_WARM_JOB_DEADLINE_SECONDS, where the in-Pod per-step cargo
    # budgets clamp against it. A step can therefore never be given a bound
    # that outlives the deadline which would kill the Pod anyway; to give the
    # test-binary compile more room, raise this rather than a per-step override.
    jobTimeoutSeconds: 7200
    # Shared graph-warm/SCIP SIGTERM window. Internal child stop/reap and
    # inventory cleanup are bounded to 8s total and must finish before this.
    terminationGracePeriodSeconds: 30

# -----------------------------------------------------------------------------
# Node-local durable pod-log collector (disabled until the host store exists)
# -----------------------------------------------------------------------------
# This is deliberately a single-node DaemonSet contract: Vector reads kubelet's
# pod log files and sends only sanitized NDJSON to the localhost rotator. The
# rotator is the sole writer of the caller-prepared retained host directory.
# Scheduling follows task-run placement so the collector and task workloads use
# the same explicitly selected node pool.
logCollector:
  enabled: false
  # Both images must have a release tag. `latest` is rejected by the schema.
  vectorImage: timberio/vector:0.43.1-debian
  rotatorImage: ghcr.io/djinnos/djinn-log-rotator:0.1.0
  # Caller must create this directory with ownership/mode suitable for uid 10002
  # before enabling collection; the DaemonSet refuses hostPath auto-creation.
  storePath: /var/lib/djinn-observability
  # Vector uses a best-effort disk buffer on an emptyDir, never the retained
  # store. Full buffers drop new records rather than propagating backpressure to
  # application containers through kubelet log files.
  bufferMiB: 64
  resources:
    vector:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    rotator:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
# -----------------------------------------------------------------------------
# Incident monitoring (operator opt-in)
# -----------------------------------------------------------------------------
# The monitoring stack keeps seven days of pod-local state. Its webhook URL is
# read solely from an operator-owned Secret, never from a Helm value.
monitoring:
  enabled: false
  prometheus:
    image: prom/prometheus:v2.54.1
    retention: 7d
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 2Gi}
  alertmanager:
    image: prom/alertmanager:v0.27.0
    # Required when enabled; key contains a full HTTPS webhook URL.
    webhookSecret: {name: "", key: url}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  alerts: {dispatchStarts: 3, memoryPressureThreshold: 0.85}
# -----------------------------------------------------------------------------
# Storage
# -----------------------------------------------------------------------------
# RWX is required for the mirrors PVC on multi-node clusters — the controller
# writes mirror clones and task-run Job Pods read from them. The cache PVC is
# similarly RWX so cargo/pnpm/pip caches survive across task runs.
#
# -----------------------------------------------------------------------------
# `size:` IS A REQUEST, NOT A QUOTA. READ THIS BEFORE RAISING ONE.
# -----------------------------------------------------------------------------
# Every `size:` below lands in `spec.resources.requests.storage` on a PVC. What
# that means depends entirely on the provisioner:
#
#   local-path (k3s / kind — the default on the VPS): the provisioner mkdirs a
#     directory on the node filesystem and hands it over. It applies no quota of
#     any kind. The number is ADVISORY. Measured on the production VPS:
#     `djinn-zot` and `djinn-cache` are declared 40Gi and each holds 83G. No
#     layer complains, because no layer is checking.
#   CSI block volumes (EBS, PD, Ceph RBD, Longhorn, TopoLVM …): the number IS
#     enforced — the filesystem is exactly that big and writes past it get
#     ENOSPC. Undersizing here is a hard outage, not a warning.
#
# So a number in this file is either meaningless or dangerous, never a
# backstop. Two consequences the chart deliberately accepts:
#
#  1. These defaults are NOT raised to match observed production usage. On a
#     non-expandable StorageClass (local-path is non-expandable) `helm upgrade`
#     with a larger request is REJECTED by the API server, wedging the release.
#     Growing a number that enforces nothing is not worth breaking upgrades for.
#  2. The real bound is on the PRODUCERS, not the volumes: Zot tag/cache
#     retention (`imagePipeline.zot.retention`), `cacheCleanup.mode`,
#     `graphRetention`, and node-level kubelet image GC + eviction thresholds.
#     Those are the things that actually stop growth. See
#     `docs/deploy/vps.md` for the operator-side quota and alerting options,
#     including why the chart does not ship a PVC-fullness alert it cannot
#     actually make fire.
storage:
  # ---------------------------------------------------------------------------
  # Volume ownership contract (task pwrr / goxi)
  # ---------------------------------------------------------------------------
  # The mirrors/cache/projects volumes are written by TWO identities: the server
  # (uid `ownerUid`) and the task-run + warm Job Pods (uid/gid 1000, plus the
  # launcher-spawned child at uid 1001 with primary group 1000). They can only
  # share those volumes if everything on them is group-owned by `artifactGid`
  # and group-writable, with setgid on directories so newly created files
  # INHERIT that group instead of the creator's.
  #
  # The chart guarantees this for a fresh install by normalizing the three
  # volume ROOTS in the `fix-volume-perms` initContainer (O(1), non-recursive)
  # and by giving the server pod supplementary membership in `artifactGid`.
  # The worker binary re-validates the mounted result at startup and fails
  # readiness if it does not hold — see
  # `docs/VOLUME_OWNERSHIP_CONTRACT_RUNBOOK.md` for the one-time remediation of
  # volumes that predate this contract.
  ownership:
    # GID that owns every artifact on the shared volumes. MUST equal
    # `djinn_cgroup_launcher::child::ARTIFACT_GID` (the fsGroup the task-run and
    # warm Pod renders pin). Changing it here without changing the binary
    # constant breaks the contract in both directions.
    artifactGid: 1000
    # UID the djinn-server process runs as; it stays the owner of the volume
    # roots so the server keeps unrestricted access to its own directories.
    ownerUid: 10001
    # Mode applied to the volume roots: setgid + rwxrwxr-x.
    dirMode: "2775"
    # Normalize the volume roots on every server pod start. Idempotent and O(1)
    # — it touches the three roots only, never their contents. Disable only if
    # an external process owns volume provisioning.
    normalizeRoots: true
  # Mirrors are shared between the server (writer) and image-build + task-run
  # Jobs (readers). In prod this requires RWX storage; on single-node clusters
  # like kind, RWO PVCs work because RWO is enforced per-node, not per-pod.
  mirrors:
    size: 50Gi
    storageClassName: ""   # "" → use cluster default. Must satisfy RWX on multi-node.
    accessMode: ReadWriteMany
    # Set to reuse a pre-existing PVC instead of rendering one from this chart.
    existingClaim: ""
  cache:
    size: 20Gi
    storageClassName: ""
    accessMode: ReadWriteMany
    existingClaim: ""
  # Reference working clones populated by `project_add_from_github`. Mounted
  # at /var/lib/djinn/projects and referenced by project.path in the
  # database, so it must survive pod restarts. RWX is required on multi-node
  # clusters: the surge rollout (maxSurge=1) briefly runs two server pods that
  # both mount this PVC and may land on different nodes. Only the leader pod
  # writes it; the standby pod reads, and the overlap is bounded to a deploy
  # window. On single-node clusters (kind, values.local.yaml) RWO still works
  # because RWO is enforced per-node, not per-pod.
  # NOTE: accessMode is immutable on an existing PVC — a projects PVC
  # previously provisioned as RWO must be recreated/migrated to take RWX.
  projects:
    size: 20Gi
    storageClassName: ""
    accessMode: ReadWriteMany
    existingClaim: ""

# -----------------------------------------------------------------------------
# Secrets
# -----------------------------------------------------------------------------
secrets:
  githubApp:
    # If non-empty, the Deployment mounts the named Secret instead of a
    # chart-rendered one. The Secret must expose the same keys listed below.
    existingSecret: ""
    # Literal values. When existingSecret is empty, the chart renders a Secret
    # only if at least one value below is non-empty. All-empty means the Secret
    # source is absent (required by manifest self-setup); any partial set means
    # configuration was attempted and is exposed to the server for fatal
    # validation. Leave blank in VCS; set via `--set` or a local override file.
    appId: ""
    privateKey: ""
    clientId: ""
    clientSecret: ""
  vaultKey:
    existingSecret: ""
    # Base64-encoded 32-byte AES key used by djinn-db's credential vault.
    # When empty, the chart self-provisions: on first install it generates a
    # fresh 32-byte key via Sprig `randBytes`, and on subsequent `helm upgrade`
    # runs it looks up and preserves the existing Secret's value so data
    # already encrypted under that key stays decryptable. Set this to pin a
    # specific key (e.g. to share across environments or restore from backup).
    key: ""
  # Provider API keys bootstrapped into the encrypted credential vault at
  # server startup. Each non-empty value lands as an env var on the djinn-
  # server pod (keyed by the builtin provider's `required_env_vars`). The
  # server's `bootstrap_env_credentials` pass upserts them into the vault
  # so dispatch-time lookups resolve without any UI interaction.
  #
  # Leave everything blank to rely on ChatGPT / Codex sign-in through the
  # SPA (device-code flow) — that path doesn't use any of these fields.
  providers:
    # If set, mount this pre-existing Secret instead of chart-rendering one.
    # The Secret must expose the same keys listed below (ANTHROPIC_API_KEY,
    # OPENAI_API_KEY, …).
    existingSecret: ""
    anthropicApiKey: ""
    openaiApiKey: ""
    googleApiKey: ""
    azureOpenaiApiKey: ""
    awsAccessKeyId: ""
    awsSecretAccessKey: ""
    gcpVertexProjectId: ""

# -----------------------------------------------------------------------------
# Langfuse (LLM observability) — OTLP export from djinn-server
# -----------------------------------------------------------------------------
# djinn-server initialises OpenTelemetry only when both public + secret keys
# are set. Leave blank to disable. The chart renders a Secret with
# DJINN_LANGFUSE_{PUBLIC,SECRET}_KEY and injects it via envFrom.
langfuse:
  enabled: false
  # OTLP endpoint. For self-hosted Langfuse this is
  # http://<langfuse-web-svc>:3000/api/public/otel.
  endpoint: ""
  # Langfuse project keys (pk-lf-... / sk-lf-...). When existingSecret is
  # non-empty, the chart mounts that instead of rendering one; the Secret
  # must carry DJINN_LANGFUSE_PUBLIC_KEY + DJINN_LANGFUSE_SECRET_KEY.
  publicKey: ""
  secretKey: ""
  existingSecret: ""

# -----------------------------------------------------------------------------
# Ingress (opt-in)
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  host: ""
  # Extra annotations (e.g. cert-manager issuer).
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# -----------------------------------------------------------------------------
# Postgres 16 (bundled SQL state)
# -----------------------------------------------------------------------------
# Stock upstream `postgres:16` running as a single-replica StatefulSet. The
# server speaks plain Postgres protocol via sqlx; deadlock detection is
# reliable (SQLSTATE 40P01) and JSONB columns avoid the LONGTEXT-string
# round-trips MySQL forced on us.
#
# For staging / prod, set `postgres.enabled: false` and provide
# `database.externalUrl` or `database.existingSecret` below — the
# StatefulSet + Service won't render and the server dials your RDS
# endpoint instead.
postgres:
  # Set to false to use an external Postgres (RDS, Cloud SQL, etc.).
  # Mutually exclusive with database.externalUrl / database.existingSecret —
  # the chart will render the bundled StatefulSet only when enabled is true.
  enabled: true
  image: postgres:16
  auth:
    # Password for the bundled `djinn` Postgres user. Empty string falls
    # back to a chart-default ("djinn-local-dev") suitable ONLY for
    # kind / local-dev. Set a real password for any cluster reachable
    # outside the namespace.
    password: ""
  # Service name + port exposed inside the cluster. Consumed by djinn-server
  # via the DJINN_DATABASE_URL env computed in configmap.yaml.
  service:
    port: 5432
  storage:
    size: 20Gi
    accessMode: ReadWriteOnce
    storageClassName: ""
  # Surfaced as `-c key=value` args on the postgres process. shared_buffers
  # at 2G matches the prior MySQL footprint; max_connections=200 leaves
  # headroom over the server's pool (100) + migrate initContainer (1) +
  # worker pool (<=16) + ad-hoc tooling.
  config:
    sharedBuffers: 2GB
    maxConnections: 200
  resources:
    requests:
      # CPU request is the CFS weight under contention. At 500m the bundled
      # Postgres lost CPU during compile storms and pg_isready probes timed
      # out; pin to 1 full core so SQL stays responsive while task-run pods
      # burst. Keep limits as-is.
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

# -----------------------------------------------------------------------------
# Database connection (external override)
# -----------------------------------------------------------------------------
# When `postgres.enabled: false`, the server needs to know how to reach the
# external Postgres. Two mutually-exclusive ways to specify it:
#
#   1. externalUrl: literal URL string (rendered into the chart ConfigMap).
#      Convenient for staging but bakes the password into the rendered
#      Helm release. Format:
#        postgres://user:password@host:5432/dbname?sslmode=require
#
#   2. existingSecret: name of an existing Kubernetes Secret with a `url`
#      key holding the full Postgres URL. The Deployment's bootstrap, migrate,
#      and app containers pull DJINN_DATABASE_URL via `valueFrom: secretKeyRef`, so
#      the URL never lands in a ConfigMap or in `helm get values` output. Preferred
#      for RDS credentials (typically provisioned out-of-band in a vault).
#
# Set exactly one. When `postgres.enabled: true`, both should be empty.
database:
  externalUrl: ""
  existingSecret: ""

# Required on fresh installs and optional on upgrades. This caller-owned Secret
# contains user_id, github_id, and github_login for the explicit designated
# operator. Bootstrap and migrate consume it, but the app container never does.
# An already-current database can therefore upgrade after this value is removed.
migration:
  designatedOperatorSecret: ""

# -----------------------------------------------------------------------------
# Qdrant (bundled vector store)
# -----------------------------------------------------------------------------
qdrant:
  enabled: true
  image: qdrant/qdrant:latest
  service:
    httpPort: 6333
    grpcPort: 6334
  storage:
    size: 10Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

# -----------------------------------------------------------------------------
# Server env
# -----------------------------------------------------------------------------
env:
  rustLog: "info,djinn=debug"
  # Public base URL (used for GitHub App callback + browser redirects). When
  # empty the Deployment omits the env var and djinn-server falls back to its
  # own default (`http://127.0.0.1:3000`, appropriate only for local dev).
  publicUrl: ""
  webUrl: ""
  # When true, djinn-server exposes a token-gated GitHub App manifest setup
  # flow (setup routes, /auth/config hints, /setup/status). When false (the
  # production default), setup routes are hidden and the server continues to
  # load GitHub App credentials from the mounted Secret only. This flag is
  # rendered into the server ConfigMap as DJINN_ENABLE_SELF_SETUP.
  enableSelfSetup: false
  # Allow binding the deployment to a personal GitHub account (installation
  # account type `User`) as well as an organization. Intended for local/solo
  # evaluation; production remains organization-only by default.
  allowUserInstallations: false

# Arbitrary extra env injected into the server container. Useful for ad-hoc
# tuning knobs without re-templating.
extraEnv: []
# - name: FOO
#   value: bar

# Extra `envFrom` sources merged into the server container after the
# chart-rendered ConfigMap. Useful when an out-of-band sync (Doppler
# operator, External Secrets Operator, Vault Agent Injector, ...) lands a
# fat env-bag Secret in the namespace that you'd rather mount whole than
# wire as N individual `extraEnv` entries via `valueFrom.secretKeyRef`.
# Each entry is a standard core/v1 EnvFromSource (configMapRef / secretRef).
extraEnvFrom: []
# - secretRef:
#     name: djinn-env
# - configMapRef:
#     name: extra-config

# Node placement (applied to djinn-server Deployment).
nodeSelector: {}
tolerations: []
affinity: {}

# Labels merged onto every chart-managed resource.
labels: {}

# -----------------------------------------------------------------------------
# Image pipeline (Phase 3): BuildKit daemon + Zot registry + image controller
# -----------------------------------------------------------------------------
# Per-project devcontainer images are built by a reconciling image-controller
# that drives `devcontainer build` in a Job against a shared rootless BuildKit
# daemon and pushes the result to an in-cluster Zot registry. Kubernetes Jobs
# for task runs pull from Zot at dispatch time.
#
# Node prerequisites for rootless BuildKit (see README.md):
#   sysctl kernel.unprivileged_userns_clone=1
#   sysctl user.max_user_namespaces=28633   # or higher
imagePipeline:
  enabled: true
  # Host:port where the controller + buildkitd push/pull per-project images.
  # Leave empty to derive from the Release name and namespace
  # (`<release>-zot.<ns>.svc.cluster.local:<zot.port>`). Set this to an
  # external registry (ECR, GHCR, a TLS-fronted Zot) to bypass the in-cluster
  # Zot Service entirely.
  registryHost: ""
  # tcp:// endpoint of the BuildKit daemon. Leave empty to derive from the
  # Release name and namespace (`tcp://<release>-buildkitd.<ns>.svc.cluster.local:<buildkitd.port>`).
  # Set to an external buildkitd to bypass the in-cluster daemon.
  buildkitdHost: ""
  # Pinned reference to the djinn-agent-worker devcontainer Feature. Consumed
  # by generated `.devcontainer/devcontainer.json` starter files (PR 6) and
  # by PR 5's build Job env.
  featureRef: "ghcr.io/djinnos/djinn-agent-worker:1"
  buildkitd:
    # djinn-buildkitd = moby/buildkit:rootless + ECR/GCR/ACR credential
    # helpers baked in (see server/docker/djinn-buildkitd.Dockerfile).
    # Override to plain moby/buildkit:rootless for the no-credHelpers path.
    image: ghcr.io/djinnos/djinn-buildkitd:latest
    # gRPC port exposed on the buildkitd Service. Consumed by the build Job
    # via DOCKER_HOST=tcp://<svc>:<port>.
    port: 1234
    # When Zot is served plaintext (local/kind), buildkitd needs a
    # per-registry `http = true` entry so its push step doesn't negotiate
    # TLS. Set to `false` in environments where Zot is fronted with TLS
    # (Ingress + cert-manager / ACM / etc.) or where the target registry
    # is a managed HTTPS service (ECR, GHCR). Changing this toggles the
    # `buildkitd-config` ConfigMap + mount on/off.
    zotPlaintext: false
    # Per-registry credential-helper map rendered into the docker config.json
    # that buildkitd mounts at /home/user/.docker/config.json. Format:
    #   <registry-host>: <helper-binary-suffix>
    # e.g.
    #   "981534455912.dkr.ecr.us-east-1.amazonaws.com": ecr-login
    #   "us-east1-docker.pkg.dev":                       gcr
    #   "myacr.azurecr.io":                              acr-env
    # When non-empty, the chart-rendered config.json carries credHelpers
    # instead of the inline Zot username/password. The helper binaries live
    # in the djinn-buildkitd image; cloud identity (IRSA, Workload Identity,
    # etc.) flows in via the SA annotations above.
    credHelpers: {}
    # Health-probe tuning for the single shared buildkitd. The probe is a
    # `buildctl debug workers` gRPC round-trip; a busy daemon (e.g. mid-build
    # under a concurrent-rebuild herd) can be slow to answer it even while
    # perfectly healthy. The k8s defaults (timeoutSeconds 1, failureThreshold
    # 3) once had the kubelet liveness-kill a merely-busy buildkitd, dropping
    # every in-flight build with `GOAWAY graceful_stop`. These generous
    # defaults stop that; tune per cluster if needed.
    probes:
      # Seconds the kubelet waits for `buildctl debug workers` to answer
      # before counting the probe as failed. Default k8s is 1s — far too
      # tight for a loaded daemon.
      timeoutSeconds: 10
      # Consecutive readiness/liveness failures tolerated before the pod is
      # marked unready / restarted. Default k8s is 3.
      failureThreshold: 6
      # How often readiness + startup probes run.
      periodSeconds: 30
      # Liveness probes less aggressively than readiness so transient load
      # spikes pull the pod out of the Service (readiness) long before they
      # can trigger a restart (liveness).
      livenessPeriodSeconds: 60
      # Startup probe failures tolerated before liveness takes over. With
      # periodSeconds 30 this is a generous ~10min window for a cold daemon
      # (warming the OCI worker, restoring cache) to come up.
      startupFailureThreshold: 20
    # buildkitd is the single shared build engine; a concurrent-build herd
    # is CPU- and memory-hungry. These defaults are sized to survive a burst
    # without the kubelet OOM/CPU-starving the daemon into a probe-kill loop.
    # The image controller's maxConcurrentBuilds cap keeps the herd bounded.
    resources:
      requests:
        cpu: "2"
        memory: "2Gi"
      limits:
        cpu: "6"
        memory: "10Gi"
  zot:
    # In-cluster Zot OCI registry. Off by default — most cloud deployments
    # use a managed registry (ECR/GCR/ACR) via `buildkitd.credHelpers`.
    # Flip to true for local/kind/air-gapped installs.
    enabled: false
    image: ghcr.io/project-zot/zot-linux-amd64:v2.1.0
    # HTTP port exposed on the Zot Service. v1 OCI distribution spec.
    port: 5000
    # Allow anonymous pulls (no auth challenge) for in-cluster image
    # pulls. Writes still require htpasswd credentials. Useful when
    # kubelet pulls per-project devcontainer images built by the image
    # pipeline — avoids wiring pull-secrets onto every Job Pod Spec.
    # Leave false in environments where image confidentiality matters.
    anonymousPull: false
    # Zot retention policies. Two repo families grow without bound and each
    # needs a DIFFERENT policy shape, because they grow differently:
    #
    #   djinn-image-*  Shared catalog image repos. Every content hash pushes a
    #                  NEW TAG and nothing removes the old ones. Growth vector
    #                  = tag count → newest-N tag retention (`newestTags`).
    #   cache/*        BuildKit registry cache repos. `build_job.rs` exports
    #                  `--export-cache type=registry,ref=<reg>/cache/<subject>,
    #                  mode=max`, which rewrites the SAME `:latest` ref on every
    #                  build. Tag count is pinned at one, so newest-N does
    #                  nothing here. Growth vector = the SUPERSEDED MANIFEST
    #                  each export leaves behind, untagged but still indexed and
    #                  therefore still pinning its blobs → `deleteUntagged`
    #                  (see `retention.cache` below).
    #
    # Neither family is bounded by `gc: true` alone. Live blob GC only reclaims
    # blobs no manifest references, and untagged-but-indexed manifests still
    # reference theirs — measured on the production VPS as 0.0 GiB reclaimed
    # while the store kept growing.
    #
    # Safety model:
    # - `retention.enabled` controls whether the policy is rendered into
    #   zot-configmap at all. When false, no retention policy exists and the
    #   repo grows without bound — a shipped `enabled: false` default meant
    #   every cluster silently accumulated every catalog manifest ever built.
    #   The shipped default is therefore `enabled: true` PAIRED WITH
    #   `dryRun: true`: a cluster REPORTS its retention plan instead of
    #   growing silently, and still deletes nothing until an operator
    #   explicitly opts in with `--set imagePipeline.zot.retention.dryRun=false`.
    # - `retention.dryRun` (default true) puts Zot in dry-run mode: it reports
    #   what it WOULD delete but does not actually delete. Safe to enable
    #   alongside monitoring without risk.
    # - `retention.deleteUntagged` (default true) tells Zot to also delete
    #   manifests with no remaining tags after tag pruning.
    # - `retention.newestTags` (default 5) is the number of newest tags to keep
    #   per catalog repo.
    #
    # The image-controller preflight gate (retention_preflight) independently
    # verifies that every currently-selected catalog image remains pullable
    # by retained tag or digest pin BEFORE destructive deletion can proceed.
    # If the preflight finds an unsafe image, it blocks and reports —
    # destructive retention never silently removes a selected image.
    #
    # NOTE: that preflight covers `djinn-image-*` ONLY. It reads the DB's
    # selected-catalog-image set; it knows nothing about `cache/*`, and it
    # needs nothing, because no database row and no kubelet pull ever
    # references a cache repo — the only reader is buildctl's `--import-cache`.
    retention:
      enabled: true
      dryRun: true
      deleteUntagged: true
      newestTags: 5
      # BuildKit registry cache retention (`cache/*`). Default ON, and — like
      # the catalog policy — governed by the SHARED `dryRun` flag above, so it
      # ships report-only and deletes nothing until an operator opts in once
      # for both. Zot's `dryRun` is a single retention-block-level switch; it
      # cannot be set per policy. Set `cache.enabled: false` to roll the
      # catalog policy destructive while leaving cache repos untouched.
      #
      # The rendered policy is `deleteUntagged: true` plus a catch-all
      # `keepTags` rule, i.e. "retain every tag, collect superseded
      # manifests". It targets the actual growth vector and it cannot touch
      # the live `:latest` cache ref.
      #
      # Worst case is a cache MISS, never a failed build:
      #  * The live ref is never a candidate (catch-all keepTags), so the
      #    common path is untouched.
      #  * A superseded manifest becomes a candidate only after the
      #    retention `delay` (1h) and its blobs only vanish after `gcDelay`
      #    (1h) on the next `gcInterval` (24h) sweep. A build resolves and
      #    fetches its cache in seconds.
      #  * Even a total miss is a proven-safe state: the FIRST build of every
      #    project already imports a cache ref that does not exist yet, and
      #    those builds succeed. buildctl treats an unresolvable
      #    `--import-cache` as "no cache", not as an error.
      #
      # Byte reclamation is deliberately not promised. `storage.dedupe: true`
      # means a `mode=max` cache blob and an identical `djinn-image-*` layer
      # blob are the same stored object; deleting a cache manifest frees
      # nothing for blobs a live catalog manifest still references, and vice
      # versa. The two policies are complementary — pruning only one side
      # leaves shared blobs alive through the other side's references.
      cache:
        enabled: true
    # ---------------------------------------------------------------------
    # Declared PVC size is a REQUEST, not a quota. See the top-level
    # `storage:` block's preamble for the full explanation.
    # ---------------------------------------------------------------------
    # On the k3s/kind `local-path` provisioner this number is advisory only —
    # nothing enforces it, and a Zot PVC declared 40Gi will happily hold 83G.
    # The bound that actually holds is the retention policy above, not this
    # field. Do not treat a larger number here as a fix.
    storage:
      size: 100Gi
      storageClassName: ""   # "" → cluster default
      accessMode: ReadWriteOnce
      existingClaim: ""
    auth:
      # When non-empty, the chart mounts this pre-existing Secret instead of
      # rendering one from the inline values. The caller-owned Secret must
      # carry `htpasswd` (bcrypt'd user:pass) and `config.json` (docker auth
      # config) for Zot/buildkitd, plus plaintext `username` and `password`
      # keys for the server's Zot retention-preflight HTTP Basic auth. The
      # `username`/`password` key names are the chart contract and are wired
      # only with SecretKeyRefs (never into a ConfigMap). Set `auth.username`
      # to the same username stored in the caller-owned Secret so Zot's access
      # policy permits the preflight request.
      existingSecret: ""
      # Default credentials used by buildkitd + image-controller to push/pull.
      # Overridden via --set or a secrets-only values file at install time.
      username: "djinn"
      password: "djinn"
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
  controller:
    # PR 5 replaces this with the real image-controller binary. Until then the
    # Deployment renders as a busybox sleep stub so the rest of the chart can
    # be installed + iterated on.
    image: "busybox:1.36"
    # Cluster-wide cap on concurrent project-image build Jobs, wired to the
    # server via DJINN_IMAGE_MAX_CONCURRENT. The image controller counts
    # live build Jobs each reconcile pass and defers new builds once this
    # many are in flight, so a mass rebuild can't starve the single shared
    # buildkitd into a liveness-probe-kill crash loop. Deferred projects are
    # re-evaluated on later reconcile ticks as slots free. Keep this low
    # relative to buildkitd's CPU limit.
    maxConcurrentBuilds: 4
    # Launcher authority protocol every image this deployment BUILDS declares in
    # its own OCI metadata (`djinn.app/launcher-authority-protocol`), wired to
    # the server via DJINN_IMAGE_LAUNCHER_AUTHORITY_PROTOCOL.
    #
    #   leaf-v1   (default) the djinn-cgroup-launcher shipped in the image owns
    #             each invocation leaf's `cpu.max`. What every image built
    #             before this knob existed declares.
    #   resize-v2 Kubernetes in-place Pod resize owns CPU quota; the launcher
    #             must never write leaf `cpu.max`.
    #
    # This is the producer half of the resize cutover: it changes what NEW
    # artifacts claim. Flipping it changes each catalog image's environment
    # hash, so every image is rebuilt under a new content-addressed tag rather
    # than being relabelled — a cached leaf-v1 artifact can never be served as
    # resize-v2. Expect a full rebuild of the catalog after changing it, and
    # sequence it against the cluster-wide launcher_authority_mode row: images
    # declaring a protocol the mode does not admit are refused at dispatch.
    # Fresh installs declare Kubernetes resize authority. This is coherent with
    # the armed cgroup-launcher defaults above; explicit rollback remains
    # available through the durable launcher-authority admin command.
    launcherAuthorityProtocol: "resize-v2"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  # Builder image (Node + docker CLI + buildx + @devcontainers/cli) baked by
  # server/docker/djinn-image-builder.Dockerfile. Pinned here for PR 5 build
  # Jobs; no template in this chart references it directly — the controller
  # reads it from env and plugs it into the Job PodSpec at dispatch time.
  builderImage: "ghcr.io/djinnos/djinn-image-builder:latest"
