# Overrides for kind / single-node local-dev clusters.
#
# Usage:
#   helm install djinn deploy/helm/djinn \
#     --values deploy/helm/djinn/values.local.yaml \
#     --namespace djinn --create-namespace
#
# Assumptions: images have been built locally and pushed to the in-cluster
# registry at localhost:5001. Tilt hot-rebuilds the `:dev` tag in place on
# source changes, so pullPolicy must be Always — otherwise kubelet reuses
# the cached layer and new pods boot the stale binary. Pull is cheap since
# the registry is intra-cluster.

image:
  server: localhost:5001/djinn-server:dev
  # `kind-registry:5000` and `localhost:5001` point at the same registry
  # (the kind-registry container is attached to both the bridge and kind
  # Docker networks — `scripts/kind/setup-kind.sh`). We prefer the
  # `kind-registry` name because BuildKit inside the cluster resolves it
  # over cluster DNS; kubelet on the kind node resolves it via Docker's
  # embedded DNS. `localhost:5001` only works for containerd's mirror
  # lookup, not for BuildKit's resolver — so any ref that gets embedded
  # in a generated Dockerfile (for `COPY --from=<ref>`) must use the
  # `kind-registry` form or buildctl fails with "connection refused".
  runtime: kind-registry:5000/djinn-agent-runtime:dev
  pullPolicy: Always

# Kind uses rancher.io/local-path as the default storage class, which
# dynamically provisions hostPath-backed PVs under the kind node. Since
# kind is single-node, ReadWriteOnce PVCs can be shared across the server
# Pod and any build/task-run Jobs (RWO is enforced per-node, not per-pod).
# Using real PVCs here keeps the local chart shape identical to prod —
# every consumer (server Deployment, image-build Job, task-run Job)
# mounts via claimName, no hostPath branches in code.
storage:
  mirrors:
    accessMode: ReadWriteOnce
    size: 10Gi
  cache:
    accessMode: ReadWriteOnce
    size: 5Gi
  projects:
    accessMode: ReadWriteOnce
    size: 10Gi

ingress:
  enabled: false

# GitHub App credentials: when self-setup is enabled (see env.enableSelfSetup
# below), the server exposes a token-gated manifest flow on first boot so no
# manual credential files are needed. The `.tilt/github-app/` path with
# `helm --set-file` is still supported as an override/fallback for operators
# who already have credentials, but it is NOT the default local self-serve
# path. Leave `secrets.githubApp` empty here so the chart omits the
# Secret/env/path surface; the Tiltfile overrides fields when local files exist.
# Supplying only some files still counts as attempted configuration and remains
# a fatal server-side validation error.

# Tighter resource defaults so the whole stack fits on a laptop.
# Server limit accounts for the in-process nomic-embed model (~1GB FP32)
# + SQLx pool + OTEL + actors. 4Gi was OOMing during the embedding
# repair loop on projects with large notes; 6Gi gives headroom.
resources:
  server:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "6Gi"
  taskrun:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"
  # The default 2-CPU request cannot schedule on the single-node local cluster
  # once the control plane and observability stack are running. Keep the burst
  # limit high, but request only the capacity the laptop can reliably reserve.
  warm:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "6"
      memory: "16Gi"

# Local-dev Postgres footprint — shared_buffers + connections tuned down
# so the whole stack still fits on a laptop. Defaults from the chart
# (2GB / 200 conns, 2Gi/4Gi) are sized for production; halve them here.
postgres:
  config:
    sharedBuffers: 512MB
    maxConnections: 100
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  storage:
    size: 5Gi
    accessMode: ReadWriteOnce

qdrant:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  storage:
    size: 2Gi
    accessMode: ReadWriteOnce

# Self-hosted Langfuse is deployed alongside djinn by the Tiltfile
# (deploy/langfuse-local/langfuse.yaml). The pk/sk here match the ones
# LANGFUSE_INIT_PROJECT_{PUBLIC,SECRET}_KEY seed on first Langfuse boot.
langfuse:
  enabled: true
  endpoint: "http://langfuse-web.djinn.svc.cluster.local:3000/api/public/otel"
  publicKey: "pk-lf-djinn-local-dev"
  secretKey: "sk-lf-djinn-local-dev-secret"

# Kind's default CSI driver is `standard` (rancher.io/local-path). Pin the
# Zot PVC to it so `kind` clusters bind without hunting for the cluster
# default, and drop the size way down so the whole stack fits on a laptop.
imagePipeline:
  # In-kind, use the host-side kind-registry container for BOTH builder
  # pushes AND kubelet pulls. Both paths can reach it:
  #   * BuildKit pods resolve kind-registry over cluster DNS (the container
  #     is attached to the kind Docker network at 172.29.0.3).
  #   * kubelet on the kind node resolves kind-registry via Docker's
  #     embedded DNS on the same network.
  # The in-cluster Zot is unreachable from kubelet because its ClusterIP
  # is on the service network (10.96.0.0/16) which only pods can route to.
  registryHost: "kind-registry:5000"
  # Local-built builder image (see Tiltfile's djinn-image-builder-image
  # resource). ghcr.io/djinnos/djinn-image-builder:latest is org-private;
  # anonymous pulls 401 inside kind. Override to the in-cluster registry.
  builderImage: "localhost:5001/djinn-image-builder:dev"
  buildkitd:
    # The chart default (ghcr.io/djinnos/djinn-buildkitd:latest) only
    # publishes linux/amd64 — on Apple Silicon the kind node is arm64 and
    # the pull fails with "no match for platform in manifest". The baked-in
    # cloud credential helpers are unused locally (Zot auths via htpasswd),
    # so plain multi-arch moby/buildkit:rootless is the supported fallback.
    image: docker.io/moby/buildkit:v0.15.2-rootless
    # Local Zot serves plaintext HTTP over ClusterIP — tell buildkitd to
    # not expect TLS. Prod environments that front Zot with an Ingress +
    # TLS should leave this at its chart default (false).
    zotPlaintext: true
    # Additional registries that must be treated as plain-HTTP by the
    # daemon's resolver (used by `COPY --from=<ref>` in generated
    # Dockerfiles). kind-registry is the host's kind-registry container,
    # reachable over the kind Docker network at this name.
    insecureRegistries:
      - kind-registry:5000
  zot:
    # kubelet on the kind node pulls per-project devcontainer images from
    # this registry; wiring pull-secrets onto every Job is more friction
    # than letting local-only Zot serve anonymous reads. Writes still need
    # htpasswd (buildkitd has credentials).
    anonymousPull: true
    storage:
      storageClassName: standard
      size: 5Gi

env:
  rustLog: "info,djinn=debug"
  # Browser-side OAuth callback URL. For kind + `kubectl port-forward`, the
  # browser reaches the server at http://localhost:3000 — NOT the cluster-
  # internal Service DNS the configmap default would compute. Match this
  # value against your GitHub App's "Callback URL" setting at
  # https://github.com/settings/apps/<your-app>/edit (the path is
  # `/auth/github/callback`).
  publicUrl: "http://localhost:3000"
  # `DJINN_WEB_URL` is what the server 302s to after OAuth succeeds. The
  # SPA is served same-origin by djinn-server on :3000 (rust-embed of
  # ui/dist), so this matches publicUrl.
  webUrl: "http://localhost:3000"
  # Enable the token-gated GitHub App manifest setup flow for local/Tilt.
  # On first boot the server prints a setup URL to the log; no manual
  # `.tilt/github-app/` credential files are needed. Operators who already
  # have credentials can still override via the Tiltfile's --set-file path.
  enableSelfSetup: true
  # Local contributors commonly install the generated App on their personal
  # GitHub account. Production values keep this organization-only.
  allowUserInstallations: true
