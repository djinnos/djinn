# Test-only Postgres instance for `cargo test` and sqlx macro compilation.
#
# The full dev stack (djinn-server, dev Postgres, Qdrant) runs inside the kind
# cluster managed by `tilt up` — see the Tiltfile at the repo root. The
# one thing Tilt does NOT run is this isolated test DB, because
# `cargo test` spins up ~250 ephemeral `djinn_test_*` DBs per crate and
# must stay off the shared dev DB.
#
# Consumed by Makefile targets: `test-db-migrate`, `test-db-reset`,
# `test`, `test-all`, `sqlx-prepare`, `sqlx-check`. The workspace
# `.cargo/config.toml` defaults DATABASE_URL to `:5433` so every cargo
# invocation in the repo hits this instance by default.

services:
  postgres-test:
    image: postgres:16
    container_name: djinn-postgres-test
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=500
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      # wal_level=minimal + max_wal_senders=0 must be set together (Postgres
      # refuses to start with minimal WAL and a non-zero walsender budget).
      # This is the precondition for `CREATE DATABASE … STRATEGY = FILE_COPY`
      # in server/crates/djinn-db/src/database.rs: nothing streams or archives
      # this cluster's WAL, so there is no reason to WAL-log a template clone
      # block by block. Mirrored in scripts/ci-start-postgres.sh.
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      # Nothing in this cluster lives long enough to need vacuuming, and
      # autovacuum workers otherwise chase thousands of short-lived
      # `djinn_test_*` databases.
      - -c
      - autovacuum=off
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: djinn
    ports: ["127.0.0.1:5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
