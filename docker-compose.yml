# Test-only MySQL instance for `cargo test` and sqlx macro compilation.
#
# The full dev stack (djinn-server, dev MySQL, Qdrant) runs inside the kind
# cluster managed by `tilt up` — see the Tiltfile at the repo root. The
# one thing Tilt does NOT run is this isolated test DB, because
# `cargo test` spins up ~250 ephemeral `djinn_test_*` DBs per crate and
# must stay off the shared dev DB.
#
# Consumed by Makefile targets: `test-db-migrate`, `test-db-reset`,
# `test`, `test-all`, `sqlx-prepare`, `sqlx-check`. The workspace
# `.cargo/config.toml` defaults DATABASE_URL to `:3308` so every cargo
# invocation in the repo hits this instance by default.

services:
  mysql-test:
    image: mysql:8.4
    container_name: djinn-mysql-test
    command:
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-buffer-pool-size=512M
      - --skip-log-bin
      - --max-connections=500
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: djinn
    ports: ["127.0.0.1:3308:3306"]
    tmpfs: ["/var/lib/mysql"]
