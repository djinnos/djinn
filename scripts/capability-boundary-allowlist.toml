# Capability-boundary allowlist.
#
# Each [[entries]] block grants a narrow, auditable exemption for a specific
# capability usage in a specific file.  Entries must be exact: reviewers should
# be able to see exactly why a file+matcher is exempt.
#
# Schema:
#   capability      = "git" | "http" | "k8s"
#   path            = exact file path (e.g. "server/crates/foo/src/bar.rs");
#                     broad globs like "server/crates/**" are forbidden except
#                     narrow synthetic fixture globs used by self-tests.
#   matcher         = exact substring matched by the detector (e.g. "git2::").
#   owner           = team or individual responsible for the cleanup.
#   rationale       = short justification for the exemption.
#   expires         = ISO-8601 date after which the exemption is stale; OR
#   cleanup_issue    = link to a tracking issue for the cleanup.
#
# At least one of "expires" or "cleanup_issue" must be present.
#
# Verification commands used after the Wave 1 migrations (cgcl, 58ml, x8y8, 7chr):
#   find server -name '*.rs' | sh scripts/check-git-boundary.sh --files-from-stdin
#   find server -name '*.rs' | sh scripts/check-http-boundary.sh --files-from-stdin
#   find server -name '*.rs' | sh scripts/check-k8s-boundary.sh --files-from-stdin

# ── Synthetic fixture entry ────────────────────────────────────────────────
# Used by the shared guard self-test even though the fixture file is generated
# at test time; keeping it lets the self-test assert allowlist hits without
# depending on a real production file.

[[entries]]
capability = "git"
	path = "server/crates/djinn_capability_guard_fixture/src/allowed.rs"
	matcher = "git2::"
	owner = "team/capability-guard-self-test"
	rationale = "Synthetic allowlist fixture for the shared guard self-test."
	expires = "2099-12-31"

# ── Remaining git baseline after Wave 1 migrations ────────────────────────
# Wave 1 (cgcl, 58ml, cmsf/yrqd/84cm/ttgg) eliminated the non-owner git
# shell-outs in djinn-graph and djinn-agent-worker. The only remaining non-owner
# git usage is the libgit2 worktree probe in dispatch/retry.rs and the local
# test-only helper in preapproval_gate.rs. Both are owned by team/coordinator;
# retry.rs is a still-pending owner-crate migration, while preapproval_gate.rs
# is a test-local helper.

[[entries]]
capability = "git"
	path = "server/crates/djinn-coordinator/src/dispatch/retry.rs"
	matcher = "git2::"
	owner = "team/coordinator"
	rationale = "Still-pending owner-crate migration: worktree dirty-state probe in coordinator dispatch. Must be routed through djinn-git once djinn-git exposes a synchronous worktree-status helper."
	cleanup_issue = "epic/fztz"

[[entries]]
capability = "git"
	path = "server/crates/djinn-coordinator/src/preapproval_gate.rs"
	matcher = "Command::new(\"git\")"
	owner = "team/coordinator"
	rationale = "Test-local helper for creating temporary git repos in unit tests. Not used by production preapproval logic."
	cleanup_issue = "epic/fztz"
