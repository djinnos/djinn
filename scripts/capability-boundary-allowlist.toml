# ── Remaining HTTP baseline after Wave 1 migrations ───────────────────────
# Wave 1 (x8y8) moved control-plane toolchain-version HTTP client construction
# behind djinn-provider. Wave 2 (srqd) moved the server GitHub/auth/org-sync
# outbound clients behind djinn-provider. The remaining non-owner HTTP usage
# is limited to status/error-value-only usage inside owner crates and tests
# where the detector does not flag it.

# ── Remaining K8s baseline after Wave 1 migrations ────────────────────────
# Wave 1 (7chr) routed token-review Kubernetes access through djinn-k8s. The
# remaining non-owner K8s usage is the image-controller (large deferred
# migration); the server state module was migrated (ouss) and its entry
# removed.
#
# The image-controller entries are intentionally narrow (exact file + matcher)
# and point to the committed inventory at
# server/docs/capability-boundaries/image-controller-k8s-inventory.md for the
# per-file pattern breakdown, the adapter path, and the distinction between
# production code and test-only fixtures. They share owner team/image-controller
# and cleanup epic/fztz.

[[entries]]
capability = "k8s"
	path = "server/crates/djinn-image-controller/src/build_job.rs"
	matcher = "k8s_openapi"
	owner = "team/image-controller"
	rationale = "Production: image-controller build-job constructs Kubernetes API objects (Job, ConfigMap, PodSpec) directly. Temporarily allowed while the dedicated image-controller-to-djinn-k8s adapter is designed. See server/docs/capability-boundaries/image-controller-k8s-inventory.md section 1."
