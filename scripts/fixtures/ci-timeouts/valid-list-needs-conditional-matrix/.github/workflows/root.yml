jobs:
  qa-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps: [{run: true}]
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [qa-smoke, matrix-job]
    steps: [{run: true}]
  matrix-job:
    if: ${{ always() }}
    strategy: {matrix: {node: [20, 22]}}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps: [{run: true}]
